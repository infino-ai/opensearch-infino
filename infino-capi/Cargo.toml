[package]
name = "infino-capi"
version = "0.1.0"
edition = "2021"
description = "C-ABI bridge over the Infino engine, for the Infino for OpenSearch plugin"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `remote` is the engine's hosted client: a `https://host/<database>` URI
# with a key forwards every table operation to the hosted service, so a
# node whose account is set up holds no table data of its own.
# `graph-index` serves the graph walks (`graph_walk`, `graph_rank`) to SQL and
# builds an edge table's adjacency index on optimize.
# Pinned exactly: 0.11.25 bounds the hosted client's waits, and 0.11.26 writes
# the manifest list format 4.0, which earlier builds cannot read.
infino = { version = "=0.11.27", features = ["remote", "graph-index"] }
# serde_json comes re-exported from infino, so the two never disagree.
# Same major as infino so the delete-predicate Expr is the same type infino expects.
datafusion = "54"
# Documents of one batch are parsed and conformed in parallel before the
# engine's single append; the engine's own build runs on rayon as well.
rayon = "1"
# The trial is the one hosted route the engine's client does not carry: it
# asks for a key, so it cannot go through a connection that needs one. The
# same crate and features the engine's hosted client is built on.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# The engine's allocator is mimalloc, built here as its 2.x line. The 3.x line
# the binding builds by default crashes (SIGSEGV in `_mi_subproc`) when a JVM
# thread it did not create makes its first call into this library; 2.x serves
# those threads and is as fast here. Cargo builds the binding once with the
# union of every dependent's features, so naming it here moves the engine's too.
libmimalloc-sys = { version = "0.1", features = ["v2"] }

# The engine's own release profile: thin LTO across the engine and its
# dependencies, one codegen unit. A dependency's profile does not apply to
# the crate that builds it, so without this the binding builds with Cargo's
# defaults (no LTO, sixteen codegen units).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
