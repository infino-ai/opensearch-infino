[package]
name = "infino-capi"
version = "0.1.0"
edition = "2021"
description = "Thin C-ABI bridge over the Infino engine, for the OpenSearch-on-Infino spike"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `remote` is the engine's hosted client: a `https://host/<database>` URI
# with a key forwards every table operation to the hosted service, so a
# node whose account is set up holds no table data of its own.
infino = { version = "0.11.12", features = ["remote"] }
# serde_json comes re-exported from infino, so the two never disagree.
# Same major as infino so the delete-predicate Expr is the same type infino expects.
datafusion = "54"
# Documents of one batch are parsed and conformed in parallel before the
# engine's single append; the engine's own build runs on rayon as well.
rayon = "1"
# The trial is the one hosted route the engine's client does not carry: it
# asks for a key, so it cannot go through a connection that needs one. The
# same crate and features the engine's hosted client is built on.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[patch.crates-io]
# Until the engine release that forwards the schema document and schema
# patches over the hosted transport; the pin above then moves to that
# version and this block goes.
infino = { git = "https://github.com/infino-ai/infino.git", branch = "remote/schema-document" }
