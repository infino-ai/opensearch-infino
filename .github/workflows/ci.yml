name: CI

# The check a pull request must pass before it merges: the native bridge built from the lockfile,
# then the plugin's `gradle check` (precommit, unit tests, and the REST suites on a test cluster
# with the bridge) against the default OpenSearch release. Other releases are covered by
# scripts/check-all.sh.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain the Docker image builds the bridge with.
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: infino-capi

      - name: Build the native bridge
        working-directory: infino-capi
        run: cargo build --release --locked

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.4.1'

      - name: gradle check
        working-directory: plugin
        run: gradle --no-daemon check
