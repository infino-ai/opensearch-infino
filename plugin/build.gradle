import org.opensearch.gradle.test.RestIntegTestTask

// Standalone build against a released OpenSearch: no source checkout needed.
// Pick the target with -Dopensearch.version=<release>; the plugin zip only
// installs into that exact version.
buildscript {
    ext {
        opensearch_version = System.getProperty("opensearch.version", "3.9.0")
    }
    repositories {
        mavenLocal()
        maven { url = "https://ci.opensearch.org/maven2/" }
        maven { url = "https://ci.opensearch.org/m2/" }
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
    }
}

apply plugin: 'java'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'opensearch.yaml-rest-test'
// The Java agent replaced the security manager in 3.x; 2.x build tools have no such
// plugin, and every later major is taken to have it.
if (!opensearch_version.startsWith('2.')) {
    apply plugin: 'opensearch.java-agent'
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

// The security plugin's document- and field-level rules are enforced from
// its own evaluation. On 3.x the plugin reads that evaluation off the
// components the security plugin registers with the node (found by class
// name, called by reflection), so it neither compiles against the security
// plugin nor extends it: the 3.0 one cannot be extended at all. On 2.x the
// rules arrive as thread-context headers and a request under one is refused.
def securityVersion = "${opensearch_version}.0"
def (versionMajor, versionMinor) = opensearch_version.tokenize('.')[0..1].collect { it as int }
// The security plugin extends the rule-framework module from 3.3, which the
// distributions ship but the test distributions only from 3.6; before that
// the test cluster gets it as a module built from the published jars.
def needsRuleFrameworkModule = versionMajor == 3 && versionMinor >= 3 && versionMinor < 6

opensearchplugin {
    name = 'infino-engine'
    description = 'Back OpenSearch shards with the Infino engine (JNA bridge)'
    classname = 'org.opensearch.infino.InfinoPlugin'
    licenseFile = rootProject.file('LICENSE.txt')
    noticeFile = rootProject.file('NOTICE.txt')
}

// Two classes exist per release line: the one reading the security plugin's
// rules (its own evaluation on 3.x, the thread context on 2.x) and the one
// holding the node client (whose package moved in 3.0). The tree for the
// target release joins the build.
sourceSets.main.java.srcDirs += versionMajor >= 3 ? 'src/main/security3' : 'src/main/security2'
sourceSets.main.java.srcDirs += versionMajor >= 3 ? 'src/main/client3' : 'src/main/client2'
// The action filters' base: 3.4 and later call a filter with the request's
// metadata and mark the call without it for removal; earlier releases make
// only that call.
sourceSets.main.java.srcDirs += versionMajor > 3 || (versionMajor == 3 && versionMinor >= 4) ? 'src/main/filter34' : 'src/main/filter33'

configurations {
    securityPlugin
    ruleFramework
    knnPlugin
}

repositories {
    mavenLocal()
    maven { url = "https://ci.opensearch.org/maven2/" }
    maven { url = "https://ci.opensearch.org/m2/" }
    mavenCentral()
    maven { url = "https://plugins.gradle.org/m2/" }
}

dependencies {
    // OpenSearch ships JNA itself; compiling against it (not bundling) avoids jar hell.
    compileOnly "net.java.dev.jna:jna:${versions.jna}"
    // The security plugin of the target release, installed on every test cluster.
    securityPlugin "org.opensearch.plugin:opensearch-security:${securityVersion}@zip"
    // The k-NN plugin of the target release, installed on the knn suites' test
    // cluster only: it owns the knn_vector mapping and the stock knn query,
    // which those suites send to an Infino-backed index and to a Lucene twin alike.
    knnPlugin "org.opensearch.plugin:opensearch-knn:${opensearch_version}.0@zip"
    // The rule-framework module the security plugin depends on from 3.3; the
    // test distributions before 3.6 ship without it, so it is built into a
    // module from its published jars (see ruleFrameworkModule).
    if (needsRuleFrameworkModule) {
        ruleFramework("org.opensearch.plugin:rule-framework:${opensearch_version}") {
            // The server's own library; a second copy in the module is jar hell.
            exclude group: 'org.opensearch', module: 'opensearch-common'
        }
    }
}

configurations.all {
    resolutionStrategy {
        // The test framework and the server disagree on these annotation-only jars.
        force "com.google.errorprone:error_prone_annotations:${versions.error_prone_annotations}"
        force "org.jspecify:jspecify:1.0.1"
    }
}

// Needs a jar that build-tools does not publish.
loggerUsageCheck.enabled = false
// No Maven publication of this plugin.
validateNebulaPom.enabled = false

test {
    include '**/*Tests.class'
}

// Where the sibling Rust build leaves the native bridge, and a catalog on local
// disk for the test cluster (memory:// tables cannot take deletes). Both can be
// pointed elsewhere with -Dinfino.lib / -Dinfino.uri.
def defaultLib = file("${projectDir}/../infino-capi/target/release/libinfino_capi.so").absolutePath
def defaultData = "${layout.buildDirectory.get().asFile.absolutePath}/infino-catalog"
def defaultUri = "file://${defaultData}"
// The same Rust build leaves a program that makes a table as one outside the plugin
// would (infino-capi/src/bin/outside_table.rs); -Dinfino.fixture points elsewhere.
def defaultFixture = file("${projectDir}/../infino-capi/target/release/outside_table").absolutePath
interface FixtureRunner {
    @javax.inject.Inject
    ExecOperations getExecOps()
}
def fixtureRunner = objects.newInstance(FixtureRunner)

// The unit tests that read through the engine load the same bridge; their
// tables stay in memory (memory://, the default catalog).
test {
    systemProperty 'infino.lib', System.getProperty('infino.lib', defaultLib)
}

// The stock knn suites need the k-NN plugin, which owns the knn_vector mapping
// and the knn query and extends lang-painless (and transport-grpc on 3.x):
// modules only the full archive distribution carries. So those suites run in
// a task of their own, on a cluster of the archive with the k-NN plugin, and
// every other suite keeps the integration-test distribution without it. The
// knn cluster keeps its own catalog, so neither cluster sees the other's tables.
def knnTask = 'knnYamlRestTest'
def knnSuite = 'infino/100_knn'
def knnTests = 'org.opensearch.infino.InfinoStockKnnIT'
def knnData = "${layout.buildDirectory.get().asFile.absolutePath}/infino-catalog-knn"

// Default mode with a replica needs a second node: a copy recovers from the
// primary's history, and a replica takes over as primary. That test runs in
// a task of its own, on a two-node cluster over one catalog both nodes
// share, as the hosted service's tables are shared by every node.
def replicaTask = 'engineReplicaTest'
def replicaTests = 'org.opensearch.infino.InfinoEngineReplicaIT'
def replicaData = "${layout.buildDirectory.get().asFile.absolutePath}/infino-catalog-replica"
// The YAML suites' runner, which the knn task runs over its own suite.
def yamlSuiteRunner = 'org.opensearch.infino.InfinoClientYamlTestSuiteIT'
// Writes that arrive at every node of a cluster need more than one node: a
// table is written by the node holding its index's primary, and the others
// send their writes there. That test runs in a task of its own, on a
// two-node cluster over one catalog both nodes share.
def multiNodeTask = 'multiNodeTest'
def multiNodeTests = 'org.opensearch.infino.InfinoMultiNodeWriteIT'
def multiNodeData = "${layout.buildDirectory.get().asFile.absolutePath}/infino-catalog-multinode"

// The test cluster runs the security plugin, enabled, with the demo node
// certificates on the transport layer and plain HTTP with basic
// authentication: the suites run as admin, and the security suite sends
// its requests as restricted users. The security plugin's own index is
// Infino-backed like every other, which is part of what the suites verify.
def securityResources = file("${projectDir}/src/yamlRestTest/resources/security")

// OpenSearch's own YAML REST suites, copied from the release's rest-api-spec
// artifact, over the APIs the plugin answers in place of Lucene. They run in
// tasks of their own (one per mode), outside check: the denylist that lets
// them pass is chosen test by test, in core-denylist.txt.
def coreSuites = [
    'index', 'create', 'get', 'get_source', 'exists', 'mget', 'bulk', 'update', 'delete',
    'count', 'search', 'search.aggregation', 'scroll', 'msearch', 'field_caps',
    'indices.get_mapping', 'indices.get_settings', 'indices.update_aliases',
]
restResources {
    restTests {
        includeCore(*coreSuites)
    }
}
def coreTask = 'coreYamlRestTest'
def coreProxyTask = 'coreYamlRestTestProxy'
def coreLuceneTask = 'coreYamlRestTestLucene'
def coreTests = 'org.opensearch.infino.InfinoCoreYamlTestSuiteIT'
// Each core-denylist.txt entry is `pattern  # [tag] reason`; the file's header
// says what the tags mean. -Dinfino.core.skip chooses how much each task skips:
// all (the default), gaps (everything but the known bugs, so those run),
// or none.
def coreSkip = System.getProperty('infino.core.skip', 'all')
// Read and checked when a core task runs, so a malformed line or a wrong
// infino.core.skip fails that run alone, not every build.
def coreDenylistFile = file("${projectDir}/src/yamlRestTest/core-denylist.txt")
def coreDenylist = { -> coreDenylistFile.readLines()
    .collect { it.trim() }
    .findAll { it && !it.startsWith('#') }
    .collect { line ->
        def m = line =~ /^(.+?)\s+#\s*\[(gap|by-design|bug|cluster)(?::(default|proxy))?\]\s*\S.*$/
        if (!m.matches() || (m.group(2) == 'cluster' && m.group(3))) {
            throw new GradleException("core-denylist.txt: no [tag] and reason: ${line}")
        }
        [pattern: m.group(1), kind: m.group(2), mode: m.group(3)]
    }
}
// The entries a task in this mode skips, as tests.rest.denylist takes them: the
// runner reads each pattern as a regular expression (with * for any run within
// one path segment) and splits the list on unescaped commas, while test names
// hold dots, parentheses and commas meant literally.
def coreDenylistFor = { String mode ->
    if (!(coreSkip in ['all', 'gaps', 'none'])) {
        throw new GradleException("infino.core.skip is all, gaps or none, not ${coreSkip}")
    }
    coreDenylist().findAll { e ->
        if (e.kind == 'cluster') {
            return coreSkip != 'none'
        }
        mode != 'lucene' && (e.mode == null || e.mode == mode) && (coreSkip == 'all' || (coreSkip == 'gaps' && e.kind != 'bug'))
    }.collect { e ->
        e.pattern.replaceAll('[\\\\^$.|?+()\\[\\]{},]') { '\\' + it }
    }.unique()
}

// The rule-framework module as the distribution lays it out: its jars and a
// descriptor, zipped the way the test cluster installs a module.
def ruleFrameworkDescriptor = tasks.register('ruleFrameworkDescriptor', WriteProperties) {
    destinationFile = layout.buildDirectory.file('rule-framework/plugin-descriptor.properties')
    property 'name', 'rule-framework'
    property 'description', 'OpenSearch Rule Framework plugin'
    property 'version', opensearch_version
    property 'opensearch.version', opensearch_version
    property 'java.version', '21'
    property 'classname', 'org.opensearch.rule.RuleFrameworkPlugin'
}
def ruleFrameworkModule = tasks.register('ruleFrameworkModule', Zip) {
    archiveFileName = "rule-framework-${opensearch_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('rule-framework')
    from(configurations.ruleFramework)
    from(ruleFrameworkDescriptor)
}

testClusters.all {
    // Installed as a plugin, ahead of the security plugin: the test cluster
    // lays its modules down only after the plugin installer has run, and the
    // installer checks the security plugin's dependencies against what is
    // installed by then.
    if (needsRuleFrameworkModule) {
        plugin(ruleFrameworkModule.flatMap { it.archiveFile })
    }
    // The integration-test distribution before 3.6 leaves out the
    // ingest-common module, whose processors (set, drop, fail) the ingest
    // suite's pipelines use; the archive carries every module.
    if (versionMajor < 3 || (versionMajor == 3 && versionMinor < 6)) {
        testDistribution = 'ARCHIVE'
    }
    systemProperty 'infino.lib', System.getProperty('infino.lib', defaultLib)
    systemProperty 'infino.uri', System.getProperty('infino.uri', defaultUri)
    // The security policy grants the file catalog's directory by this property.
    systemProperty 'infino.data', System.getProperty('infino.data', defaultData)
    // The SQL each request runs, in the node log, so a wrong answer can be read back.
    setting 'logger.org.opensearch.infino', 'DEBUG'

    plugin(layout.file(provider { configurations.securityPlugin.singleFile }))
    // Plain HTTP with basic authentication; the build's own wait for cluster
    // health sends no credentials, so the anonymous user may read it (see the
    // cluster_health role in the security configuration).
    setting 'plugins.security.disabled', 'false'
    setting 'plugins.security.ssl.http.enabled', 'false'
    setting 'plugins.security.ssl.transport.pemcert_filepath', 'esnode.pem'
    setting 'plugins.security.ssl.transport.pemkey_filepath', 'esnode-key.pem'
    setting 'plugins.security.ssl.transport.pemtrustedcas_filepath', 'root-ca.pem'
    setting 'plugins.security.ssl.transport.enforce_hostname_verification', 'false'
    setting 'plugins.security.allow_unsafe_democertificates', 'true'
    setting 'plugins.security.allow_default_init_securityindex', 'true'
    setting 'plugins.security.authcz.admin_dn', 'CN=kirk,OU=client,O=client,L=test,C=de'
    // The security suite creates an API token through the security plugin's
    // REST API, which admits a user by role.
    setting 'plugins.security.restapi.roles_enabled', '["all_access"]'
    extraConfigFile 'esnode.pem', file("${securityResources}/certs/esnode.pem")
    extraConfigFile 'esnode-key.pem', file("${securityResources}/certs/esnode-key.pem")
    extraConfigFile 'root-ca.pem', file("${securityResources}/certs/root-ca.pem")
    fileTree("${securityResources}/opensearch-security").each { f ->
        if (f.name != 'config.yml') {
            extraConfigFile "opensearch-security/${f.name}", f
        }
    }
    // The releases whose security plugin issues API tokens (3.9 and later, as
    // far as the matrix knows) authenticate them too, so the suite can send one.
    def apiTokens = versionMajor > 3 || (versionMajor == 3 && versionMinor >= 9)
    extraConfigFile 'opensearch-security/config.yml', file(apiTokens ? "${securityResources}/config-api-tokens.yml" : "${securityResources}/opensearch-security/config.yml")
}

// The cluster is made while the build is evaluated, as the YAML suites' own is:
// one made later, when the task is first configured, misses its distribution.
testClusters.maybeCreate(knnTask)
testClusters.matching { it.name == knnTask }.all {
    testDistribution = 'ARCHIVE'
    plugin(layout.file(provider { configurations.knnPlugin.singleFile }))
    // Build-tools installs this plugin on the YAML suites' cluster only; this
    // one takes it after the plugins it may extend.
    plugin(tasks.named('bundlePlugin').flatMap { it.archiveFile })
    systemProperty 'infino.uri', System.getProperty('infino.uri', "file://${knnData}")
    systemProperty 'infino.data', System.getProperty('infino.data', knnData)
}

testClusters.maybeCreate(replicaTask)
testClusters.matching { it.name == replicaTask }.all {
    numberOfNodes = 2
    plugin(tasks.named('bundlePlugin').flatMap { it.archiveFile })
    systemProperty 'infino.uri', System.getProperty('infino.uri', "file://${replicaData}")
    systemProperty 'infino.data', System.getProperty('infino.data', replicaData)
    // A refresh waits this long for copies that never hold the writes, as the test's replica does not.
    systemProperty 'infino.engine.copies.wait.ms', '3000'
}

testClusters.maybeCreate(multiNodeTask)
testClusters.matching { it.name == multiNodeTask }.all {
    numberOfNodes = 2
    plugin(tasks.named('bundlePlugin').flatMap { it.archiveFile })
    systemProperty 'infino.uri', System.getProperty('infino.uri', "file://${multiNodeData}")
    systemProperty 'infino.data', System.getProperty('infino.data', multiNodeData)
}

// The stock suites' clusters, one per mode, each over its own catalog. The
// lucene one is the same cluster without the plugin: a test failing there
// fails for the cluster (the security plugin, the single node), not for Infino.
[(coreTask): 'default', (coreProxyTask): 'proxy', (coreLuceneTask): 'lucene'].each { name, mode ->
    def data = "${layout.buildDirectory.get().asFile.absolutePath}/infino-catalog-core-${mode}"
    testClusters.maybeCreate(name)
    testClusters.matching { it.name == name }.all {
        if (mode != 'lucene') {
            plugin(tasks.named('bundlePlugin').flatMap { it.archiveFile })
        }
        systemProperty 'infino.uri', System.getProperty('infino.uri', "file://${data}")
        systemProperty 'infino.data', System.getProperty('infino.data', data)
        // A refresh behind a write the table keeps refusing waits this long, not a
        // minute: the stock suites send such writes, and a stalled refresh should
        // fail its test rather than spend the suite's timeout.
        systemProperty 'infino.engine.copies.wait.ms', '3000'
        if (mode == 'proxy') {
            setting 'infino.default_mode.enabled', 'false'
        }
    }
    tasks.register(name, RestIntegTestTask) {
        description = mode == 'lucene'
            ? "Runs OpenSearch's own YAML REST suites on the same cluster without the plugin, as a baseline."
            : "Runs OpenSearch's own YAML REST suites with every index in ${mode} mode."
        group = 'verification'
        testClassesDirs = sourceSets.yamlRestTest.output.classesDirs
        classpath = sourceSets.yamlRestTest.runtimeClasspath
        systemProperty 'tests.rest.suite', coreSuites.join(',')
        inputs.file(coreDenylistFile)
        inputs.property('infino.core.skip', coreSkip)
        filter {
            includeTestsMatching coreTests
        }
        doFirst {
            def denylist = coreDenylistFor(mode)
            if (denylist) {
                systemProperty 'tests.rest.denylist', denylist.join(',')
            }
            delete data
        }
    }
}

// A run that dies before its shards are deleted leaves their tables; each run starts clean.
tasks.named('yamlRestTest').configure {
    // Only the plugin's own suites: the stock ones copied beside them run in the core tasks.
    systemProperty 'tests.rest.suite', 'infino'
    systemProperty 'tests.rest.denylist', "${knnSuite}/*"
    filter {
        excludeTestsMatching coreTests
        excludeTestsMatching knnTests
        excludeTestsMatching replicaTests
        excludeTestsMatching multiNodeTests
    }
    def catalog = System.getProperty('infino.uri', defaultUri)
    def fixture = System.getProperty('infino.fixture', defaultFixture)
    doFirst {
        delete layout.buildDirectory.dir('infino-catalog')
        // Tables made outside the plugin, in the catalog the node will open, for the suite that
        // attaches indices to them: the node itself only ever makes the plugin's tables. One a
        // test, so a test that fails with its index still there leaves the other's table free.
        fixtureRunner.execOps.exec {
            commandLine fixture, catalog, 'outside_pages', 'outside_pages_templated'
        }
    }
}

def knnYamlRestTest = tasks.register(knnTask, RestIntegTestTask) {
    description = 'Runs the stock knn suites on a cluster with the k-NN plugin.'
    group = 'verification'
    testClassesDirs = sourceSets.yamlRestTest.output.classesDirs
    classpath = sourceSets.yamlRestTest.runtimeClasspath
    systemProperty 'tests.rest.suite', knnSuite
    filter {
        includeTestsMatching yamlSuiteRunner
        includeTestsMatching knnTests
    }
    doFirst {
        delete knnData
    }
}

def engineReplicaTest = tasks.register(replicaTask, RestIntegTestTask) {
    description = 'Runs the default-mode replica tests on a two-node cluster.'
    group = 'verification'
    testClassesDirs = sourceSets.yamlRestTest.output.classesDirs
    classpath = sourceSets.yamlRestTest.runtimeClasspath
    filter {
        includeTestsMatching replicaTests
    }
    doFirst {
        delete replicaData
    }
}

def multiNodeTest = tasks.register(multiNodeTask, RestIntegTestTask) {
    description = 'Runs the multi-node write tests on a two-node cluster.'
    group = 'verification'
    testClassesDirs = sourceSets.yamlRestTest.output.classesDirs
    classpath = sourceSets.yamlRestTest.runtimeClasspath
    filter {
        includeTestsMatching multiNodeTests
    }
    doFirst {
        delete multiNodeData
    }
}
tasks.named('check').configure {
    dependsOn knnYamlRestTest
    dependsOn engineReplicaTest
    dependsOn multiNodeTest
}
