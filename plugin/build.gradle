apply plugin: 'opensearch.opensearchplugin'

opensearchplugin {
  name = 'infino-engine'
  description = 'Spike: back OpenSearch shards with the Infino engine (JNA bridge)'
  classname = 'org.opensearch.infino.InfinoPlugin'
  licenseFile = rootProject.file('licenses/APACHE-LICENSE-2.0.txt')
  noticeFile = rootProject.file('NOTICE.txt')
}

dependencies {
  compileOnly 'net.java.dev.jna:jna:5.16.0'
}

// --- spike: relax the strict plugin-dev gates so we can iterate fast ---
test.enabled = false
tasks.configureEach { t ->
  if (t.name in ['dependencyLicenses', 'thirdPartyAudit', 'forbiddenApisMain',
                 'forbiddenApisTest', 'loggerUsageCheck', 'validateNebulaPom',
                 'namingConventionsMain', 'licenseHeaders']) {
    t.enabled = false
  }
}
