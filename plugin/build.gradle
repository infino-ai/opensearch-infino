// Standalone build against a released OpenSearch: no source checkout needed.
// Pick the target with -Dopensearch.version=<release>; the plugin zip only
// installs into that exact version.
buildscript {
    ext {
        opensearch_version = System.getProperty("opensearch.version", "3.9.0")
    }
    repositories {
        mavenLocal()
        maven { url = "https://ci.opensearch.org/maven2/" }
        maven { url = "https://ci.opensearch.org/m2/" }
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
    }
}

apply plugin: 'java'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'opensearch.yaml-rest-test'
// The Java agent replaced the security manager in 3.x; 2.x build tools have no such
// plugin, and every later major is taken to have it.
if (!opensearch_version.startsWith('2.')) {
    apply plugin: 'opensearch.java-agent'
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

// The security plugin's document- and field-level rules are enforced from
// its own evaluation. On 3.x the plugin reads that evaluation off the
// components the security plugin registers with the node (found by class
// name, called by reflection), so it neither compiles against the security
// plugin nor extends it: the 3.0 one cannot be extended at all. On 2.x the
// rules arrive as thread-context headers and a request under one is refused.
def securityVersion = "${opensearch_version}.0"
def (versionMajor, versionMinor) = opensearch_version.tokenize('.')[0..1].collect { it as int }
// The security plugin extends the rule-framework module from 3.3, which the
// distributions ship but the test distributions only from 3.6; before that
// the test cluster gets it as a module built from the published jars.
def needsRuleFrameworkModule = versionMajor == 3 && versionMinor >= 3 && versionMinor < 6

opensearchplugin {
    name = 'infino-engine'
    description = 'Back OpenSearch shards with the Infino engine (JNA bridge)'
    classname = 'org.opensearch.infino.InfinoPlugin'
    licenseFile = rootProject.file('LICENSE.txt')
    noticeFile = rootProject.file('NOTICE.txt')
}

// Two classes exist per release line: the one reading the security plugin's
// rules (its own evaluation on 3.x, the thread context on 2.x) and the one
// holding the node client (whose package moved in 3.0). The tree for the
// target release joins the build.
sourceSets.main.java.srcDirs += versionMajor >= 3 ? 'src/main/security3' : 'src/main/security2'
sourceSets.main.java.srcDirs += versionMajor >= 3 ? 'src/main/client3' : 'src/main/client2'

configurations {
    securityPlugin
    ruleFramework
}

repositories {
    mavenLocal()
    maven { url = "https://ci.opensearch.org/maven2/" }
    maven { url = "https://ci.opensearch.org/m2/" }
    mavenCentral()
    maven { url = "https://plugins.gradle.org/m2/" }
}

dependencies {
    // OpenSearch ships JNA itself; compiling against it (not bundling) avoids jar hell.
    compileOnly "net.java.dev.jna:jna:${versions.jna}"
    // The security plugin of the target release, installed on every test cluster.
    securityPlugin "org.opensearch.plugin:opensearch-security:${securityVersion}@zip"
    // The rule-framework module the security plugin depends on from 3.3; the
    // test distributions before 3.6 ship without it, so it is built into a
    // module from its published jars (see ruleFrameworkModule).
    if (needsRuleFrameworkModule) {
        ruleFramework("org.opensearch.plugin:rule-framework:${opensearch_version}") {
            // The server's own library; a second copy in the module is jar hell.
            exclude group: 'org.opensearch', module: 'opensearch-common'
        }
    }
}

configurations.all {
    resolutionStrategy {
        // The test framework and the server disagree on these annotation-only jars.
        force "com.google.errorprone:error_prone_annotations:${versions.error_prone_annotations}"
        force "org.jspecify:jspecify:1.0.1"
    }
}

// Needs a jar that build-tools does not publish.
loggerUsageCheck.enabled = false
// No Maven publication of this plugin.
validateNebulaPom.enabled = false

test {
    include '**/*Tests.class'
}

// Where the sibling Rust build leaves the native bridge, and a catalog on local
// disk for the test cluster (memory:// tables cannot take deletes). Both can be
// pointed elsewhere with -Dinfino.lib / -Dinfino.uri.
def defaultLib = file("${projectDir}/../infino-capi/target/release/libinfino_capi.so").absolutePath
def defaultData = "${layout.buildDirectory.get().asFile.absolutePath}/infino-catalog"
def defaultUri = "file://${defaultData}"

// The test cluster runs the security plugin, enabled, with the demo node
// certificates on the transport layer and plain HTTP with basic
// authentication: the suites run as admin, and the security suite sends
// its requests as restricted users. The security plugin's own index is
// Infino-backed like every other, which is part of what the suites verify.
def securityResources = file("${projectDir}/src/yamlRestTest/resources/security")

// The rule-framework module as the distribution lays it out: its jars and a
// descriptor, zipped the way the test cluster installs a module.
def ruleFrameworkDescriptor = tasks.register('ruleFrameworkDescriptor', WriteProperties) {
    destinationFile = layout.buildDirectory.file('rule-framework/plugin-descriptor.properties')
    property 'name', 'rule-framework'
    property 'description', 'OpenSearch Rule Framework plugin'
    property 'version', opensearch_version
    property 'opensearch.version', opensearch_version
    property 'java.version', '21'
    property 'classname', 'org.opensearch.rule.RuleFrameworkPlugin'
}
def ruleFrameworkModule = tasks.register('ruleFrameworkModule', Zip) {
    archiveFileName = "rule-framework-${opensearch_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('rule-framework')
    from(configurations.ruleFramework)
    from(ruleFrameworkDescriptor)
}

testClusters.all {
    // Installed as a plugin, ahead of the security plugin: the test cluster
    // lays its modules down only after the plugin installer has run, and the
    // installer checks the security plugin's dependencies against what is
    // installed by then.
    if (needsRuleFrameworkModule) {
        plugin(ruleFrameworkModule.flatMap { it.archiveFile })
    }
    systemProperty 'infino.lib', System.getProperty('infino.lib', defaultLib)
    systemProperty 'infino.uri', System.getProperty('infino.uri', defaultUri)
    // The security policy grants the file catalog's directory by this property.
    systemProperty 'infino.data', System.getProperty('infino.data', defaultData)
    // The SQL each request runs, in the node log, so a wrong answer can be read back.
    setting 'logger.org.opensearch.infino', 'DEBUG'

    plugin(layout.file(provider { configurations.securityPlugin.singleFile }))
    // Plain HTTP with basic authentication; the build's own wait for cluster
    // health sends no credentials, so the anonymous user may read it (see the
    // cluster_health role in the security configuration).
    setting 'plugins.security.disabled', 'false'
    setting 'plugins.security.ssl.http.enabled', 'false'
    setting 'plugins.security.ssl.transport.pemcert_filepath', 'esnode.pem'
    setting 'plugins.security.ssl.transport.pemkey_filepath', 'esnode-key.pem'
    setting 'plugins.security.ssl.transport.pemtrustedcas_filepath', 'root-ca.pem'
    setting 'plugins.security.ssl.transport.enforce_hostname_verification', 'false'
    setting 'plugins.security.allow_unsafe_democertificates', 'true'
    setting 'plugins.security.allow_default_init_securityindex', 'true'
    setting 'plugins.security.authcz.admin_dn', 'CN=kirk,OU=client,O=client,L=test,C=de'
    extraConfigFile 'esnode.pem', file("${securityResources}/certs/esnode.pem")
    extraConfigFile 'esnode-key.pem', file("${securityResources}/certs/esnode-key.pem")
    extraConfigFile 'root-ca.pem', file("${securityResources}/certs/root-ca.pem")
    fileTree("${securityResources}/opensearch-security").each { f ->
        extraConfigFile "opensearch-security/${f.name}", f
    }
}

// A run that dies before its shards are deleted leaves their tables; each run starts clean.
tasks.named('yamlRestTest').configure {
    doFirst {
        delete layout.buildDirectory.dir('infino-catalog')
    }
}
