# A date_histogram with a time_zone puts its bucket boundaries on local time
# in that zone, top-level and as a composite source alike: a fixed offset
# (-01:00, +05:30) or a named zone that changes offset (America/New_York, whose
# clocks went forward on 2017-03-12 and back on 2017-11-05), at a calendar
# interval of a day or a month or at a fixed interval, with an offset and with
# a format for the key. A composite's after key is read with the source's
# format, as stock reads it: a date with no offset of its own is local time in
# the source's zone, and a source with no format reads epoch milliseconds only.
# Each request runs on a Lucene twin too, and the table's answer must be the twin's.
setup:
  - do:
      indices.create:
        index: tz_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { d: { type: date } } }
  - do:
      indices.create:
        index: tz_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { d: { type: date } } }
  - do:
      indices.create:
        index: tz_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { d: { type: date } } }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: tz_luc, _id: "1" }
          - { "d": "2017-10-20T03:08:45Z" }
          - index: { _index: tz_luc, _id: "2" }
          - { "d": "2017-10-21T07:00:00Z" }
