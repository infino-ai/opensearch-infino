---
# What a dashboard sends: a time_zone with extended_bounds in epoch milliseconds, which say
# where the request's dates fall. The bounds span New York's change of 2026-11-01 (06:00Z,
# clocks back an hour), so the dates on each side that are clear of it are floored in UTC with
# that side's offset, and the ones within a day after it are read through the zone. Dates sit
# just before and at local midnight on both sides, and every twenty minutes through the hour
# that happens twice.
"A zoned histogram with bounds across a clock change":
  - do:
      indices.create:
        index: tzb_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { d: { type: date } } }
  - do:
