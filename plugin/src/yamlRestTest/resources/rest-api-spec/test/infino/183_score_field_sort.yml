---
"A mixed sort the table cannot order as stock does is refused":
  - do:
      catch: bad_request
      search:
        index: ssort_proxy
        body:
          query: { match: { message: disk } }
          sort: [{ status: desc }, { _score: desc }]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.unless._score.is.the.first.sort.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_proxy
        body:
          query: { match: { message: disk } }
          sort: [{ _score: asc }, { seq: asc }]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with._score.ascending.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_proxy
        body:
          query: { match: { message: disk } }
          sort: [{ _score: desc }, { seq: asc }]
          collapse: { field: status }
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with.collapse.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_proxy
        body:
          query: { match: { message: disk } }
          sort: [{ _score: desc }, { seq: asc }]
          search_after: [1.0, 3]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with.search_after.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_proxy
        scroll: 1m
        body:
          query: { match: { message: disk } }
          sort: [{ _score: desc }, { seq: asc }]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with.scroll.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_default
        body:
          query: { match: { message: disk } }
          sort: [{ status: desc }, { _score: desc }]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.unless._score.is.the.first.sort.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_default
        body:
          query: { match: { message: disk } }
          sort: [{ _score: asc }, { seq: asc }]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with._score.ascending.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_default
        body:
          query: { match: { message: disk } }
          sort: [{ _score: desc }, { seq: asc }]
          collapse: { field: status }
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with.collapse.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_default
        body:
          query: { match: { message: disk } }
          sort: [{ _score: desc }, { seq: asc }]
          search_after: [1.0, 3]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with.search_after.*/" }
  - do:
      catch: bad_request
      search:
        index: ssort_default
        scroll: 1m
        body:
          query: { match: { message: disk } }
          sort: [{ _score: desc }, { seq: asc }]
  - match: { error.root_cause.0.reason: "/.*a.sort.mixing._score.with.a.field.is.not.served.with.scroll.*/" }
  - do:
      search:
        index: ssort_luc
        body:
          query: { match: { message: disk } }
          sort: [{ status: desc }, { _score: desc }]
  - match: { hits.total.value: 6 }

---
"A match in filter context scores nothing: its hits score 0, or what the clauses that score give them":
  - do:
      search:
        index: ssort_luc
        body:
          query: { bool: { filter: [{ match: { message: disk } }] } }
          sort: [{ _score: desc }, { seq: asc }]
          size: 3
  - match: { hits.total.value: 6 }
  - match: { hits.hits.0._id: d04 }
  - match: { hits.hits.1._id: d02 }
  - match: { hits.hits.2._id: d05 }
  - match: { hits.hits.0._score: 0.0 }
  - match: { hits.hits.0.sort.0: 0.0 }
  - match: { hits.hits.0.sort.1: 1 }
  - match: { hits.max_score: 0.0 }
  - do:
      search:
        index: ssort_luc
        body:
          query: { bool: { filter: [{ match: { message: disk } }] } }
  - match: { hits.total.value: 6 }
  - length: { hits.hits: 6 }
  - match: { hits.hits.0._id: d01 }
