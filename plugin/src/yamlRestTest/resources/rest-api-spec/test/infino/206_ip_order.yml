  - match: { aggregations.t.buckets.1.key: "1.0.6.192" }
  - match: { aggregations.t.buckets.2.key: "1.0.61.206" }
  - match: { aggregations.t.buckets.3.key: "1.0.179.100" }

  # The least and greatest address: a one-hit sort, a one-bucket key order and top_hits; min and max are refused as stock refuses them.
  - do:
      search:
        index: ipo_luc
        body: { size: 1, sort: [ { addr: asc } ], _source: false }
  - match: { hits.hits.0.sort.0: "::1" }
  - do:
      search:
        index: ipo_luc
        body: { size: 1, sort: [ { addr: desc } ], _source: false }
  - match: { hits.hits.0.sort.0: "fe80::1" }
  - do:
