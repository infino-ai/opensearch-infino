        index: ipo_def
        body: { size: 0, aggs: { lo: { terms: { field: addr, size: 1, order: { _key: asc } } }, hi: { terms: { field: addr, size: 1, order: { _key: desc } } } } }
  - match: { aggregations.lo.buckets.0.key: "::1" }
  - match: { aggregations.hi.buckets.0.key: "fe80::1" }
  - do:
