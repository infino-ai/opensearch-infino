  - match: { aggregations.lo.buckets.0.key: "::1" }
  - match: { aggregations.hi.buckets.0.key: "fe80::1" }
  - do:
      search:
        index: ipo_prx
        body: { size: 0, aggs: { top: { top_hits: { size: 2, sort: [ { addr: desc } ], _source: false } } } }
  - match: { aggregations.top.hits.hits.0._id: a17 }
  - match: { aggregations.top.hits.hits.1._id: a12 }
  - match: { aggregations.top.hits.hits.1.sort.0: "2001:db8::2" }
  - do:
      catch: bad_request
      search:
        index: ipo_prx
        body: { size: 0, aggs: { m: { min: { field: addr } } } }
  - do:
      catch: bad_request
      search:
        index: ipo_prx
        body: { size: 0, aggs: { m: { max: { field: addr } } } }

  # A composite source on an ip field is refused, since its pages would follow the text.
  - do:
      catch: bad_request
      search:
        index: ipo_def
        body: { size: 0, aggs: { c: { composite: { sources: [ { a: { terms: { field: addr } } } ] } } } }
  - match: { error.root_cause.0.reason: "/.*on.the.ip.field..addr..is.not.served.*/" }
  # A missing value on an ip sort is refused: stock compares its text with the addresses' 16-byte form.
  - do:
      catch: bad_request
      search:
        index: ipo_def
        body: { sort: [ { addr: { order: asc, missing: "1.2.3.4" } } ] }
  - match: { error.root_cause.0.reason: "/.*sort.missing.value..1.2.3.4..on..addr...an.ip.field,.is.not.served.*/" }
  - do:
      catch: bad_request
      search:
        index: ipo_prx
        body: { sort: [ { addr: { order: asc, missing: "1.2.3.4" } } ] }
  - match: { error.root_cause.0.reason: "/.*sort.missing.value..1.2.3.4..on..addr...an.ip.field,.is.not.served.*/" }

