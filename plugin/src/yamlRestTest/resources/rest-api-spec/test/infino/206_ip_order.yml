# An ip field's addresses are ordered as numbers, by their 16-byte form (an
# IPv4 address as its IPv4-mapped IPv6 address), not as the text the table
# holds: as text, 1.0.179.100 sorts before 1.0.6.192 and 100.0.0.0 lies
# between 10.0.0.0 and 10.255.255.255. Each answer is checked against a
# Lucene twin, in default and proxy mode.
"An ip field is ordered by address in ranges, sorts and terms keys, as a Lucene twin orders it":
  - do:
      indices.create:
        index: ipo_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              addr: { type: ip }
              n: { type: long }
  - do:
      indices.create:
        index: ipo_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              addr: { type: ip }
              n: { type: long }
  - do:
      indices.create:
        index: ipo_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              addr: { type: ip }
              n: { type: long }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: ipo_luc
        body:
          - index: { _id: "a1" }
          - {n: 0, addr: "1.0.179.100"}
          - index: { _id: "a2" }
          - {n: 1, addr: "1.0.207.111"}
          - index: { _id: "a3" }
          - {n: 2, addr: "1.0.6.192"}
          - index: { _id: "a4" }
          - {n: 3, addr: "1.0.61.206"}
          - index: { _id: "a5" }
          - {n: 4, addr: "10.0.0.0"}
          - index: { _id: "a6" }
          - {n: 5, addr: "10.255.255.255"}
          - index: { _id: "a7" }
          - {n: 6, addr: "100.0.0.0"}
          - index: { _id: "a8" }
          - {n: 7, addr: "100.0.0.1"}
          - index: { _id: "a9" }
          - {n: 8, addr: "9.255.255.255"}
          - index: { _id: "a10" }
          - {n: 9, addr: "::1"}
          - index: { _id: "a11" }
          - {n: 10, addr: "2001:db8::1"}
          - index: { _id: "a12" }
          - {n: 11, addr: "2001:DB8:0:0:0:0:0:2"}
          - index: { _id: "a13" }
          - {n: 12, addr: "::ffff:10.1.2.3"}
          - index: { _id: "a14" }
          - {n: 13, addr: "255.255.255.255"}
          - index: { _id: "a15" }
          - {n: 14}
          - index: { _id: "a16" }
          - {n: 15, addr: "3.3.3.3"}
          - index: { _id: "a17" }
          - {n: 16, addr: "fe80::1"}
          - index: { _id: "a18" }
          - {n: 17, addr: "10.0.0.0"}
  - match: { errors: false }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: ipo_def
        body:
          - index: { _id: "a1" }
