---
"A table backs one index: an index named onto another's table, or the registry's, is refused":
  - do:
      indices.create:
        index: own.a
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      index:
        index: own.a
        id: "1"
        refresh: true
        body: { v: 1 }
  # own_a's name maps to the table own.a is served from: the older index keeps it, and own_a is refused.
  - do:
      indices.create:
        index: own_a
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      catch: /which\sbacks\sindex\s\[own\.a\]/
      search:
        index: own_a
  - do:
      catch: /which\sbacks\sindex\s\[own\.a\]/
      index:
        index: own_a
        id: "2"
        body: { v: 2 }
  # Deleting the refused index leaves the table the other index is served from.
  - do:
      indices.delete:
        index: own_a
  - do:
      count:
        index: own.a
  - match: { count: 1 }

  # A table named explicitly is refused the same way when another index is served from it.
  - do:
      indices.create:
        index: own-b
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, index.infino.table: os_own_a, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      catch: /which\sbacks\sindex\s\[own\.a\]/
      search:
        index: own-b
  - do:
      indices.delete:
        index: own-b

  # The registry's table backs no index named onto it explicitly.
  - do:
      catch: /holds\sthe\sregistry/
      indices.create:
        index: reg1
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, index.infino.table: os_index, number_of_shards: 1, number_of_replicas: 0 }
  # The registry still answers.
  - do:
      infino.account_indices:
        name: own.a
  - match: { registered: true }
  - do:
      count:
        index: own.a
  - match: { count: 1 }
  - do:
      indices.delete:
        index: own.a

---
"An index named index is served from a table of its own, never the registry's, in either mode":
  - do:
      indices.create:
        index: own.reg
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      index:
        index: own.reg
        id: "1"
        refresh: true
        body: { v: 1 }
  # The index's name maps to the registry's table name: it takes os_-index, which no other index name maps to.
  - do:
      indices.create:
        index: index
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      bulk:
        refresh: true
        body:
          - { index: { _index: index, _id: "1" } }
          - { v: 10, tag: a }
          - { index: { _index: index, _id: "2" } }
          - { v: 20, tag: b }
  - do:
      search:
        index: index
        body: { query: { term: { tag: b } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "2" }
  - match: { hits.hits.0._source: { v: 20, tag: b } }
  - do:
      get:
        index: index
        id: "1"
  - match: { _source: { v: 10, tag: a } }
  - do:
      infino.account_indices:
        name: index
  - match: { registered: true }
  - match: { table: os_-index }
  # Deleting it drops its own table and leaves the registry.
  - do:
      indices.delete:
        index: index
  - do:
      infino.account_indices:
        name: own.reg
  - match: { registered: true }
  - match: { table: os_own_reg }

  # The same in default mode, where the shard's engine writes the table.
  - do:
      indices.create:
        index: index
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      bulk:
        refresh: true
        body:
          - { index: { _index: index, _id: "1" } }
          - { v: 10, tag: a }
          - { index: { _index: index, _id: "2" } }
          - { v: 20, tag: b }
  - do:
      search:
        index: index
        body: { query: { term: { tag: a } }, sort: [ { v: desc } ] }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.0._source: { v: 10, tag: a } }
  - do:
      count:
        index: index
  - match: { count: 2 }
  - do:
      infino.account_indices:
        name: index
  - match: { registered: true }
  - match: { table: os_-index }
  - do:
      indices.delete:
        index: index
  - do:
      infino.account_indices:
        name: own.reg
  - match: { registered: true }
  - do:
      count:
        index: own.reg
  - match: { count: 1 }
  - do:
      indices.delete:
        index: own.reg
---
"Deleting the index a table backs hands its rows to no index refused beside it":
  - do:
      indices.create:
        index: hand.a
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      index:
        index: hand.a
        id: "1"
        refresh: true
        body: { v: 1 }
  # hand_a's name maps to the table hand.a is served from: refused while hand.a lives...
  - do:
      indices.create:
        index: hand_a
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      catch: /which\sbacks\sindex\s\[hand\.a\]/
      search:
        index: hand_a
  # ...and after hand.a is deleted: it was created beside the index the table backed.
  - do:
      indices.delete:
        index: hand.a
  - do:
      catch: /was\screated\swhile\stable\s\[os_hand_a\]\sbacked\sanother\sindex/
      search:
        index: hand_a
  - do:
      catch: /was\screated\swhile\stable\s\[os_hand_a\]/
      index:
        index: hand_a
        id: "2"
        body: { v: 2 }
  - do:
      indices.delete:
        index: hand_a

---
"Whether an index was free to take its table is the cluster's to say, never a request's":
  - do:
      catch: /is\sset\sby\sthe\scluster/
      indices.create:
        index: claim1
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, index.infino.table_claimed: true, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      catch: /is\sset\sby\sthe\scluster/
      indices.put_index_template:
        name: claim_template
        body:
          index_patterns: [ "claim*" ]
          template:
            settings: { index.infino.table_claimed: true }
