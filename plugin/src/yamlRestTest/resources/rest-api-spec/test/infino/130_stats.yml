---
"Index stats and _cat/indices count the documents in the table":
  - do:
      indices.create:
        index: st1
        body: { settings: { number_of_shards: 1, number_of_replicas: 0 } }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: st1, _id: "1" }
          - { n: 1 }
          - index: { _index: st1, _id: "2" }
          - { n: 2 }
          - index: { _index: st1, _id: "3" }
          - { n: 3 }
  - do:
      delete:
        index: st1
        id: "2"
        refresh: true
  - do:
      indices.stats:
        index: st1
        metric: docs
  - match: { _all.primaries.docs.count: 2 }
  - match: { _all.primaries.docs.deleted: 0 }
  - match: { indices.st1.primaries.docs.count: 2 }
  - match: { indices.st1.total.docs.count: 2 }
  - do:
      cat.indices:
        index: st1
        h: docs.count
  - match: { $body: /^2\s*$/ }
