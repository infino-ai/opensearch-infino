---
setup:
  # Each bulk below is its own refresh, so each table holds three files. A
  # page with no order must read them in the same order on every request,
  # or from/size pages would repeat or skip rows. uo_luc is the Lucene twin.
  - do:
      indices.create:
        index: uo_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: uo_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: uo_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: uo_inf, _id: "k7" }
          - { tag: "x" }
          - index: { _index: uo_inf, _id: "c2" }
          - { tag: "y" }
          - index: { _index: uo_inf, _id: "x1" }
          - { tag: "x" }
          - index: { _index: uo_prx, _id: "k7" }
          - { tag: "x" }
          - index: { _index: uo_prx, _id: "c2" }
          - { tag: "y" }
          - index: { _index: uo_prx, _id: "x1" }
          - { tag: "x" }
          - index: { _index: uo_luc, _id: "k7" }
          - { tag: "x" }
          - index: { _index: uo_luc, _id: "c2" }
          - { tag: "y" }
          - index: { _index: uo_luc, _id: "x1" }
          - { tag: "x" }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: uo_inf, _id: "a9" }
          - { tag: "x" }
          - index: { _index: uo_inf, _id: "q4" }
          - { tag: "y" }
          - index: { _index: uo_inf, _id: "m5" }
          - { tag: "x" }
          - index: { _index: uo_prx, _id: "a9" }
          - { tag: "x" }
          - index: { _index: uo_prx, _id: "q4" }
          - { tag: "y" }
          - index: { _index: uo_prx, _id: "m5" }
          - { tag: "x" }
          - index: { _index: uo_luc, _id: "a9" }
          - { tag: "x" }
          - index: { _index: uo_luc, _id: "q4" }
          - { tag: "y" }
          - index: { _index: uo_luc, _id: "m5" }
          - { tag: "x" }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: uo_inf, _id: "z3" }
          - { tag: "y" }
          - index: { _index: uo_inf, _id: "b8" }
          - { tag: "x" }
          - index: { _index: uo_inf, _id: "h6" }
          - { tag: "x" }
          - index: { _index: uo_prx, _id: "z3" }
          - { tag: "y" }
          - index: { _index: uo_prx, _id: "b8" }
          - { tag: "x" }
          - index: { _index: uo_prx, _id: "h6" }
          - { tag: "x" }
          - index: { _index: uo_luc, _id: "z3" }
          - { tag: "y" }
          - index: { _index: uo_luc, _id: "b8" }
          - { tag: "x" }
          - index: { _index: uo_luc, _id: "h6" }
          - { tag: "x" }
  - match: { errors: false }

---
"A search with no sort pages through a table of several files in write order, every row once, as a Lucene twin pages it":
  # match_all: the pages hold the nine rows in the order they were written, none twice.
  - do:
      search:
        index: uo_inf
        body: { from: 0, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - do:
      search:
        index: uo_inf
        body: { from: 2, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "x1" }
  - match: { hits.hits.1._id: "a9" }
  - do:
      search:
        index: uo_inf
        body: { from: 4, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "q4" }
  - match: { hits.hits.1._id: "m5" }
  - do:
      search:
        index: uo_inf
        body: { from: 6, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "z3" }
  - match: { hits.hits.1._id: "b8" }
  - do:
      search:
        index: uo_inf
        body: { from: 8, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "h6" }
  - do:
      search:
        index: uo_luc
        body: { from: 0, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - do:
      search:
        index: uo_luc
        body: { from: 2, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "x1" }
  - match: { hits.hits.1._id: "a9" }
  - do:
      search:
        index: uo_luc
        body: { from: 4, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "q4" }
  - match: { hits.hits.1._id: "m5" }
  - do:
      search:
        index: uo_luc
        body: { from: 6, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "z3" }
  - match: { hits.hits.1._id: "b8" }
  - do:
      search:
        index: uo_luc
        body: { from: 8, size: 2 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "h6" }

  # A filter keeps that order among the rows it keeps.
  - do:
      search:
        index: uo_inf
        body: { from: 0, size: 2, query: { bool: { filter: { term: { tag: "x" } } } } }
  - match: { hits.total.value: 6 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "x1" }
  - do:
      search:
        index: uo_inf
        body: { from: 2, size: 2, query: { bool: { filter: { term: { tag: "x" } } } } }
  - match: { hits.total.value: 6 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "a9" }
  - match: { hits.hits.1._id: "m5" }
  - do:
      search:
        index: uo_inf
        body: { from: 4, size: 2, query: { bool: { filter: { term: { tag: "x" } } } } }
  - match: { hits.total.value: 6 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "b8" }
  - match: { hits.hits.1._id: "h6" }
  - do:
      search:
        index: uo_luc
        body: { from: 0, size: 2, query: { bool: { filter: { term: { tag: "x" } } } } }
  - match: { hits.total.value: 6 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "x1" }
  - do:
      search:
        index: uo_luc
        body: { from: 2, size: 2, query: { bool: { filter: { term: { tag: "x" } } } } }
  - match: { hits.total.value: 6 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "a9" }
  - match: { hits.hits.1._id: "m5" }
  - do:
      search:
        index: uo_luc
        body: { from: 4, size: 2, query: { bool: { filter: { term: { tag: "x" } } } } }
  - match: { hits.total.value: 6 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "b8" }
  - match: { hits.hits.1._id: "h6" }

  # A sort on a field no row holds orders nothing: the rows come in the same order.
  - do:
      search:
        index: uo_inf
        body: { from: 0, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - do:
      search:
        index: uo_inf
        body: { from: 2, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "x1" }
  - match: { hits.hits.1._id: "a9" }
  - do:
      search:
        index: uo_inf
        body: { from: 4, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "q4" }
  - match: { hits.hits.1._id: "m5" }
  - do:
      search:
        index: uo_inf
        body: { from: 6, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "z3" }
  - match: { hits.hits.1._id: "b8" }
  - do:
      search:
        index: uo_inf
        body: { from: 8, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "h6" }
  - do:
      search:
        index: uo_luc
        body: { from: 0, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - do:
      search:
        index: uo_luc
        body: { from: 2, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "x1" }
  - match: { hits.hits.1._id: "a9" }
  - do:
      search:
        index: uo_luc
        body: { from: 4, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "q4" }
  - match: { hits.hits.1._id: "m5" }
  - do:
      search:
        index: uo_luc
        body: { from: 6, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "z3" }
  - match: { hits.hits.1._id: "b8" }
  - do:
      search:
        index: uo_luc
        body: { from: 8, size: 2, sort: [ { n: { order: desc } } ] }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "h6" }

  # Proxy mode reads the same order.
  - do:
      search:
        index: uo_prx
        body: { from: 0, size: 3 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.2._id: "x1" }
  - do:
      search:
        index: uo_prx
        body: { from: 3, size: 3 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "a9" }
  - match: { hits.hits.1._id: "q4" }
  - match: { hits.hits.2._id: "m5" }
  - do:
      search:
        index: uo_prx
        body: { from: 6, size: 3 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "z3" }
  - match: { hits.hits.1._id: "b8" }
  - match: { hits.hits.2._id: "h6" }

---
"A collapse with no sort keeps each group's first row in write order, and orders the groups by it, as the Lucene twin does":
  # The collapse orders by row id itself, so it holds on any engine release.
  - do:
      search:
        index: uo_inf
        body: { size: 5, collapse: { field: tag } }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.0.fields.tag: [ "x" ] }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.1.fields.tag: [ "y" ] }
  - do:
      search:
        index: uo_inf
        body: { from: 1, size: 1, collapse: { field: tag } }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "c2" }
  - do:
      search:
        index: uo_prx
        body: { size: 5, collapse: { field: tag } }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.0.fields.tag: [ "x" ] }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.1.fields.tag: [ "y" ] }
  - do:
      search:
        index: uo_prx
        body: { from: 1, size: 1, collapse: { field: tag } }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "c2" }
  - do:
      search:
        index: uo_luc
        body: { size: 5, collapse: { field: tag } }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.0.fields.tag: [ "x" ] }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.1.fields.tag: [ "y" ] }
  - do:
      search:
        index: uo_luc
        body: { from: 1, size: 1, collapse: { field: tag } }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "c2" }

---
"Rows written between two requests come after the pages already read, which do not move":
  - do:
      search:
        index: uo_inf
        body: { from: 0, size: 3 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.2._id: "x1" }
  - do:
      search:
        index: uo_luc
        body: { from: 0, size: 3 }
  - match: { hits.total.value: 9 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.2._id: "x1" }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: uo_inf, _id: "n2" }
          - { tag: "y" }
          - index: { _index: uo_inf, _id: "w0" }
          - { tag: "x" }
          - index: { _index: uo_luc, _id: "n2" }
          - { tag: "y" }
          - index: { _index: uo_luc, _id: "w0" }
          - { tag: "x" }
  - match: { errors: false }
  - do:
      search:
        index: uo_inf
        body: { from: 0, size: 3 }
  - match: { hits.total.value: 11 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.2._id: "x1" }
  - do:
      search:
        index: uo_inf
        body: { from: 3, size: 3 }
  - match: { hits.total.value: 11 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "a9" }
  - match: { hits.hits.1._id: "q4" }
  - match: { hits.hits.2._id: "m5" }
  - do:
      search:
        index: uo_inf
        body: { from: 9, size: 3 }
  - match: { hits.total.value: 11 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "n2" }
  - match: { hits.hits.1._id: "w0" }
  - do:
      search:
        index: uo_luc
        body: { from: 0, size: 3 }
  - match: { hits.total.value: 11 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "k7" }
  - match: { hits.hits.1._id: "c2" }
  - match: { hits.hits.2._id: "x1" }
  - do:
      search:
        index: uo_luc
        body: { from: 3, size: 3 }
  - match: { hits.total.value: 11 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "a9" }
  - match: { hits.hits.1._id: "q4" }
  - match: { hits.hits.2._id: "m5" }
  - do:
      search:
        index: uo_luc
        body: { from: 9, size: 3 }
  - match: { hits.total.value: 11 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "n2" }
  - match: { hits.hits.1._id: "w0" }

---
"A search with no sort whose filter joins by id pages in write order, as the Lucene twin does":
  # A phrase in must_not and a term on a field some documents give several
  # values are joined by id, which the engine returns in no fixed order: the
  # page is ordered by the row id instead, so these pages hold today.
  - do:
      indices.create:
        index: uj_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              tag: { type: keyword }
  - do:
      indices.create:
        index: uj_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              tag: { type: keyword }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: uj_inf, _id: "e5" }
          - { body: "quick red fox", tag: ["x", "w"] }
          - index: { _index: uj_inf, _id: "b2" }
          - { body: "lazy dog", tag: "y" }
          - index: { _index: uj_inf, _id: "r7" }
          - { body: "red fox runs", tag: ["y", "x"] }
          - index: { _index: uj_luc, _id: "e5" }
          - { body: "quick red fox", tag: ["x", "w"] }
          - index: { _index: uj_luc, _id: "b2" }
          - { body: "lazy dog", tag: "y" }
          - index: { _index: uj_luc, _id: "r7" }
          - { body: "red fox runs", tag: ["y", "x"] }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: uj_inf, _id: "a1" }
          - { body: "the red fox", tag: "x" }
          - index: { _index: uj_inf, _id: "t4" }
          - { body: "brown dog", tag: ["z", "y"] }
          - index: { _index: uj_inf, _id: "g9" }
          - { body: "slow fox", tag: "x" }
          - index: { _index: uj_luc, _id: "a1" }
          - { body: "the red fox", tag: "x" }
          - index: { _index: uj_luc, _id: "t4" }
          - { body: "brown dog", tag: ["z", "y"] }
          - index: { _index: uj_luc, _id: "g9" }
          - { body: "slow fox", tag: "x" }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: uj_inf, _id: "m3" }
          - { body: "red fox again", tag: ["w", "y"] }
          - index: { _index: uj_inf, _id: "c6" }
          - { body: "a dog", tag: "x" }
          - index: { _index: uj_inf, _id: "h0" }
          - { body: "old fox", tag: ["x", "z"] }
          - index: { _index: uj_luc, _id: "m3" }
          - { body: "red fox again", tag: ["w", "y"] }
          - index: { _index: uj_luc, _id: "c6" }
          - { body: "a dog", tag: "x" }
          - index: { _index: uj_luc, _id: "h0" }
          - { body: "old fox", tag: ["x", "z"] }
  - match: { errors: false }
  # must_not phrase: the five rows without "red fox", two to a page.
  - do:
      search:
        index: uj_inf
        body: { from: 0, size: 2, query: { bool: { must_not: { match_phrase: { body: "red fox" } } } } }
  - match: { hits.total.value: 5 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "b2" }
  - match: { hits.hits.1._id: "t4" }
  - do:
      search:
        index: uj_inf
        body: { from: 2, size: 2, query: { bool: { must_not: { match_phrase: { body: "red fox" } } } } }
  - match: { hits.total.value: 5 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "g9" }
  - match: { hits.hits.1._id: "c6" }
  - do:
