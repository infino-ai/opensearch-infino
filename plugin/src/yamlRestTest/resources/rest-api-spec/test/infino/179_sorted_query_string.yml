---
"A sorted page with plain query_string words returns a Lucene twin's hits, filtered and paged with search_after":
  # A sorted page has no score, so its plain-words text clause is a
  # text_match on the table's rows, read in the sort's order, rather than
  # the token index's matches sorted afterwards. The hits, beside a range
  # filter and across search_after pages, are stock's, in stock's order.
  - do:
      indices.create:
        index: st_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
              n: { type: long }
  - do:
      indices.create:
        index: st_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
              n: { type: long }
  - do:
      indices.create:
        index: st_default
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
              n: { type: long }
  - do:
      bulk:
        refresh: true
        index: st_luc
        body:
          - index: { _id: "s01" }
          - { "@timestamp": "2026-01-01T00:00:00Z", n: 1, message: "jackal bat" }
          - index: { _id: "s02" }
