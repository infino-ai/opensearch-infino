  - do:
      search:
        index: st_luc
        body:
          size: 5
          sort: [ { "@timestamp": desc } ]
          search_after: [ $after ]
          query: { query_string: { query: "monkey jackal", default_field: message } }
  - match: { hits.total.value: 15 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: "s13" }
