      search:
        index: st_luc
        body:
          size: 20
          sort: [ { n: asc } ]
          query:
            bool:
              must: { query_string: { query: "monkey jackal", default_field: message } }
              filter: { range: { n: { gte: 5, lte: 15 } } }
  - match: { hits.total.value: 8 }
  - length: { hits.hits: 8 }
  - match: { hits.hits.0._id: "s05" }
  - match: { hits.hits.1._id: "s06" }
  - match: { hits.hits.2._id: "s07" }
