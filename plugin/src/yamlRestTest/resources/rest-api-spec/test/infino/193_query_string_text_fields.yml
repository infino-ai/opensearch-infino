---
"A query string over text fields, dynamic ones included, pages and counts as a Lucene twin does, in proxy and default mode":
  # A query string over several text fields counts its total from the token
  # index beside its page. Its totals, page lengths and, in time order, its
  # hits across pages are those of the Lucene twin (qo_luc). host.name and
  # data_stream.dataset are added by dynamic mapping after the first
  # refresh, so the first file holds no column for them. A query string of
  # another shape (NOT, a phrase, AND) gives the same
  # answers by its own path. A page shorter than its size is its own total.
  - do:
      indices.create:
        index: qo_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
  - do:
      indices.create:
        index: qo_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
  - do:
      indices.create:
        index: qo_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
  - do:
      bulk:
        refresh: true
        index: qo_luc
        body:
          - index: { _id: "d1" }
          - {"@timestamp": "2026-01-01T00:00:00Z", "message": "monkey owl"}
          - index: { _id: "d2" }
          - {"@timestamp": "2026-01-02T00:00:00Z", "message": "cat dog"}
          - index: { _id: "d3" }
