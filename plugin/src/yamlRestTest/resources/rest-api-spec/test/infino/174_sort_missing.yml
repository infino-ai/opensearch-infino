      indices.create:
        index: sm3_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: long }
              k: { type: keyword }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: sm3_inf
        body:
          - index: { _id: "p1" }
          - { n: 5, k: "p1" }
          - index: { _id: "p2" }
          - { n: 4, k: "p2" }
          - index: { _id: "p3" }
          - { n: 3, k: "p3" }
          - index: { _id: "p4" }
          - { n: 2, k: "p4" }
          - index: { _id: "m1" }
          - { k: "m1" }
          - index: { _id: "m2" }
          - { k: "m2" }
          - index: { _id: "m3" }
          - { k: "m3" }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        index: sm3_luc
        body:
          - index: { _id: "p1" }
          - { n: 5, k: "p1" }
          - index: { _id: "p2" }
          - { n: 4, k: "p2" }
          - index: { _id: "p3" }
          - { n: 3, k: "p3" }
          - index: { _id: "p4" }
          - { n: 2, k: "p4" }
          - index: { _id: "m1" }
          - { k: "m1" }
          - index: { _id: "m2" }
          - { k: "m2" }
          - index: { _id: "m3" }
          - { k: "m3" }
  - match: { errors: false }

  # Descending, missing rows sorted as 3, tied with p3 and broken by k.
  - do:
      search:
        index: sm3_luc
        body:
          size: 3
          sort: [ { n: { order: desc, missing: 3 } }, { k: asc } ]
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "p1" }
  - match: { hits.hits.1._id: "p2" }
  - match: { hits.hits.2._id: "m1" }
  - set: { hits.hits.2.sort: after_sm3_luc_1 }
  - do:
      search:
        index: sm3_luc
        body:
          size: 3
          sort: [ { n: { order: desc, missing: 3 } }, { k: asc } ]
          search_after: $after_sm3_luc_1
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "m2" }
  - match: { hits.hits.1._id: "m3" }
  - match: { hits.hits.2._id: "p3" }
  - set: { hits.hits.2.sort: after_sm3_luc_2 }
  - do:
      search:
        index: sm3_luc
        body:
          size: 3
          sort: [ { n: { order: desc, missing: 3 } }, { k: asc } ]
          search_after: $after_sm3_luc_2
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "p4" }
  - do:
      search:
        index: sm3_inf
        body:
          size: 3
          sort: [ { n: { order: desc, missing: 3 } }, { k: asc } ]
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "p1" }
  - match: { hits.hits.1._id: "p2" }
  - match: { hits.hits.2._id: "m1" }
  - set: { hits.hits.2.sort: after_sm3_inf_1 }
  - do:
      search:
        index: sm3_inf
        body:
          size: 3
          sort: [ { n: { order: desc, missing: 3 } }, { k: asc } ]
