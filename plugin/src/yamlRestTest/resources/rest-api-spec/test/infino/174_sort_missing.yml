---
"A missing value given as a number sorts the rows missing the field as that number, as a Lucene twin sorts them":
  - do:
      indices.create:
        index: sm3_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: long }
              k: { type: keyword }
