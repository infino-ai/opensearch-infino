          - index: { _id: "p3" }
          - { n: 3, k: "p3" }
          - index: { _id: "p4" }
          - { n: 2, k: "p4" }
          - index: { _id: "m1" }
          - { k: "m1" }
          - index: { _id: "m2" }
          - { k: "m2" }
