          sort: [ { n: { order: desc, missing: _first } }, { k: asc } ]
          search_after: $after_sm2_luc_1
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "m3" }
  - match: { hits.hits.1._id: "p1" }
  - set: { hits.hits.1.sort: after_sm2_luc_2 }
  - do:
      search:
        index: sm2_luc
        body:
          size: 2
          sort: [ { n: { order: desc, missing: _first } }, { k: asc } ]
          search_after: $after_sm2_luc_2
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "p2" }
  - match: { hits.hits.1._id: "p3" }
  - set: { hits.hits.1.sort: after_sm2_luc_3 }
  - do:
