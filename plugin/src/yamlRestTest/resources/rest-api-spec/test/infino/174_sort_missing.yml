  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "m2" }
  - match: { hits.hits.1._id: "m3" }
  - match: { hits.hits.2._id: "p3" }
  - set: { hits.hits.2.sort: after_sm3_inf_2 }
  - do:
