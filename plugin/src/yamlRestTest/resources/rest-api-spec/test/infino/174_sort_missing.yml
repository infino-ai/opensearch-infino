          sort: [ { n: asc }, { k: asc } ]
          search_after: $after_sm1_inf_1
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "p1" }
  - match: { hits.hits.1._id: "m1" }
  - match: { hits.hits.2._id: "m2" }
  - set: { hits.hits.2.sort: after_sm1_inf_2 }
  - do:
