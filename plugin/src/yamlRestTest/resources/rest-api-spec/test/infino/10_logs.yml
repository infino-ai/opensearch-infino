---
"Plugin is installed":
  - do:
      cat.plugins:
        local: true
        h: component
  - match:
      $body: /infino-engine/

---
"Logs on an Infino index":
  - do:
      indices.create:
        index: logs
        body:
          settings:
            index.infino.enabled: true
            number_of_shards: 1
            number_of_replicas: 0
            refresh_interval: -1
          mappings:
            properties:
              "@timestamp": { type: date }
              level: { type: keyword }
              message: { type: text }
              status: { type: long }
              took: { type: float }
              host:
                properties:
                  name: { type: keyword }

  # One document the mapping cannot hold fails as its own bulk item; the rest index.
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: logs, _id: a }
          - { "@timestamp": "2026-10-24T10:00:00Z", level: error, message: "disk full on node-3", status: "500", took: 1.5, host: { name: n1 }, tags: [x, y] }
          - index: { _index: logs, _id: b }
          - { "@timestamp": "2026-10-24T10:01:00Z", level: info, message: "request served", status: 200, took: 3, host: { name: n2 }, tags: z }
          - index: { _index: logs, _id: c }
          - { "@timestamp": "2026-10-24T10:02:00Z", level: warn, message: "slow disk", status: "not-a-number" }
          - index: { _index: logs, _id: d }
          - { "@timestamp": "2026-10-24T10:03:00Z", level: info, message: "cache warm", status: 204, took: 0.5, host: { name: n1 } }
  - match: { errors: true }
  - match: { items.0.index.status: 201 }
  - match: { items.1.index.status: 201 }
  - match: { items.2.index.status: 400 }
  - match: { items.2.index.error.reason: "/.*status.*/" }
  - match: { items.3.index.status: 201 }

  # Fetch serves the document as sent.
  - do:
      get:
        index: logs
        id: a
  - match: { _source.message: "disk full on node-3" }
  - match: { _source.tags: [x, y] }

  # A time range with date math, newest first: the shape of every log view.
  - do:
      search:
        index: logs
        body:
          query:
            bool:
              filter:
                - range: { "@timestamp": { gte: "2026-10-24T10:00:30Z", lte: "now" } }
          sort: [ { "@timestamp": desc } ]
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d }
  - match: { hits.hits.1._id: b }

  # Every document sorted on one field, with its source: a date from the
  # field's range index, a keyword (which has none) by statement, ties in the
  # order the documents were written.
  - do:
      search:
        index: logs
        body:
          sort: [ { "@timestamp": asc } ]
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: a }
  - match: { hits.hits.0._source.message: "disk full on node-3" }
  - match: { hits.hits.1._id: b }
  - match: { hits.hits.2._id: d }
  - do:
      search:
        index: logs
        body:
          sort: [ { level: asc } ]
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: a }
  - match: { hits.hits.1._id: b }
  - match: { hits.hits.2._id: d }
  - match: { hits.hits.2._source.message: "cache warm" }

  # Field-scoped text search, with a filter on the ranked candidates.
  - do:
      search:
        index: logs
        body:
          query:
            bool:
              must: [ { match: { message: disk } } ]
              filter: [ { term: { level: error } } ]
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: a }

  # A keyword term is an exact filter, not a text search; `.keyword` resolves to the column.
  - do:
      search:
        index: logs
        body:
          query: { term: { "host.name.keyword": n1 } }
          sort: [ { "@timestamp": asc } ]
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: a }

  - do:
      search:
        index: logs
        body:
          query: { exists: { field: took } }
  - match: { hits.total.value: 3 }

  - do:
      search:
        index: logs
        body:
          query: { prefix: { "host.name": n } }
          size: 0
  - match: { hits.total.value: 3 }

  # The dashboard shape: a histogram over time with metrics in each bucket, and terms with sub-aggregations.
  - do:
      search:
        index: logs
        body:
          size: 0
          aggs:
            over_time:
              date_histogram: { field: "@timestamp", fixed_interval: 2m }
              aggs:
                avg_took: { avg: { field: took } }
                max_status: { max: { field: status } }
            by_level:
              terms: { field: level }
              aggs:
                sum_status: { sum: { field: status } }
            n_took: { value_count: { field: took } }
  - match: { hits.total.value: 3 }
  - length: { aggregations.over_time.buckets: 2 }
  - match: { aggregations.over_time.buckets.0.key_as_string: "2026-10-24T10:00:00.000Z" }
  - match: { aggregations.over_time.buckets.0.doc_count: 2 }
  - match: { aggregations.over_time.buckets.0.avg_took.value: 2.25 }
  - match: { aggregations.over_time.buckets.0.max_status.value: 500 }
  - match: { aggregations.over_time.buckets.1.doc_count: 1 }
  - match: { aggregations.by_level.buckets.0.key: info }
  - match: { aggregations.by_level.buckets.0.doc_count: 2 }
  - match: { aggregations.by_level.buckets.0.sum_status.value: 404 }
  - match: { aggregations.by_level.buckets.1.key: error }
  - match: { aggregations.n_took.value: 3 }

  # A terms aggregation nested under the histogram.
  - do:
      search:
        index: logs
        body:
          size: 0
          query: { match: { message: disk } }
          aggs:
            over_time:
              date_histogram: { field: "@timestamp", calendar_interval: 1h }
              aggs:
                by_host: { terms: { field: host.name } }
  - length: { aggregations.over_time.buckets: 1 }
  - match: { aggregations.over_time.buckets.0.doc_count: 1 }
  - match: { aggregations.over_time.buckets.0.by_host.buckets.0.key: n1 }

  # Updates and deletes reach the table.
  - do:
      index:
        index: logs
        id: b
        refresh: true
        body: { "@timestamp": "2026-10-24T10:01:00Z", level: info, message: "request served again", status: 201 }
  - do:
      delete:
        index: logs
        id: d
        refresh: true
  - do:
      search:
        index: logs
        body:
          query: { match_all: {} }
          sort: [ { "@timestamp": asc } ]
  - match: { hits.total.value: 2 }
  - match: { hits.hits.1._id: b }
  - do:
      get:
        index: logs
        id: b
  - match: { _source.status: 201 }

---
"Ties on a sort read from the range index come in the order written, as on a Lucene twin":
  # Every document, sorted on a date: the sorted search reads the page from
  # the column's range index and breaks ties by row id, in both directions.
  # The ids are written out of their own order, so the page's order is the
  # order the documents were written, not the order of their ids. The page
  # cuts through the tied documents.
  - do:
      indices.create:
        index: ties_infino
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
  - do:
      indices.create:
        index: ties_lucene
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: ties_infino, _id: z }
          - { "@timestamp": "2026-10-24T10:00:00Z" }
          - index: { _index: ties_infino, _id: m }
          - { "@timestamp": "2026-10-24T10:01:00Z" }
          - index: { _index: ties_infino, _id: a }
          - { "@timestamp": "2026-10-24T10:01:00Z" }
          - index: { _index: ties_infino, _id: q }
          - { "@timestamp": "2026-10-24T10:01:00Z" }
          - index: { _index: ties_infino, _id: b }
          - { "@timestamp": "2026-10-24T10:00:00Z" }
          - index: { _index: ties_lucene, _id: z }
          - { "@timestamp": "2026-10-24T10:00:00Z" }
          - index: { _index: ties_lucene, _id: m }
          - { "@timestamp": "2026-10-24T10:01:00Z" }
          - index: { _index: ties_lucene, _id: a }
          - { "@timestamp": "2026-10-24T10:01:00Z" }
          - index: { _index: ties_lucene, _id: q }
          - { "@timestamp": "2026-10-24T10:01:00Z" }
          - index: { _index: ties_lucene, _id: b }
          - { "@timestamp": "2026-10-24T10:00:00Z" }
  - match: { errors: false }

  # The Lucene twin first: the order the Infino index must give.
  - do:
      search:
        index: ties_lucene
        body:
          size: 4
          sort: [ { "@timestamp": desc } ]
  - match: { hits.total.value: 5 }
  - match: { hits.hits.0._id: m }
  - match: { hits.hits.1._id: a }
  - match: { hits.hits.2._id: q }
  - match: { hits.hits.3._id: z }
  - do:
      search:
        index: ties_lucene
        body:
          size: 2
          sort: [ { "@timestamp": desc } ]
  - match: { hits.hits.0._id: m }
  - match: { hits.hits.1._id: a }
  - do:
      search:
        index: ties_lucene
        body:
          size: 3
          sort: [ { "@timestamp": asc } ]
  - match: { hits.hits.0._id: z }
  - match: { hits.hits.1._id: b }
  - match: { hits.hits.2._id: m }

  - do:
      search:
        index: ties_infino
        body:
          size: 4
          sort: [ { "@timestamp": desc } ]
  - match: { hits.total.value: 5 }
  - match: { hits.hits.0._id: m }
  - match: { hits.hits.1._id: a }
  - match: { hits.hits.2._id: q }
  - match: { hits.hits.3._id: z }
  - do:
      search:
        index: ties_infino
        body:
          size: 2
          sort: [ { "@timestamp": desc } ]
  - match: { hits.hits.0._id: m }
  - match: { hits.hits.1._id: a }
  - do:
      search:
        index: ties_infino
        body:
          size: 3
          sort: [ { "@timestamp": asc } ]
  - match: { hits.hits.0._id: z }
  - match: { hits.hits.1._id: b }
  - match: { hits.hits.2._id: m }
