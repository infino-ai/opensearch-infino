---
"A page past the index's result window is refused, as a shard refuses it":
  - do:
      indices.create:
        index: win1
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0, index.max_result_window: 5 }
  - do:
      index:
        index: win1
        id: "1"
        refresh: true
        body: { v: 1 }
  - do:
      search:
        index: win1
        body: { from: 2, size: 3 }
  - match: { hits.total.value: 1 }
  - do:
      catch: /Result\swindow\sis\stoo\slarge/
      search:
        index: win1
        body: { from: 3, size: 3 }
  - do:
      indices.delete:
        index: win1

---
"A sliced search is refused: the table answers a search whole, and each slice would get every document":
  - do:
      indices.create:
        index: slc1
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      catch: /a\ssliced\ssearch\sis\snot\sserved/
      search:
        index: slc1
        scroll: 1m
        body: { slice: { id: 0, max: 2 } }
  - do:
      indices.delete:
        index: slc1

---
"Two indices sorted descending give missing values last, as each index orders them":
  - do:
      indices.create:
        index: srt1
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { prio: { type: long }, tag: { type: keyword } } }
  - do:
      indices.create:
        index: srt2
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { prio: { type: long }, tag: { type: keyword } } }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: srt1, _id: "a1" }
          - { prio: 1, tag: x }
          - index: { _index: srt1, _id: "a2" }
          - { tag: y }
          - index: { _index: srt2, _id: "b1" }
          - { prio: 2, tag: x }
          - index: { _index: srt2, _id: "b2" }
          - { tag: y }
  - match: { errors: false }
  - do:
      search:
        index: srt1,srt2
        body: { sort: [ { prio: desc } ] }
  - match: { hits.hits.0._id: "b1" }
  - match: { hits.hits.1._id: "a1" }
  - is_false: hits.hits.2._source.prio
  - is_false: hits.hits.3._source.prio
  # A filters aggregation's other bucket holds the documents no filter keeps, those without the field among them.
  - do:
      search:
        index: srt1
        body:
          size: 0
          aggs:
            by_prio:
              filters:
                other_bucket: true
                filters: { one: { term: { prio: 1 } } }
  - match: { aggregations.by_prio.buckets.one.doc_count: 1 }
  - match: { aggregations.by_prio.buckets._other_.doc_count: 1 }
  # A terms aggregation's missing value is a bucket of its own; include/exclude is refused, never ignored.
  - do:
      search:
        index: srt1
        body:
          size: 0
          aggs:
            prios: { terms: { field: prio, missing: 0, order: { _key: asc } } }
  - length: { aggregations.prios.buckets: 2 }
  - match: { aggregations.prios.buckets.0.key: 0 }
  - match: { aggregations.prios.buckets.0.doc_count: 1 }
  - match: { aggregations.prios.buckets.1.key: 1 }
  - do:
      catch: /has\sinclude\/exclude/
      search:
        index: srt1
        body:
          size: 0
          aggs:
            tags: { terms: { field: tag, include: [ x ] } }
  - do:
      indices.delete:
        index: srt1,srt2

---
"hits.total follows track_total_hits as a coordinator reports it":
  - do:
      indices.create:
        index: totals
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: totals, _id: "1" }
          - { v: 1 }
          - index: { _index: totals, _id: "2" }
          - { v: 2 }
          - index: { _index: totals, _id: "3" }
          - { v: 3 }
  - do:
      search:
        index: totals
        body: { size: 1, track_total_hits: false }
  - length: { hits.hits: 1 }
  - is_false: hits.total
  - do:
      search:
        index: totals
        body: { size: 1, track_total_hits: 2 }
  - match: { hits.total: { value: 2, relation: gte } }
  - do:
      search:
        index: totals
        body: { size: 1, track_total_hits: 5 }
  - match: { hits.total: { value: 3, relation: eq } }
  - do:
      search:
        index: totals
        body: { size: 1 }
  - match: { hits.total: { value: 3, relation: eq } }
  - do:
      search:
        index: totals
        body: { size: 1, track_total_hits: true }
  - match: { hits.total: { value: 3, relation: eq } }
  - do:
      count:
        index: totals
  - match: { count: 3 }
  - do:
      indices.delete:
        index: totals

---
"A total capped by track_total_hits leaves the aggregations' population whole":
  # The aggregations take the query's total as their population: top_hits
  # reports it, and significant_terms compares each term's count with it.
  - do:
      indices.create:
        index: capagg_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text }, tag: { type: keyword } } }
  - do:
      indices.create:
        index: capagg_default
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text }, tag: { type: keyword } } }
  - do:
      bulk:
        refresh: true
        body: |
          { "index": { "_index": "capagg_proxy", "_id": "1" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_proxy", "_id": "2" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_proxy", "_id": "3" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_proxy", "_id": "4" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_proxy", "_id": "5" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_proxy", "_id": "6" } }
          { "message": "cache warm", "tag": "other" }
          { "index": { "_index": "capagg_proxy", "_id": "7" } }
          { "message": "cache warm", "tag": "other" }
          { "index": { "_index": "capagg_default", "_id": "1" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_default", "_id": "2" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_default", "_id": "3" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_default", "_id": "4" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_default", "_id": "5" } }
          { "message": "disk full", "tag": "shared" }
          { "index": { "_index": "capagg_default", "_id": "6" } }
          { "message": "cache warm", "tag": "other" }
          { "index": { "_index": "capagg_default", "_id": "7" } }
          { "message": "cache warm", "tag": "other" }
  - do:
      search:
        index: capagg_proxy
        body:
          size: 1
          track_total_hits: 2
          query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } }
          aggs:
            top: { top_hits: { size: 1 } }
            sig: { significant_terms: { field: tag, min_doc_count: 1 } }
  - match: { hits.total: { value: 2, relation: gte } }
  - match: { aggregations.top.hits.total: { value: 5, relation: eq } }
  - match: { aggregations.sig.doc_count: 5 }
  - match: { aggregations.sig.buckets.0.key: shared }
  - match: { aggregations.sig.buckets.0.doc_count: 5 }
  - do:
      search:
        index: capagg_default
        body:
          size: 1
          track_total_hits: 2
          query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } }
          aggs:
            top: { top_hits: { size: 1 } }
            sig: { significant_terms: { field: tag, min_doc_count: 1 } }
  - match: { hits.total: { value: 2, relation: gte } }
  - match: { aggregations.top.hits.total: { value: 5, relation: eq } }
  - match: { aggregations.sig.doc_count: 5 }
  - match: { aggregations.sig.buckets.0.key: shared }
  - match: { aggregations.sig.buckets.0.doc_count: 5 }
  - do:
      indices.delete:
        index: capagg_proxy,capagg_default

---
"A text query's total counted under track_total_hits stops one past the limit":
  # A should phrase is a token index predicate, not the ranked clause, so its
  # total is counted under a LIMIT: one past track_total_hits tells five
  # matches over a limit of 2 from exactly 2.
  - do:
      indices.create:
        index: captot_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text } } }
  - do:
      indices.create:
        index: captot_default
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text } } }
  - do:
      bulk:
        refresh: true
        body: |
          { "index": { "_index": "captot_proxy", "_id": "1" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_proxy", "_id": "2" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_proxy", "_id": "3" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_proxy", "_id": "4" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_proxy", "_id": "5" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_proxy", "_id": "6" } }
          { "message": "cache warm" }
          { "index": { "_index": "captot_default", "_id": "1" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_default", "_id": "2" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_default", "_id": "3" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_default", "_id": "4" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_default", "_id": "5" } }
          { "message": "disk full" }
          { "index": { "_index": "captot_default", "_id": "6" } }
          { "message": "cache warm" }
  - do:
      search:
        index: captot_proxy
        body: { size: 1, track_total_hits: 2, query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } } }
  - match: { hits.total: { value: 2, relation: gte } }
  - do:
      search:
        index: captot_proxy
        body: { size: 1, track_total_hits: 4, query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } } }
  - match: { hits.total: { value: 4, relation: gte } }
  - do:
      search:
        index: captot_proxy
        body: { size: 1, track_total_hits: 5, query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } } }
  - match: { hits.total: { value: 5, relation: eq } }
  - do:
      search:
        index: captot_default
        body: { size: 1, track_total_hits: 2, query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } } }
  - match: { hits.total: { value: 2, relation: gte } }
  - do:
      search:
        index: captot_default
        body: { size: 1, track_total_hits: 4, query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } } }
  - match: { hits.total: { value: 4, relation: gte } }
  - do:
      search:
        index: captot_default
        body: { size: 1, track_total_hits: 5, query: { bool: { should: [ { match_phrase: { message: "disk full" } } ] } } }
  - match: { hits.total: { value: 5, relation: eq } }
  - do:
      indices.delete:
        index: captot_proxy,captot_default

---
"A query_string word the analyzer splits needs all its tokens beside another optional word":
  - do:
      indices.create:
        index: qsplit
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text } } }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: qsplit, _id: "1" }
          - { message: "disk full" }
          - index: { _index: qsplit, _id: "2" }
          - { message: "disk only" }
          - index: { _index: qsplit, _id: "3" }
          - { message: "full only" }
          - index: { _index: qsplit, _id: "4" }
          - { message: "cache warm" }
  # disk-full is the tokens disk and full, both required under AND: rows 2 and
  # 3 hold one of them and match neither clause.
  - do:
      search:
        index: qsplit
        body:
          query: { query_string: { query: "message:disk-full OR message:cache", default_operator: AND } }
  - match: { hits.total: { value: 2, relation: eq } }
  - length: { hits.hits: 2 }
  - do:
      indices.delete:
        index: qsplit
