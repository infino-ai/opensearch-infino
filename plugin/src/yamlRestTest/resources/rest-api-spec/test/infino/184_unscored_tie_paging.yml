        body: { from: 4, size: 2, query: { wildcard: { w: { value: "abcd", case_insensitive: true } } } }
  - match: { hits.total.value: 5 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "t8" }
  - do:
      search:
        index: ut_luc
        body: { from: 0, size: 2, query: { wildcard: { w: { value: "abcd", case_insensitive: true } } } }
  - match: { hits.total.value: 5 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "p3" }
  - match: { hits.hits.1._id: "e1" }
  - do:
      search:
        index: ut_luc
        body: { from: 2, size: 2, query: { wildcard: { w: { value: "abcd", case_insensitive: true } } } }
  - match: { hits.total.value: 5 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "b4" }
  - match: { hits.hits.1._id: "q2" }
  - do:
      search:
        index: ut_luc
        body: { from: 4, size: 2, query: { wildcard: { w: { value: "abcd", case_insensitive: true } } } }
  - match: { hits.total.value: 5 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "t8" }

