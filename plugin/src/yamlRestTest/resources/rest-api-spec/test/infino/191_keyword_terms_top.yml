---
"Terms over a keyword field of more than 1001 values, unfiltered, match a Lucene twin":
  # An unfiltered terms aggregation in the default order over a keyword
  # field reads its best buckets and the count of the rest from one engine
  # call, however many values the field has. 1,020 values here, most once,
  # a few repeated so counts tie inside and across the size boundary, and
  # three documents without the field (in the total, in no bucket). The
  # buckets, sum_other_doc_count and the total are the Lucene twin's, which
  # counts exactly on one shard. Generated: values k0000..k1019 once each,
  # then k0042 and k0500 4 more times, k1000 3, k0007, k0100 and k0300 2,
  # k0999 1.
  - do:
      indices.create:
        index: kt_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: kt_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: kt_default
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      bulk:
        index: kt_luc
        refresh: true
        body:
          - index: { _id: "d0" }
          - { tag: k0000, n: 0 }
          - index: { _id: "d1" }
          - { tag: k0389, n: 1 }
          - index: { _id: "d2" }
