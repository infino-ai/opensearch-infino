"Zoned fixed date keys outside 1677 to 2262 fall on local time and match a Lucene twin":
  # The zoned fixed_interval key bins the local wall-clock time and reads
  # the start back in the zone. date_bin holds only 1677-09-21 to 2262-04-11
  # in nanoseconds, so outside it the local milliseconds are floored instead;
  # a floor of the UTC instant would put 05:30:45Z in 1600 at 04:00Z, not at
  # 10:00 local (04:30Z). Asia/Kolkata was +05:53:28 (LMT) in 1600, so its
  # first key is 10:00 local at that offset, checked by its epoch value.
  - do:
      indices.create:
        index: dzk_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              ts: { type: date }
  - do:
      indices.create:
        index: dzk_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              ts: { type: date }
  - do:
      bulk:
        refresh: true
        index: dzk_inf
        body:
          - index: { _id: "e1" }
          - { ts: "1600-03-01T05:30:45Z" }
          - index: { _id: "e2" }
