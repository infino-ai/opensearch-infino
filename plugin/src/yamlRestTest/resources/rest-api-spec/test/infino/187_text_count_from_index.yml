"A text query over several fields counts its total as a Lucene twin does, in proxy and default mode":
  # A query_string or match clauses over several text fields beside a filter
  # count their total from the token index: a document holding a word in two
  # fields counts once, an all-words clause keeps its mode, and a total past
  # track_total_hits is that limit, as stock reports it.
  - do:
      indices.create:
        index: tc_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
              title: { type: text }
  - do:
      indices.create:
        index: tc_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              "@timestamp": { type: date }
              message: { type: text }
              title: { type: text }
  - do:
      indices.create:
        index: tc_default
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
