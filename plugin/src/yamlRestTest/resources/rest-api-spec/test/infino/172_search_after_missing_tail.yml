        body:
          size: 2
          sort: [ { n: { order: asc, missing: _first } }, { k: asc } ]
          search_after: $after_sa3_luc_1
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "m3" }
  - match: { hits.hits.1._id: "p4" }
  - set: { hits.hits.1.sort: after_sa3_luc_2 }
  - do:
      search:
        index: sa3_luc
        body:
          size: 2
          sort: [ { n: { order: asc, missing: _first } }, { k: asc } ]
          search_after: $after_sa3_luc_2
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "p3" }
  - match: { hits.hits.1._id: "p2" }
  - set: { hits.hits.1.sort: after_sa3_luc_3 }
  - do:
      search:
        index: sa3_luc
        body:
          size: 2
          sort: [ { n: { order: asc, missing: _first } }, { k: asc } ]
          search_after: $after_sa3_luc_3
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "p1" }
  - do:
      search:
        index: sa3_inf
        body:
          size: 2
          sort: [ { n: { order: asc, missing: _first } }, { k: asc } ]
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "m1" }
  - match: { hits.hits.1._id: "m2" }
  - set: { hits.hits.1.sort: after_sa3_inf_1 }
  - do:
      search:
        index: sa3_inf
        body:
          size: 2
          sort: [ { n: { order: asc, missing: _first } }, { k: asc } ]
          search_after: $after_sa3_inf_1
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "m3" }
  - match: { hits.hits.1._id: "p4" }
  - set: { hits.hits.1.sort: after_sa3_inf_2 }
  - do:
      search:
        index: sa3_inf
        body:
          size: 2
          sort: [ { n: { order: asc, missing: _first } }, { k: asc } ]
          search_after: $after_sa3_inf_2
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "p3" }
  - match: { hits.hits.1._id: "p2" }
  - set: { hits.hits.1.sort: after_sa3_inf_3 }
  - do:
      search:
