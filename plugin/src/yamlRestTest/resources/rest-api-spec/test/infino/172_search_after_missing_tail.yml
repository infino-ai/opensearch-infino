        index: sa3_inf
        body:
          size: 2
          sort: [ { n: { order: desc, missing: _first } }, { k: asc } ]
          search_after: $after_sa3_inf_2
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "p2" }
  - match: { hits.hits.1._id: "p3" }
  - set: { hits.hits.1.sort: after_sa3_inf_3 }
  - do:
      search:
        index: sa3_inf
        body:
          size: 2
          sort: [ { n: { order: desc, missing: _first } }, { k: asc } ]
          search_after: $after_sa3_inf_3
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: "p4" }
  # Ascending.
  - do:
