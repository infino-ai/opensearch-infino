# A field left to dynamic mapping is mapped in proxy mode as stock maps it:
# proxy mode answers a bulk before any shard sees it, so before this the
# mapping never got the field and its column no text index, and match and
# query_string missed the hits a Lucene twin returns. Each case runs the same
# documents into a Lucene twin, a proxy-mode index and a default-mode index.
---
