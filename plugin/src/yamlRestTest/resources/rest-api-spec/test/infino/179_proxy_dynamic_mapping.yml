  - do: { bulk: { refresh: true, index: dr_def, body: [ {"index": {"_id": "r1"}}, {"when": "2023-02-03T04:05:06Z", "count": 7, "ratio": 1.5, "flag": true, "num_text": "42", "zip_code": "ab-12", "fixed": {"a": "x"}, "loose": {"a": "y", "b": "ignored words"}} ] } }
