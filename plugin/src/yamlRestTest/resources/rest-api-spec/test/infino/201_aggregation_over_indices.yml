  - do:
      index: { index: aovt_n_def, id: "1", refresh: true, body: { user: 1, latency_ms: 1.5 } }
  - do:
      catch: /over several indices that map it as different types is not served/
      search:
        index: "aovt_z_def,aovt_n_def"
        body: { size: 0, aggs: { c: { cardinality: { field: user } } } }
  - do:
      catch: /over several indices that map it as different types is not served/
      search:
        index: "aovt_z_def,aovt_n_def"
        body: { size: 0, aggs: { p: { percentiles: { field: latency_ms } } } }
  - do:
      catch: /over several indices that map it as different types is not served/
      search:
        index: "aovt_z_def,aovt_n_def"
        body: { size: 0, aggs: { t: { terms: { field: latency_ms }, aggs: { c: { cardinality: { field: user } } } } } }
