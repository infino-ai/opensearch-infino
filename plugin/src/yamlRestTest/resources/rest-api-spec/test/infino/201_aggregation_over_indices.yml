        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { team: { type: keyword }, user: { type: keyword }, latency_ms: { type: long } } }
  - do:
      bulk:
        refresh: true
        index: aofa_x_luc
        body:
          - index: { _id: "1" }
          - { team: a, user: u0, latency_ms: 10 }
          - index: { _id: "2" }
          - { team: a, user: u1, latency_ms: 20 }
          - index: { _id: "3" }
          - { team: b, user: u2, latency_ms: 500 }
  - do:
      indices.create:
        index: aofa_y_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { team: { type: keyword }, user: { type: keyword }, latency_ms: { type: long } } }
