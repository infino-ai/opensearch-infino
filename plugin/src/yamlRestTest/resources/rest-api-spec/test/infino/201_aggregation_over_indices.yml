          - index: { _id: "2" }
          - { team: a, user: u3, latency_ms: 40 }
          - index: { _id: "3" }
          - { team: b, user: u4, latency_ms: 600 }
  - do:
      indices.put_alias:
        index: "aofa_x_luc,aofa_y_luc"
        name: aofa_team_a_luc
        body: { filter: { term: { team: a } } }
  - do:
      search:
        index: aofa_team_a_luc
        body: { size: 0, aggs: { c: { cardinality: { field: user } }, p: { percentiles: { field: latency_ms, percents: [ 0, 100 ] } } } }
  - match: { hits.total.value: 4 }
  - match: { aggregations.c.value: 3 }
  - match: { aggregations.p.values.0\.0: 10.0 }
  - match: { aggregations.p.values.100\.0: 40.0 }

