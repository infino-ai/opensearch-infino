# A cardinality or percentiles over several indices counts every index's
# rows, read as one, and answers as on Lucene twins in default and proxy
# mode. A field one index does not map is read from the indices that map
# it, whichever index comes first: an index without it (here aov_a_*, or a
# dot-named index like the ones plugins keep their settings in) adds no
# value and takes none away. Over overlapping indices the answer is the
# union's, not the larger index's. A field two of the indices map as
# different kinds of value is refused: stock answers each index by its own
# mapping and merges the parts by value type, which one answer over the
# rows read as one cannot do. Integers of any width are one kind.
---
"Over several indices, a field some of them do not map, a Lucene twin":
  - skip:
      features: allowed_warnings
  - do:
      indices.create:
        index: aov_a_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { other: { type: keyword } } }
  - do:
      bulk:
        refresh: true
        index: aov_a_luc
        body:
          - index: { _id: "1" }
          - { other: x }
  - do:
      indices.create:
        index: aov_z_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { user: { type: keyword }, latency_ms: { type: long } } }
  - do:
      bulk:
        refresh: true
        index: aov_z_luc
        body:
          - index: { _id: "1" }
          - { user: u0, latency_ms: 10 }
          - index: { _id: "2" }
          - { user: u1, latency_ms: 20 }
          - index: { _id: "3" }
          - { user: u2, latency_ms: 30 }
          - index: { _id: "4" }
          - { user: u3, latency_ms: 40 }
          - index: { _id: "5" }
          - { user: u4, latency_ms: 50 }
  - do:
      indices.create:
        index: aov_b_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { user: { type: keyword }, latency_ms: { type: integer } } }
  - do:
      bulk:
        refresh: true
        index: aov_b_luc
        body:
          - index: { _id: "1" }
          - { user: u3, latency_ms: 60 }
          - index: { _id: "2" }
          - { user: u4, latency_ms: 70 }
          - index: { _id: "3" }
          - { user: u5, latency_ms: 80 }
          - index: { _id: "4" }
          - { user: u6, latency_ms: 90 }
  - do:
      allowed_warnings:
        - "index name [.aov_sys_luc] starts with a dot '.', in the next major version, index names starting with a dot are reserved for hidden indices and system indices"
      indices.create:
        index: .aov_sys_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { config_type: { type: keyword } } }
  - do:
      index: { index: .aov_sys_luc, id: "1", refresh: true, body: { config_type: x } }
  - do:
      search:
        index: "aov_a_luc,aov_z_luc"
        body: { size: 0, aggs: { c: { cardinality: { field: user } }, p: { percentiles: { field: latency_ms, percents: [ 0, 50, 100 ] } } } }
  - match: { aggregations.c.value: 5 }
  - match: { aggregations.p.values.0\.0: 10.0 }
  - match: { aggregations.p.values.50\.0: 30.0 }
  - match: { aggregations.p.values.100\.0: 50.0 }
  - do:
      search:
        index: "aov_z_luc,aov_a_luc"
        body: { size: 0, aggs: { c: { cardinality: { field: user } }, p: { percentiles: { field: latency_ms, percents: [ 0, 50, 100 ] } } } }
  - match: { aggregations.c.value: 5 }
  - match: { aggregations.p.values.0\.0: 10.0 }
  - match: { aggregations.p.values.50\.0: 30.0 }
  - match: { aggregations.p.values.100\.0: 50.0 }
  - do:
      search:
        index: ".aov_sys_luc,aov_z_luc"
        body: { size: 0, aggs: { c: { cardinality: { field: user } }, p: { percentiles: { field: latency_ms, percents: [ 0, 50, 100 ] } } } }
  - match: { aggregations.c.value: 5 }
  - match: { aggregations.p.values.0\.0: 10.0 }
  - match: { aggregations.p.values.50\.0: 30.0 }
  - match: { aggregations.p.values.100\.0: 50.0 }
  # Overlapping indices, one with latency_ms as an integer: users u0..u6
  # over both, and the smallest latency is the first index's.
  - do:
      search:
        index: "aov_a_luc,aov_z_luc,aov_b_luc"
        body: { size: 0, aggs: { c: { cardinality: { field: user } }, p: { percentiles: { field: latency_ms, percents: [ 0, 100 ] } } } }
  - match: { aggregations.c.value: 7 }
  - match: { aggregations.p.values.0\.0: 10.0 }
  - match: { aggregations.p.values.100\.0: 90.0 }
