# The same mapping and documents go to an Infino-backed index and to a
# Lucene twin, for a mapping that disables _source, one that excludes a
# field from it and one that keeps only some fields. The table keeps each
# document as it was indexed (nested queries read it, see 160_nested), so
# what a hit, a top_hits hit, a get and an mget return must follow the
# mapping's _source as stock's does.
---
"With _source disabled, a hit, a get and an mget carry none, as on a Lucene twin":
  - do:
      indices.create:
        index: off_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { _source: { enabled: false }, properties: { rank: { type: long }, note: { type: keyword }, items: { type: nested, properties: { name: { type: keyword } } } } }
  - do:
      indices.create:
        index: off_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { _source: { enabled: false }, properties: { rank: { type: long }, note: { type: keyword }, items: { type: nested, properties: { name: { type: keyword } } } } }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do: { bulk: { refresh: true, index: off_inf, body: [ { index: { _id: d1 } }, { rank: 1, note: a, items: [ { name: size } ] } ] } }
  - match: { errors: false }
  - do: { bulk: { refresh: true, index: off_luc, body: [ { index: { _id: d1 } }, { rank: 1, note: a, items: [ { name: size } ] } ] } }
  - match: { errors: false }
  - do: { search: { index: off_luc, body: { query: { match_all: {} } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d1 }
  - is_false: hits.hits.0._source
  - do: { search: { index: off_inf, body: { query: { match_all: {} } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d1 }
  - is_false: hits.hits.0._source
  # Asking for some of it is refused, as stock refuses it.
  - do:
      catch: /_source is disabled in the mappings for index \[off_luc\]/
      search: { index: off_luc, body: { _source: [ rank ], query: { match_all: {} } } }
  - do:
      catch: /_source is disabled in the mappings for index \[off_inf\]/
      search: { index: off_inf, body: { _source: [ rank ], query: { match_all: {} } } }
  - do:
      catch: /_source is disabled in the mappings for index \[off_luc\]/
      search: { index: off_luc, body: { size: 0, aggs: { t: { top_hits: { size: 1, _source: [ rank ] } } } } }
  - do:
      catch: /_source is disabled in the mappings for index \[off_inf\]/
      search: { index: off_inf, body: { size: 0, aggs: { t: { top_hits: { size: 1, _source: [ rank ] } } } } }
  # A nested query still reads the entries.
  - do: { search: { index: off_inf, body: { query: { nested: { path: items, query: { term: { items.name: size } } } } } } }
  - match: { hits.total.value: 1 }
  - is_false: hits.hits.0._source
  - do: { search: { index: off_luc, body: { size: 0, aggs: { t: { top_hits: { size: 1 } } } } } }
  - match: { aggregations.t.hits.hits.0._id: d1 }
  - is_false: aggregations.t.hits.hits.0._source
  - do: { search: { index: off_inf, body: { size: 0, aggs: { t: { top_hits: { size: 1 } } } } } }
  - match: { aggregations.t.hits.hits.0._id: d1 }
  - is_false: aggregations.t.hits.hits.0._source
  - do: { get: { index: off_luc, id: d1 } }
  - match: { found: true }
  - is_false: _source
  - do: { get: { index: off_inf, id: d1 } }
  - match: { found: true }
  - is_false: _source
  - do: { mget: { body: { docs: [ { _index: off_luc, _id: d1 } ] } } }
  - match: { docs.0.found: true }
  - is_false: docs.0._source
  - do: { mget: { body: { docs: [ { _index: off_inf, _id: d1 } ] } } }
  - match: { docs.0.found: true }
  - is_false: docs.0._source
  # A get that filters the source finds the document, with none.
  - do: { get: { index: off_luc, id: d1, _source_includes: rank } }
  - match: { found: true }
  - is_false: _source
  - do: { get: { index: off_inf, id: d1, _source_includes: rank } }
  - match: { found: true }
  - is_false: _source

---
"With _source excluding a field, a hit, a get and an mget leave it out, as on a Lucene twin":
  - do:
      indices.create:
        index: ex_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { _source: { excludes: [ items ] }, properties: { rank: { type: long }, note: { type: keyword }, items: { type: nested, properties: { name: { type: keyword } } } } }
  - do:
      indices.create:
        index: ex_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { _source: { excludes: [ items ] }, properties: { rank: { type: long }, note: { type: keyword }, items: { type: nested, properties: { name: { type: keyword } } } } }
  - do: { bulk: { refresh: true, index: ex_inf, body: [ { index: { _id: d1 } }, { rank: 1, note: a, items: [ { name: size } ] } ] } }
  - match: { errors: false }
  - do: { bulk: { refresh: true, index: ex_luc, body: [ { index: { _id: d1 } }, { rank: 1, note: a, items: [ { name: size } ] } ] } }
  - match: { errors: false }
  - do: { search: { index: ex_luc, body: { query: { match_all: {} } } } }
  - match: { hits.hits.0._source: { rank: 1, note: a } }
  - do: { search: { index: ex_inf, body: { query: { match_all: {} } } } }
  - match: { hits.hits.0._source: { rank: 1, note: a } }
  # The request's own filter applies to what the mapping keeps.
  - do: { search: { index: ex_luc, body: { _source: [ rank, items ], query: { match_all: {} } } } }
  - match: { hits.hits.0._source: { rank: 1 } }
  - do: { search: { index: ex_inf, body: { _source: [ rank, items ], query: { match_all: {} } } } }
  - match: { hits.hits.0._source: { rank: 1 } }
  # A nested query still reads the excluded entries.
  - do: { search: { index: ex_inf, body: { query: { nested: { path: items, query: { term: { items.name: size } } } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._source: { rank: 1, note: a } }
  - do: { search: { index: ex_luc, body: { size: 0, aggs: { t: { top_hits: { size: 1 } } } } } }
  - match: { aggregations.t.hits.hits.0._source: { rank: 1, note: a } }
  - do: { search: { index: ex_inf, body: { size: 0, aggs: { t: { top_hits: { size: 1 } } } } } }
  - match: { aggregations.t.hits.hits.0._source: { rank: 1, note: a } }
  - do: { get: { index: ex_luc, id: d1 } }
  - match: { _source: { rank: 1, note: a } }
  - do: { get: { index: ex_inf, id: d1 } }
  - match: { _source: { rank: 1, note: a } }
  - do: { mget: { body: { docs: [ { _index: ex_luc, _id: d1 } ] } } }
  - match: { docs.0._source: { rank: 1, note: a } }
  - do: { mget: { body: { docs: [ { _index: ex_inf, _id: d1 } ] } } }
  - match: { docs.0._source: { rank: 1, note: a } }

---
"With _source including some fields, a hit, a get and an mget keep only those, as on a Lucene twin":
  - do:
      indices.create:
        index: in_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { _source: { includes: [ rank, items ] }, properties: { rank: { type: long }, note: { type: keyword }, items: { type: nested, properties: { name: { type: keyword } } } } }
  - do:
      indices.create:
        index: in_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { _source: { includes: [ rank, items ] }, properties: { rank: { type: long }, note: { type: keyword }, items: { type: nested, properties: { name: { type: keyword } } } } }
  - do: { bulk: { refresh: true, index: in_inf, body: [ { index: { _id: d1 } }, { rank: 1, note: a, items: [ { name: size } ] } ] } }
  - match: { errors: false }
  - do: { bulk: { refresh: true, index: in_luc, body: [ { index: { _id: d1 } }, { rank: 1, note: a, items: [ { name: size } ] } ] } }
  - match: { errors: false }
  - do: { search: { index: in_luc, body: { query: { match_all: {} } } } }
  - match: { hits.hits.0._source: { rank: 1, items: [ { name: size } ] } }
  - do: { search: { index: in_inf, body: { query: { match_all: {} } } } }
  - match: { hits.hits.0._source: { rank: 1, items: [ { name: size } ] } }
  - do: { search: { index: in_luc, body: { size: 0, aggs: { t: { top_hits: { size: 1 } } } } } }
  - match: { aggregations.t.hits.hits.0._source: { rank: 1, items: [ { name: size } ] } }
  - do: { search: { index: in_inf, body: { size: 0, aggs: { t: { top_hits: { size: 1 } } } } } }
  - match: { aggregations.t.hits.hits.0._source: { rank: 1, items: [ { name: size } ] } }
  - do: { get: { index: in_luc, id: d1 } }
  - match: { _source: { rank: 1, items: [ { name: size } ] } }
  - do: { get: { index: in_inf, id: d1 } }
  - match: { _source: { rank: 1, items: [ { name: size } ] } }
  - do: { mget: { body: { docs: [ { _index: in_luc, _id: d1 } ] } } }
  - match: { docs.0._source: { rank: 1, items: [ { name: size } ] } }
  - do: { mget: { body: { docs: [ { _index: in_inf, _id: d1 } ] } } }
  - match: { docs.0._source: { rank: 1, items: [ { name: size } ] } }
