# A keyword field given an array of values that each fit in one Lucene term
# (32,766 bytes in UTF-8) but, joined, do not: three values of 11,000 bytes,
# on a Lucene index, in proxy mode and in default mode. Stock indexes each
# value as a term of its own and stores the document. Every index stores it,
# finds it by a term on any one of its values, counts each value in a terms
# aggregation, and never takes the values joined for one term. Nothing is
# acknowledged and then lost: each index ends with the same documents.
#
# Such a document's own column is null, its values in its list column, so
# every reader takes them from there: a query_string "has a value", wildcard
# and regexp atom, and a script's doc['f'].size(), .empty and .value, as
# stock does.

---
"A keyword array of values that each fit one term is stored and found by each value":
  - do:
      indices.create:
        index: kwa_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: kwa_px
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: kwa_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              n: { type: long }
  # The values, kept in the source of a stock index that maps none of them.
  - do:
      indices.create:
        index: kwa_values
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: false }
  - do: { index: { index: kwa_values, id: v, refresh: true, body: { a: "", b: "", c: "" } } }
  - do: { get: { index: kwa_values, id: v } }
  - set: { _source.a: a, _source.b: b, _source.c: c }
  # kwa_luc
  - do: { index: { index: kwa_luc, id: k1, body: { n: 1, tags: [ $a, $b, $c ] } } }
  - match: { result: created }
  - do: { bulk: { index: kwa_luc, body: [ {"index": {"_id": "k2"}}, {"n": 2, "tags": [ "red", "green" ]}, {"index": {"_id": "k3"}}, {"n": 3, "tags": "red"} ] } }
  - match: { errors: false }
  # A document that grows past a term's length joined, by an update that adds values.
  - do: { index: { index: kwa_luc, id: k4, body: { n: 4, tags: [ "green" ] } } }
  - do: { update: { index: kwa_luc, id: k4, body: { doc: { tags: [ "green", $a, $b, $c ] } } } }
  - match: { result: updated }
  - do: { indices.refresh: { index: kwa_luc } }
  - do: { count: { index: kwa_luc } }
  - match: { count: 4 }
  - do: { search: { index: kwa_luc, body: { size: 10, sort: [ { n: asc } ], query: { term: { tags: $b } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: k1 }
  - match: { hits.hits.1._id: k4 }
  - do: { search: { index: kwa_luc, body: { query: { term: { tags: red } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwa_luc, body: { size: 10, sort: [ { n: asc } ], query: { terms: { tags: [ "green" ] } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: k2 }
  - match: { hits.hits.1._id: k4 }
  # The values joined are no term of the field.
  - do: { search: { index: kwa_luc, body: { query: { term: { tags: "red green" } } } } }
  - match: { hits.total.value: 0 }
  - do: { search: { index: kwa_luc, body: { query: { exists: { field: tags } } } } }
  - match: { hits.total.value: 4 }
  - do: { search: { index: kwa_luc, body: { size: 0, aggs: { t: { terms: { field: tags, size: 10 } } } } } }
  - length: { aggregations.t.buckets: 5 }
  - match: { aggregations.t.buckets.0.key: $a }
  - match: { aggregations.t.buckets.0.doc_count: 2 }
  - match: { aggregations.t.buckets.1.key: $b }
  - match: { aggregations.t.buckets.1.doc_count: 2 }
  - match: { aggregations.t.buckets.2.key: $c }
  - match: { aggregations.t.buckets.2.doc_count: 2 }
  - match: { aggregations.t.buckets.3.key: green }
  - match: { aggregations.t.buckets.3.doc_count: 2 }
  - match: { aggregations.t.buckets.4.key: red }
  - match: { aggregations.t.buckets.4.doc_count: 2 }
  - match: { aggregations.t.sum_other_doc_count: 0 }
  - do: { get: { index: kwa_luc, id: k1 } }
  - match: { _source.tags.1: $b }
  # kwa_px
  - do: { index: { index: kwa_px, id: k1, body: { n: 1, tags: [ $a, $b, $c ] } } }
  - match: { result: created }
  - do: { bulk: { index: kwa_px, body: [ {"index": {"_id": "k2"}}, {"n": 2, "tags": [ "red", "green" ]}, {"index": {"_id": "k3"}}, {"n": 3, "tags": "red"} ] } }
  - match: { errors: false }
  # A document that grows past a term's length joined, by an update that adds values.
  - do: { index: { index: kwa_px, id: k4, body: { n: 4, tags: [ "green" ] } } }
  - do: { update: { index: kwa_px, id: k4, body: { doc: { tags: [ "green", $a, $b, $c ] } } } }
  - match: { result: updated }
  - do: { indices.refresh: { index: kwa_px } }
  - do: { count: { index: kwa_px } }
  - match: { count: 4 }
  - do: { search: { index: kwa_px, body: { size: 10, sort: [ { n: asc } ], query: { term: { tags: $b } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: k1 }
  - match: { hits.hits.1._id: k4 }
  - do: { search: { index: kwa_px, body: { query: { term: { tags: red } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwa_px, body: { size: 10, sort: [ { n: asc } ], query: { terms: { tags: [ "green" ] } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: k2 }
  - match: { hits.hits.1._id: k4 }
  # The values joined are no term of the field.
  - do: { search: { index: kwa_px, body: { query: { term: { tags: "red green" } } } } }
  - match: { hits.total.value: 0 }
  - do: { search: { index: kwa_px, body: { query: { exists: { field: tags } } } } }
  - match: { hits.total.value: 4 }
  - do: { search: { index: kwa_px, body: { size: 0, aggs: { t: { terms: { field: tags, size: 10 } } } } } }
  - length: { aggregations.t.buckets: 5 }
  - match: { aggregations.t.buckets.0.key: $a }
  - match: { aggregations.t.buckets.0.doc_count: 2 }
  - match: { aggregations.t.buckets.1.key: $b }
  - match: { aggregations.t.buckets.1.doc_count: 2 }
  - match: { aggregations.t.buckets.2.key: $c }
  - match: { aggregations.t.buckets.2.doc_count: 2 }
  - match: { aggregations.t.buckets.3.key: green }
  - match: { aggregations.t.buckets.3.doc_count: 2 }
  - match: { aggregations.t.buckets.4.key: red }
  - match: { aggregations.t.buckets.4.doc_count: 2 }
  - match: { aggregations.t.sum_other_doc_count: 0 }
  - do: { get: { index: kwa_px, id: k1 } }
  - match: { _source.tags.1: $b }
  # kwa_def
  - do: { index: { index: kwa_def, id: k1, body: { n: 1, tags: [ $a, $b, $c ] } } }
  - match: { result: created }
  - do: { bulk: { index: kwa_def, body: [ {"index": {"_id": "k2"}}, {"n": 2, "tags": [ "red", "green" ]}, {"index": {"_id": "k3"}}, {"n": 3, "tags": "red"} ] } }
  - match: { errors: false }
  # A document that grows past a term's length joined, by an update that adds values.
  - do: { index: { index: kwa_def, id: k4, body: { n: 4, tags: [ "green" ] } } }
  - do: { update: { index: kwa_def, id: k4, body: { doc: { tags: [ "green", $a, $b, $c ] } } } }
  - match: { result: updated }
  - do: { indices.refresh: { index: kwa_def } }
  - do: { count: { index: kwa_def } }
  - match: { count: 4 }
  - do: { search: { index: kwa_def, body: { size: 10, sort: [ { n: asc } ], query: { term: { tags: $b } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: k1 }
  - match: { hits.hits.1._id: k4 }
  - do: { search: { index: kwa_def, body: { query: { term: { tags: red } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwa_def, body: { size: 10, sort: [ { n: asc } ], query: { terms: { tags: [ "green" ] } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: k2 }
  - match: { hits.hits.1._id: k4 }
  # The values joined are no term of the field.
  - do: { search: { index: kwa_def, body: { query: { term: { tags: "red green" } } } } }
  - match: { hits.total.value: 0 }
  - do: { search: { index: kwa_def, body: { query: { exists: { field: tags } } } } }
  - match: { hits.total.value: 4 }
  - do: { search: { index: kwa_def, body: { size: 0, aggs: { t: { terms: { field: tags, size: 10 } } } } } }
  - length: { aggregations.t.buckets: 5 }
  - match: { aggregations.t.buckets.0.key: $a }
  - match: { aggregations.t.buckets.0.doc_count: 2 }
  - match: { aggregations.t.buckets.1.key: $b }
  - match: { aggregations.t.buckets.1.doc_count: 2 }
  - match: { aggregations.t.buckets.2.key: $c }
  - match: { aggregations.t.buckets.2.doc_count: 2 }
  - match: { aggregations.t.buckets.3.key: green }
  - match: { aggregations.t.buckets.3.doc_count: 2 }
  - match: { aggregations.t.buckets.4.key: red }
  - match: { aggregations.t.buckets.4.doc_count: 2 }
  - match: { aggregations.t.sum_other_doc_count: 0 }
  - do: { get: { index: kwa_def, id: k1 } }
  - match: { _source.tags.1: $b }

---
"query_string atoms and a script read every value of a keyword array":
  - do:
      indices.create:
        index: kwq_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: kwq_px
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: kwq_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              n: { type: long }
  # kwq_luc
  - do: { bulk: { index: kwq_luc, refresh: true, body: [ {"index": {"_id": "q1"}}, {"n": 1, "tags": [ "red", "green" ]}, {"index": {"_id": "q2"}}, {"n": 2, "tags": "red"}, {"index": {"_id": "q3"}}, {"n": 3} ] } }
  - match: { errors: false }
  - do: { search: { index: kwq_luc, body: { query: { query_string: { query: "tags:*" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_luc, body: { query: { query_string: { query: "tags:[* TO *]" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_luc, body: { query: { query_string: { query: "tags:gr*" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_luc, body: { query: { query_string: { query: "tags:/gr.*/" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_luc, body: { query: { simple_query_string: { query: "gr*", fields: [ tags ] } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_luc, body: { query: { script: { script: "doc['tags'].size() > 0" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_luc, body: { query: { script: { script: "doc['tags'].size() > 1" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_luc, body: { query: { script: { script: "doc['tags'].empty" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q3 }
  - do: { search: { index: kwq_luc, body: { sort: [ { n: asc } ], script_fields: { sz: { script: "doc['tags'].size()" } } } } }
  - match: { hits.hits.0.fields.sz.0: 2 }
  - match: { hits.hits.1.fields.sz.0: 1 }
  - match: { hits.hits.2.fields.sz.0: 0 }
  # kwq_px
  - do: { bulk: { index: kwq_px, refresh: true, body: [ {"index": {"_id": "q1"}}, {"n": 1, "tags": [ "red", "green" ]}, {"index": {"_id": "q2"}}, {"n": 2, "tags": "red"}, {"index": {"_id": "q3"}}, {"n": 3} ] } }
  - match: { errors: false }
  - do: { search: { index: kwq_px, body: { query: { query_string: { query: "tags:*" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_px, body: { query: { query_string: { query: "tags:[* TO *]" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_px, body: { query: { query_string: { query: "tags:gr*" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_px, body: { query: { query_string: { query: "tags:/gr.*/" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_px, body: { query: { simple_query_string: { query: "gr*", fields: [ tags ] } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_px, body: { query: { script: { script: "doc['tags'].size() > 0" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_px, body: { query: { script: { script: "doc['tags'].size() > 1" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_px, body: { query: { script: { script: "doc['tags'].empty" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q3 }
  - do: { search: { index: kwq_px, body: { sort: [ { n: asc } ], script_fields: { sz: { script: "doc['tags'].size()" } } } } }
  - match: { hits.hits.0.fields.sz.0: 2 }
  - match: { hits.hits.1.fields.sz.0: 1 }
  - match: { hits.hits.2.fields.sz.0: 0 }
  # kwq_def
  - do: { bulk: { index: kwq_def, refresh: true, body: [ {"index": {"_id": "q1"}}, {"n": 1, "tags": [ "red", "green" ]}, {"index": {"_id": "q2"}}, {"n": 2, "tags": "red"}, {"index": {"_id": "q3"}}, {"n": 3} ] } }
  - match: { errors: false }
  - do: { search: { index: kwq_def, body: { query: { query_string: { query: "tags:*" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_def, body: { query: { query_string: { query: "tags:[* TO *]" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_def, body: { query: { query_string: { query: "tags:gr*" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_def, body: { query: { query_string: { query: "tags:/gr.*/" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_def, body: { query: { simple_query_string: { query: "gr*", fields: [ tags ] } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_def, body: { query: { script: { script: "doc['tags'].size() > 0" } } } } }
  - match: { hits.total.value: 2 }
  - do: { search: { index: kwq_def, body: { query: { script: { script: "doc['tags'].size() > 1" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q1 }
  - do: { search: { index: kwq_def, body: { query: { script: { script: "doc['tags'].empty" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: q3 }
  - do: { search: { index: kwq_def, body: { sort: [ { n: asc } ], script_fields: { sz: { script: "doc['tags'].size()" } } } } }
  - match: { hits.hits.0.fields.sz.0: 2 }
  - match: { hits.hits.1.fields.sz.0: 1 }
  - match: { hits.hits.2.fields.sz.0: 0 }

---
"A script's doc['f'].value on an array is its least value, as stock's":
  # Stock's doc values keep a document's values sorted, a keyword's by its
  # UTF-8 bytes ("Zebra" before "apple"), a number's by value, and .value
  # is the first of them.
  - do:
      indices.create:
        index: kwv_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              nums: { type: long }
              n: { type: long }
  - do:
      indices.create:
        index: kwv_px
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              nums: { type: long }
              n: { type: long }
  - do:
      indices.create:
        index: kwv_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tags: { type: keyword }
              nums: { type: long }
              n: { type: long }
  - do: { bulk: { index: kwv_luc, refresh: true, body: [ {"index": {"_id": "v1"}}, {"n": 1, "tags": [ "red", "green", "Zebra", "apple" ], "nums": [ 5, 2, 9 ]}, {"index": {"_id": "v2"}}, {"n": 2, "tags": "solo", "nums": 7} ] } }
  - match: { errors: false }
  - do: { search: { index: kwv_luc, body: { sort: [ { n: asc } ], script_fields: { t: { script: "doc['tags'].value" }, m: { script: "doc['nums'].value" } } } } }
  - match: { hits.hits.0.fields.t.0: Zebra }
  - match: { hits.hits.0.fields.m.0: 2 }
  - match: { hits.hits.1.fields.t.0: solo }
  - match: { hits.hits.1.fields.m.0: 7 }
  - do: { search: { index: kwv_luc, body: { query: { script: { script: "doc['tags'].value == 'Zebra'" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: v1 }
  - do: { search: { index: kwv_luc, body: { query: { script: { script: "doc['nums'].value < 5" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: v1 }
  - do: { bulk: { index: kwv_px, refresh: true, body: [ {"index": {"_id": "v1"}}, {"n": 1, "tags": [ "red", "green", "Zebra", "apple" ], "nums": [ 5, 2, 9 ]}, {"index": {"_id": "v2"}}, {"n": 2, "tags": "solo", "nums": 7} ] } }
  - match: { errors: false }
  - do: { search: { index: kwv_px, body: { sort: [ { n: asc } ], script_fields: { t: { script: "doc['tags'].value" }, m: { script: "doc['nums'].value" } } } } }
  - match: { hits.hits.0.fields.t.0: Zebra }
  - match: { hits.hits.0.fields.m.0: 2 }
  - match: { hits.hits.1.fields.t.0: solo }
  - match: { hits.hits.1.fields.m.0: 7 }
  - do: { search: { index: kwv_px, body: { query: { script: { script: "doc['tags'].value == 'Zebra'" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: v1 }
  - do: { search: { index: kwv_px, body: { query: { script: { script: "doc['nums'].value < 5" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: v1 }
  - do: { bulk: { index: kwv_def, refresh: true, body: [ {"index": {"_id": "v1"}}, {"n": 1, "tags": [ "red", "green", "Zebra", "apple" ], "nums": [ 5, 2, 9 ]}, {"index": {"_id": "v2"}}, {"n": 2, "tags": "solo", "nums": 7} ] } }
  - match: { errors: false }
  - do: { search: { index: kwv_def, body: { sort: [ { n: asc } ], script_fields: { t: { script: "doc['tags'].value" }, m: { script: "doc['nums'].value" } } } } }
  - match: { hits.hits.0.fields.t.0: Zebra }
  - match: { hits.hits.0.fields.m.0: 2 }
  - match: { hits.hits.1.fields.t.0: solo }
  - match: { hits.hits.1.fields.m.0: 7 }
  - do: { search: { index: kwv_def, body: { query: { script: { script: "doc['tags'].value == 'Zebra'" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: v1 }
  - do: { search: { index: kwv_def, body: { query: { script: { script: "doc['nums'].value < 5" } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: v1 }
