"Every match clause of a bool adds its BM25 to the score, as a Lucene twin scores it":
  # Stock sums the scores of a bool's must and should clauses, so each
  # match clause adds its own BM25 where it matches, on one field or on
  # several, and a clause given twice adds twice. Proxy and default mode
  # rank the same way. Every document is under 16 tokens, so the engine
  # keeps the same lengths as Lucene and the scores agree.
  - do:
      indices.create:
        index: mc_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { message: { type: text }, title: { type: text } } }
  - do:
      indices.create:
        index: mc_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { message: { type: text }, title: { type: text } } }
  - do:
      indices.create:
        index: mc_default
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { message: { type: text }, title: { type: text } } }
  - do:
      bulk:
        refresh: true
        index: mc_luc
        body:
          - index: { _id: "d01" }
          - {"message": "disk error", "title": "disk"}
          - index: { _id: "d02" }
          - {"message": "error error error", "title": "error"}
          - index: { _id: "d03" }
          - {"message": "disk full now", "title": "error"}
          - index: { _id: "d04" }
          - {"message": "error", "title": "disk"}
          - index: { _id: "d05" }
          - {"message": "disk disk error log", "title": "log"}
          - index: { _id: "d06" }
          - {"message": "log rotated", "title": "disk error"}
          - index: { _id: "d07" }
          - {"message": "error on the disk sector seven", "title": "sector"}
          - index: { _id: "d08" }
          - {"message": "cpu error", "title": "cpu"}
          - index: { _id: "d09" }
          - {"message": "disk", "title": "error report"}
          - index: { _id: "d10" }
          - {"message": "fan noise", "title": "fan"}
  - match: { errors: false }
