"Only the rows every must match keeps are ranked, however high the rows one clause matches score":
  # Twelve short documents hold one of the two words and each scores more
  # on its own clause than s00, the only document holding both, scores in
  # sum; a page of one is still s00.
  - do:
      indices.create:
        index: mx_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { message: { type: text } } }
