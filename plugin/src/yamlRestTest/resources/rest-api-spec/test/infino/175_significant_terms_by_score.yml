---
"significant_terms keeps a bucket's best terms by score, not by count, as a Lucene twin does":
  # In group a (10 documents, 31 in all) the frequent terms c (4) and m (3)
  # are less common here than overall and score 0. The rare r2 (1, only in
  # a) scores highest, then r1 (2 of 4). With shard_size 2 a cut by count
  # would keep c and m and return nothing; stock scores every term and keeps
  # r2 and r1. The same documents go to a Lucene twin, a default-mode and a
  # proxy-mode index.
  - do:
      indices.create:
        index: sbs_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              group: { type: keyword }
              tag: { type: keyword }
  - do:
      indices.create:
        index: sbs_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              group: { type: keyword }
              tag: { type: keyword }
  - do:
      indices.create:
        index: sbs_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              group: { type: keyword }
              tag: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: sbs_luc
        body:
          - index: { _id: "d0" }
          - { group: a, tag: c }
          - index: { _id: "d1" }
          - { group: a, tag: c }
          - index: { _id: "d2" }
          - { group: a, tag: c }
          - index: { _id: "d3" }
          - { group: a, tag: c }
          - index: { _id: "d4" }
          - { group: a, tag: m }
          - index: { _id: "d5" }
