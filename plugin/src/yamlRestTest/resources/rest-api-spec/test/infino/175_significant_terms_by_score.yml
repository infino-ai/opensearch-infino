  - length: { aggregations.groups.buckets: 2 }
  - match: { aggregations.groups.buckets.0.key: b }
  - length: { aggregations.groups.buckets.0.sig.buckets: 2 }
  - match: { aggregations.groups.buckets.0.sig.buckets.0.key: c }
  - match: { aggregations.groups.buckets.0.sig.buckets.1.key: m }
  - match: { aggregations.groups.buckets.1.key: a }
