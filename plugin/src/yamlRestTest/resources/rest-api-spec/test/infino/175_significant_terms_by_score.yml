          - index: { _id: "d8" }
          - { group: a, tag: r1 }
          - index: { _id: "d9" }
          - { group: a, tag: r2 }
          - index: { _id: "d10" }
          - { group: b, tag: c }
          - index: { _id: "d11" }
          - { group: b, tag: c }
          - index: { _id: "d12" }
