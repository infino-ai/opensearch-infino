---
"significant_terms under a terms parent keeps each bucket's best by score past the fence, as a Lucene twin does":
  # The plugin reads each bucket's 2 * shard_size + 1 best terms by an
  # upper bound of their score. In a, x1..x5 are rare there but common in
  # the documents without a group: their bound ties a2's score, so the
  # fence proves nothing and a is read in full. In b the counts fall
  # steadily and the fence holds. Either way a bucket keeps the terms a
  # stock shard keeps: a1, a2 and b1, b2.
  - do:
      indices.create:
        index: sbf_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              group: { type: keyword }
              tag: { type: keyword }
  - do:
      indices.create:
        index: sbf_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              group: { type: keyword }
              tag: { type: keyword }
  - do:
      indices.create:
        index: sbf_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              group: { type: keyword }
              tag: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: sbf_luc
        body:
          - index: { _id: "d0" }
          - { group: a, tag: a1 }
          - index: { _id: "d1" }
          - { group: a, tag: a1 }
          - index: { _id: "d2" }
          - { group: a, tag: a2 }
          - index: { _id: "d3" }
          - { group: a, tag: x1 }
          - index: { _id: "d4" }
          - { group: a, tag: x2 }
          - index: { _id: "d5" }
          - { group: a, tag: x3 }
          - index: { _id: "d6" }
          - { group: a, tag: x4 }
          - index: { _id: "d7" }
          - { group: a, tag: x5 }
          - index: { _id: "d8" }
          - { group: b, tag: b1 }
          - index: { _id: "d9" }
          - { group: b, tag: b1 }
          - index: { _id: "d10" }
          - { group: b, tag: b1 }
          - index: { _id: "d11" }
          - { group: b, tag: b1 }
          - index: { _id: "d12" }
          - { group: b, tag: b1 }
          - index: { _id: "d13" }
          - { group: b, tag: b2 }
          - index: { _id: "d14" }
          - { group: b, tag: b2 }
          - index: { _id: "d15" }
          - { group: b, tag: b2 }
          - index: { _id: "d16" }
          - { group: b, tag: b2 }
          - index: { _id: "d17" }
          - { group: b, tag: b3 }
          - index: { _id: "d18" }
          - { group: b, tag: b3 }
          - index: { _id: "d19" }
          - { group: b, tag: b3 }
          - index: { _id: "d20" }
