          - { group: b, tag: c }
          - index: { _id: "d17" }
          - { group: b, tag: c }
          - index: { _id: "d18" }
          - { group: b, tag: c }
          - index: { _id: "d19" }
          - { group: b, tag: c }
          - index: { _id: "d20" }
          - { group: b, tag: c }
          - index: { _id: "d21" }
          - { group: b, tag: c }
          - index: { _id: "d22" }
          - { group: b, tag: m }
          - index: { _id: "d23" }
          - { group: b, tag: m }
          - index: { _id: "d24" }
          - { group: b, tag: m }
          - index: { _id: "d25" }
          - { group: b, tag: m }
          - index: { _id: "d26" }
          - { group: b, tag: m }
          - index: { _id: "d27" }
          - { group: b, tag: m }
          - index: { _id: "d28" }
