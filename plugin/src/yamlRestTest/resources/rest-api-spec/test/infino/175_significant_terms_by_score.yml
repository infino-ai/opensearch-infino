          - index: { _id: "d24" }
          - { group: b, tag: m }
          - index: { _id: "d25" }
          - { group: b, tag: m }
          - index: { _id: "d26" }
          - { group: b, tag: m }
          - index: { _id: "d27" }
          - { group: b, tag: m }
          - index: { _id: "d28" }
          - { group: b, tag: m }
          - index: { _id: "d29" }
          - { group: b, tag: r1 }
