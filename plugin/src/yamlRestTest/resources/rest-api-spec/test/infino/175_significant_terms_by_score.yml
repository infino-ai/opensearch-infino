          - { group: b, tag: m }
          - index: { _id: "d27" }
          - { group: b, tag: m }
          - index: { _id: "d28" }
          - { group: b, tag: m }
          - index: { _id: "d29" }
          - { group: b, tag: r1 }
          - index: { _id: "d30" }
          - { group: b, tag: r1 }
  - match: { errors: false }

  # A query's own foreground, read in one statement of its own.
  - do:
      search:
        index: sbs_luc
        body:
          size: 0
          query: { term: { group: a } }
          aggs:
            sig: { significant_terms: { field: tag, size: 2, shard_size: 2, min_doc_count: 1 } }
  - match: { aggregations.sig.doc_count: 10 }
  - match: { aggregations.sig.bg_count: 31 }
  - length: { aggregations.sig.buckets: 2 }
  - match: { aggregations.sig.buckets.0.key: r2 }
  - match: { aggregations.sig.buckets.0.doc_count: 1 }
  - match: { aggregations.sig.buckets.0.bg_count: 1 }
  - match: { aggregations.sig.buckets.1.key: r1 }
  - match: { aggregations.sig.buckets.1.doc_count: 2 }
  - match: { aggregations.sig.buckets.1.bg_count: 4 }
  - set: { aggregations.sig.buckets.0.score: score_r2 }
  - set: { aggregations.sig.buckets.1.score: score_r1 }

  # Under a terms level both groups' foregrounds are one statement. In b
  # the frequent terms are also the significant ones.
  - do:
      search:
        index: sbs_luc
        body:
          size: 0
          aggs:
            groups:
              terms: { field: group }
              aggs:
                sig: { significant_terms: { field: tag, size: 2, shard_size: 2, min_doc_count: 1 } }
  - length: { aggregations.groups.buckets: 2 }
  - match: { aggregations.groups.buckets.0.key: b }
  - length: { aggregations.groups.buckets.0.sig.buckets: 2 }
  - match: { aggregations.groups.buckets.0.sig.buckets.0.key: c }
  - match: { aggregations.groups.buckets.0.sig.buckets.1.key: m }
  - match: { aggregations.groups.buckets.1.key: a }
  - length: { aggregations.groups.buckets.1.sig.buckets: 2 }
  - match: { aggregations.groups.buckets.1.sig.buckets.0.key: r2 }
  - match: { aggregations.groups.buckets.1.sig.buckets.0.doc_count: 1 }
  - match: { aggregations.groups.buckets.1.sig.buckets.1.key: r1 }
  - match: { aggregations.groups.buckets.1.sig.buckets.1.doc_count: 2 }
  - match: { aggregations.groups.buckets.1.sig.buckets.0.score: $score_r2 }
  - match: { aggregations.groups.buckets.1.sig.buckets.1.score: $score_r1 }

  # min_doc_count is the reduction's: the shard's one slot goes to r2, the
  # best score, which has 1 document and is then dropped. r1 (2 documents)
  # never had the slot, so nothing is returned.
  - do:
      search:
        index: sbs_luc
        body:
          size: 0
          query: { term: { group: a } }
          aggs:
            sig: { significant_terms: { field: tag, size: 1, shard_size: 1, min_doc_count: 2 } }
  - length: { aggregations.sig.buckets: 0 }

  # shard_min_doc_count 2 applies after the cut, as on a stock shard under
  # concurrent segment search: r2 still takes the one slot and is dropped,
  # so again nothing is returned. With two slots r1 is kept.
  - do:
      search:
        index: sbs_luc
        body:
          size: 0
          query: { term: { group: a } }
          aggs:
            sig: { significant_terms: { field: tag, size: 1, shard_size: 1, min_doc_count: 2, shard_min_doc_count: 2 } }
  - length: { aggregations.sig.buckets: 0 }
  - do:
      search:
        index: sbs_luc
        body:
          size: 0
          query: { term: { group: a } }
          aggs:
            sig: { significant_terms: { field: tag, size: 2, shard_size: 2, min_doc_count: 1, shard_min_doc_count: 2 } }
  - length: { aggregations.sig.buckets: 1 }
  - match: { aggregations.sig.buckets.0.key: r1 }

  # A query's own foreground, read in one statement of its own.
