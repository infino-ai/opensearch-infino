---
"What the table cannot tell apart is refused, never answered differently":
  # A run of words beside another clause: stock reads "disk full" as one value on
  # the keyword fields, which the plugin's tree (a clause per word) does not keep.
  - do:
      search: { index: dfs_luc, body: { query: { query_string: { query: "level:error disk full" } } } }
  - match: { hits.total.value: 2 }
  - do:
      catch: bad_request
      search: { index: dfs_prx, body: { query: { query_string: { query: "level:error disk full" } } } }
  - match: { error.root_cause.0.reason: "/.*with.words.that.have.no.operator.between.them.*/" }
  - do:
      catch: bad_request
      search: { index: dfs_def, body: { query: { query_string: { query: "level:error disk full" } } } }
  - match: { error.root_cause.0.reason: "/.*with.words.that.have.no.operator.between.them.*/" }
  # A word on a number field the query names, not lenient: stock fails it too.
  - do:
      catch: bad_request
      search: { index: dfs_luc, body: { query: { multi_match: { query: timeout, fields: [ message, status ] } } } }
  - do:
      catch: bad_request
      search: { index: dfs_luc, body: { query: { query_string: { query: "5*", fields: [ status ] } } } }
  - do:
      catch: bad_request
      search: { index: dfs_prx, body: { query: { multi_match: { query: timeout, fields: [ message, status ] } } } }
  - do:
      catch: bad_request
      search: { index: dfs_prx, body: { query: { query_string: { query: "5*", fields: [ status ] } } } }
  - do:
      catch: bad_request
      search: { index: dfs_def, body: { query: { multi_match: { query: timeout, fields: [ message, status ] } } } }
  - do:
      catch: bad_request
      search: { index: dfs_def, body: { query: { query_string: { query: "5*", fields: [ status ] } } } }
