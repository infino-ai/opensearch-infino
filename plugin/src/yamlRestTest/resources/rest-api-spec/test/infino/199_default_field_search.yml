"A run of words on a named text field ranks by its BM25":
  # message:(timeout lock) is the field's words, scored by their BM25 as stock
  # scores them, on an index with keyword fields too, where the run is kept as
  # one term. Before, every hit scored the same.
  - do:
      search:
        index: dfs_luc
        body: {"query": {"query_string": {"query": "message:(timeout lock)"}}}
  - match: { hits.total.value: 2 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: "3" }
