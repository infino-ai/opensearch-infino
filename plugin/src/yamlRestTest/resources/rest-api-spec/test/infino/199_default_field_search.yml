"Hits that tie at a keyword match's score come in the order they were written":
  # Every message holds disk, so its BM25 stays below 1, and documents 1
  # and 2 hold it as their level too: under the dis_max both score the
  # keyword match's 1. Stock orders the tie as the documents were written,
  # so a page of one is document 1, though document 2 has the higher BM25.
  - do:
      indices.create:
        index: dft_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text }, level: { type: keyword } } }
