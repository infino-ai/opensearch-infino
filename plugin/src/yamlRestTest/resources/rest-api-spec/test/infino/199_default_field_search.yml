"A query naming no field ranks as stock's dis_max does, whether a keyword value matches or not":
  # Stock scores one clause over every field as a dis_max of its fields:
  # the text field's BM25, and a keyword field's match its boost, 1. So a
  # hit scores the better of the two (most_fields, tie_breaker 1: the sum).
  # The text hits keep their BM25 order whether a keyword value matches
  # (disk: documents 2 and 3 hold it in level, 2 in host too) or not (full). Every
  # document is under 16 tokens, so the engine keeps Lucene's lengths and
  # the scores agree.
