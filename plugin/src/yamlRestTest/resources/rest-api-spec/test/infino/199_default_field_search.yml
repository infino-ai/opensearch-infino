"A multi-field the table keeps no column of is left out of every field, and refused where named":
  # title.english (its own analyzer) and title.lower (a normalizer) have no
  # column of their own. A query naming no field reads the fields the table
  # can rather than failing; here their matches are title's own, so the hits
  # and scores are the twin's. A pattern or a name the request gives that
  # reaches one is refused, as a query on the field is.
  - do:
      indices.create:
        index: dfm_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { title: { type: text, fields: { english: { type: text, analyzer: english }, lower: { type: keyword, normalizer: lowercase } } }, level: { type: keyword } } }
  - do:
      indices.create:
        index: dfm_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { title: { type: text, fields: { english: { type: text, analyzer: english }, lower: { type: keyword, normalizer: lowercase } } }, level: { type: keyword } } }
  - do:
      indices.create:
        index: dfm_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { title: { type: text, fields: { english: { type: text, analyzer: english }, lower: { type: keyword, normalizer: lowercase } } }, level: { type: keyword } } }
  - do:
      bulk:
        refresh: true
        index: dfm_luc
        body:
          - index: { _id: "1" }
          - { "title": "disk full", "level": "error" }
          - index: { _id: "2" }
          - { "title": "user login", "level": "disk" }
          - index: { _id: "3" }
          - { "title": "cache miss", "level": "info" }
  - do:
