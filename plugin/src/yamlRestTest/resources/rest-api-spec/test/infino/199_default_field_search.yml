"A date word reads in the query's time_zone on its one default_field, and in UTC over every field":
  # Stock's query string parser reads a word on its one default_field, a
  # date field, as a range in the query's time_zone: 2026-10-25 at +05:30
  # runs from 18:30 UTC the day before (documents 1 and 2). Over every
  # field it reads the word through the date field's term query, in UTC,
  # time_zone or not (documents 2 and 3); so does a quoted word.
  - do:
      indices.create:
        index: dfz_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text }, ts: { type: date } } }
  - do:
      indices.create:
        index: dfz_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text }, ts: { type: date } } }
  - do:
      indices.create:
        index: dfz_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { message: { type: text }, ts: { type: date } } }
  - do:
      bulk:
        refresh: true
        index: dfz_luc
        body:
          - index: { _id: "1" }
          - { "message": "one", "ts": "2026-10-24T20:00:00Z" }
          - index: { _id: "2" }
          - { "message": "two", "ts": "2026-10-25T10:00:00Z" }
          - index: { _id: "3" }
          - { "message": "three", "ts": "2026-10-25T20:00:00Z" }
  - do:
      bulk:
        refresh: true
        index: dfz_prx
        body:
          - index: { _id: "1" }
          - { "message": "one", "ts": "2026-10-24T20:00:00Z" }
          - index: { _id: "2" }
          - { "message": "two", "ts": "2026-10-25T10:00:00Z" }
          - index: { _id: "3" }
          - { "message": "three", "ts": "2026-10-25T20:00:00Z" }
  - do:
