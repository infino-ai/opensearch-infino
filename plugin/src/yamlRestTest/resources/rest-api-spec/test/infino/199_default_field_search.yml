          - index: { _id: "2" }
          - { "message": "two", "ts": "2026-10-25T10:00:00Z" }
          - index: { _id: "3" }
          - { "message": "three", "ts": "2026-10-25T20:00:00Z" }
  - do:
      search:
        index: dfz_luc
        body: { query: { query_string: { query: "2026-10-25", default_field: ts, time_zone: "+05:30" } }, sort: [ { ts: asc } ] }
  - match: { hits.total.value: 2 }
