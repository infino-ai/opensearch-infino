# A query naming no field (a multi_match with no fields, as Dashboards'
# Discover sends a word typed into its search bar, or a query string with no
# fields or default_field) searches the index's default fields
# (index.query.default_field, every field unless set), as stock does: a text
# field by its words, a keyword field by its whole value, a number or date
# field by the value read as its type, skipped where it cannot be read
# (lenient, which a query over every field is unless it says not). A
# wildcard a query string's fields point at a keyword field matches its
# whole value, as host:pay* written in the query does. Each query runs on a
# Lucene twin too, so the counts are stock's. Before, the first matched
# nothing, the second searched the text fields alone, and the wildcard
# matched nothing.
setup:
  - do:
      indices.create:
        index: dfs_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              message: { type: text, fields: { keyword: { type: keyword, ignore_above: 256 } } }
              host: { type: keyword }
              service: { type: keyword }
              level: { type: keyword }
              status: { type: integer }
              "@timestamp": { type: date }
  - do:
      indices.create:
        index: dfs_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              message: { type: text, fields: { keyword: { type: keyword, ignore_above: 256 } } }
              host: { type: keyword }
              service: { type: keyword }
              level: { type: keyword }
              status: { type: integer }
              "@timestamp": { type: date }
  - do:
      indices.create:
        index: dfs_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              message: { type: text, fields: { keyword: { type: keyword, ignore_above: 256 } } }
              host: { type: keyword }
              service: { type: keyword }
              level: { type: keyword }
              status: { type: integer }
              "@timestamp": { type: date }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: dfs_luc
        body:
          - index: { _id: "1" }
          - { "message": "request timeout on upstream", "host": "pay-1", "service": "payments", "level": "error", "status": 504, "@timestamp": "2026-10-24T10:01:00Z" }
          - index: { _id: "2" }
          - { "message": "payment accepted", "host": "pay-2", "service": "payments", "level": "info", "status": 200, "@timestamp": "2026-10-24T10:02:00Z" }
          - index: { _id: "3" }
          - { "message": "timeout waiting for lock", "host": "db-1", "service": "storage", "level": "warn", "status": 500, "@timestamp": "2026-10-24T10:03:00Z" }
          - index: { _id: "4" }
          - { "message": "user login", "host": "web-1", "service": "auth", "level": "info", "status": 200, "@timestamp": "2026-10-24T10:04:00Z" }
          - index: { _id: "5" }
          - { "message": "payments queue drained", "host": "web-2", "service": "checkout", "level": "info", "status": 200, "@timestamp": "2026-10-24T10:05:00Z" }
          - index: { _id: "6" }
          - { "message": "disk full", "host": "db-2", "service": "timeout", "level": "error", "status": 507, "@timestamp": "2026-10-24T10:06:00Z" }
          - index: { _id: "7" }
          - { "message": "cache miss", "host": "payments", "service": "cache", "level": "debug", "status": 404, "@timestamp": "2026-10-24T10:07:00Z" }
