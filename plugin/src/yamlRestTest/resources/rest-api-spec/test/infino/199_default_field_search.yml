"A boost in index.query.default_field weighs the field it names":
  # index.query.default_field [title^2, body] is the field title, weighing
  # 2, and body: a word only the title holds (document 1) is found. The
  # boost is a weighing the plugin's ranking does not make, so the hits are
  # compared in a fixed order here.
  - do:
      indices.create:
        index: dfb_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0, index.query.default_field: [ "title^2", body ] }
          mappings: { properties: { title: { type: text }, body: { type: text }, n: { type: integer } } }
  - do:
      indices.create:
        index: dfb_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0, index.query.default_field: [ "title^2", body ] }
