---
teardown:
  - do:
      indices.delete:
        index: dfs_luc,dfs_prx,dfs_def,dfr_luc,dfr_prx,dfr_def,dfm_luc,dfm_prx,dfm_def,dft_luc,dft_prx,dft_def,dfz_luc,dfz_prx,dfz_def,dfb_luc,dfb_prx,dfb_def,dfn_luc,dfn_prx,dfn_def
        ignore_unavailable: true

