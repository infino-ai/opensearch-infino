---
"_index across a data stream's backing indices, Lucene twin":
  - do:
      indices.put_index_template:
        name: ixfds-luc-template
        body:
          index_patterns: [ "ixfds-luc*" ]
          data_stream: {}
          priority: 200
          template:
            settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
            mappings: { properties: { service: { type: keyword }, user: { type: keyword }, latency_ms: { type: long } } }
  - do:
      bulk:
        refresh: true
        body:
          - create: { _index: ixfds-luc }
          - { "@timestamp": "2026-11-24T00:00:01Z", service: payments, user: u1, latency_ms: 120 }
          - create: { _index: ixfds-luc }
          - { "@timestamp": "2026-11-24T00:00:02Z", service: search, user: u2, latency_ms: 80 }
  - match: { errors: false }
  - do:
      indices.rollover:
        alias: ixfds-luc
  - match: { new_index: ".ds-ixfds-luc-000002" }
  - do:
      bulk:
        refresh: true
        body:
          - create: { _index: ixfds-luc }
          - { "@timestamp": "2026-11-24T00:00:03Z", service: payments, user: u1, latency_ms: 300 }
          - create: { _index: ixfds-luc }
          - { "@timestamp": "2026-11-24T00:00:04Z", service: payments, user: u3, latency_ms: 150 }
          - create: { _index: ixfds-luc }
          - { "@timestamp": "2026-11-24T00:00:05Z", service: search, user: u3, latency_ms: 20 }
  - match: { errors: false }

  # Each backing index answers with its own name, and the counts add up.
  - do:
      search:
        index: ixfds-luc
        body:
          size: 0
          aggregations:
            "COUNT(*)": { value_count: { field: _index } }
            by_index: { terms: { field: _index, order: { _key: asc } } }
            indices: { cardinality: { field: _index } }
            each:
              filters:
                filters:
                  first: { term: { _index: ".ds-ixfds-luc-000001" } }
                  stream: { term: { _index: ixfds-luc } }
                  pattern: { wildcard: { _index: ".ds-ixfds-luc-*2" } }
                  hidden: { wildcard: { _index: "*-000002" } }
  - match: { hits.total.value: 5 }
  - match: { aggregations.COUNT(*).value: 5 }
  - length: { aggregations.by_index.buckets: 2 }
  - match: { aggregations.by_index.buckets.0.key: ".ds-ixfds-luc-000001" }
  - match: { aggregations.by_index.buckets.0.doc_count: 2 }
  - match: { aggregations.by_index.buckets.1.key: ".ds-ixfds-luc-000002" }
  - match: { aggregations.by_index.buckets.1.doc_count: 3 }
  - match: { aggregations.indices.value: 2 }
  - match: { aggregations.each.buckets.first.doc_count: 2 }
  - match: { aggregations.each.buckets.stream.doc_count: 5 }
  - match: { aggregations.each.buckets.pattern.doc_count: 3 }
  # A pattern expands to visible indices only, unless it starts with a dot: the backing indices are hidden.
  - match: { aggregations.each.buckets.hidden.doc_count: 0 }

  # A cardinality counts the indices with hits only, and one under an _index
  # bucket counts that index's values alone.
  - do:
      search:
        index: ixfds-luc
        body:
          size: 0
          query: { range: { latency_ms: { gte: 150 } } }
          aggregations:
            indices: { cardinality: { field: _index } }
            by_index: { terms: { field: _index, order: { _key: asc } }, aggregations: { users: { cardinality: { field: user } } } }
  - match: { hits.total.value: 2 }
  - match: { aggregations.indices.value: 1 }
  - length: { aggregations.by_index.buckets: 1 }
  - match: { aggregations.by_index.buckets.0.key: ".ds-ixfds-luc-000002" }
  - match: { aggregations.by_index.buckets.0.users.value: 2 }
  - do:
      search:
        index: ixfds-luc
        body:
          size: 0
          aggregations:
            by_index: { terms: { field: _index, order: { _key: asc } }, aggregations: { users: { cardinality: { field: user } } } }
            users: { cardinality: { field: user } }
  - match: { aggregations.by_index.buckets.0.users.value: 2 }
  - match: { aggregations.by_index.buckets.1.users.value: 2 }
  - match: { aggregations.users.value: 3 }

  # The SQL plugin's GROUP BY over the stream.
  - do:
      search:
        index: ixfds-luc
        body:
          size: 0
          aggregations:
            composite_buckets:
              composite:
                size: 1000
                sources: [ { service: { terms: { field: service, missing_bucket: true, missing_order: first, order: asc } } } ]
              aggregations: { "COUNT(*)": { value_count: { field: _index } } }
  - match: { aggregations.composite_buckets.buckets.0.key.service: payments }
  - match: { aggregations.composite_buckets.buckets.0.COUNT(*).value: 3 }
  - match: { aggregations.composite_buckets.buckets.1.key.service: search }
  - match: { aggregations.composite_buckets.buckets.1.COUNT(*).value: 2 }

  # Queries naming a backing index, the data stream, or a pattern.
  - do:
      count: { index: ixfds-luc, body: { query: { term: { _index: ".ds-ixfds-luc-000002" } } } }
  - match: { count: 3 }
  - do:
      count: { index: ixfds-luc, body: { query: { term: { _index: ixfds-luc } } } }
  - match: { count: 5 }
  - do:
      count: { index: ixfds-luc, body: { query: { bool: { must_not: [ { terms: { _index: [ ".ds-ixfds-luc-000001" ] } } ], filter: [ { term: { service: payments } } ] } } } }
  - match: { count: 2 }
---
"_index across a data stream's backing indices, default mode":
  - do:
      indices.put_index_template:
        name: ixfds-def-template
        body:
          index_patterns: [ "ixfds-def*" ]
          data_stream: {}
          priority: 200
          template:
            settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
            mappings: { properties: { service: { type: keyword }, user: { type: keyword }, latency_ms: { type: long } } }
