# The _index metadata field holds the name of the index a document is in,
# one value for every document of an index. Queries and aggregations on it
# answer as on a Lucene twin, in default and proxy mode: a term, terms,
# prefix, wildcard, match_phrase or query_string matches every document of
# the index or none; value_count counts every document (what the SQL
# plugin's COUNT(*) sends); a terms aggregation keys one bucket per index; a
# cardinality counts the indices with hits; a filters bucket on it is per
# index. Across a data stream's backing indices each index answers with its
# own name, and a term naming the data stream matches all of them. A query
# or aggregation on the field that cannot be answered so is refused.
---
"_index in one index, Lucene twin":
  - do:
      indices.create:
        index: ixf_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { service: { type: keyword }, latency_ms: { type: long }, msg: { type: text } } }
  - do:
      bulk:
        refresh: true
        index: ixf_luc
        body:
          - index: { _id: "1" }
          - { service: payments, latency_ms: 120, msg: slow call }
          - index: { _id: "2" }
          - { service: payments, latency_ms: 80, msg: fast call }
          - index: { _id: "3" }
          - { service: payments, latency_ms: 300, msg: slow call }
          - index: { _id: "4" }
          - { service: search, latency_ms: 150, msg: slow query }
          - index: { _id: "5" }
          - { service: search, latency_ms: 20, msg: fast query }
  - match: { errors: false }

  # What the SQL plugin sends for SELECT COUNT(*) FROM ixf_luc WHERE service='payments' AND latency_ms>100.
  - do:
      search:
        index: ixf_luc
        body:
          size: 0
          query: { bool: { filter: [ { term: { service: payments } }, { range: { latency_ms: { gt: 100 } } } ] } }
          aggregations: { "COUNT(*)": { value_count: { field: _index } } }
  - match: { aggregations.COUNT(*).value: 2 }

  # ... and for SELECT service, COUNT(*) FROM ixf_luc GROUP BY service.
  - do:
      search:
        index: ixf_luc
        body:
          size: 0
          aggregations:
            composite_buckets:
              composite:
                size: 1000
                sources: [ { service: { terms: { field: service, missing_bucket: true, missing_order: first, order: asc } } } ]
              aggregations: { "COUNT(*)": { value_count: { field: _index } } }
  - length: { aggregations.composite_buckets.buckets: 2 }
  - match: { aggregations.composite_buckets.buckets.0.key.service: payments }
  - match: { aggregations.composite_buckets.buckets.0.COUNT(*).value: 3 }
  - match: { aggregations.composite_buckets.buckets.1.key.service: search }
  - match: { aggregations.composite_buckets.buckets.1.COUNT(*).value: 2 }

  # A terms bucket for the index, a cardinality of 1, and filters on it.
  - do:
      search:
        index: ixf_luc
        body:
          size: 0
          aggregations:
            by_index: { terms: { field: _index }, aggregations: { slow: { filter: { range: { latency_ms: { gt: 100 } } } } } }
            indices: { cardinality: { field: _index } }
            each:
              filters:
                filters:
                  own: { term: { _index: ixf_luc } }
                  other: { term: { _index: ixf_none } }
  - length: { aggregations.by_index.buckets: 1 }
  - match: { aggregations.by_index.buckets.0.key: ixf_luc }
  - match: { aggregations.by_index.buckets.0.doc_count: 5 }
  - match: { aggregations.by_index.buckets.0.slow.doc_count: 3 }
  - match: { aggregations.indices.value: 1 }
  - match: { aggregations.each.buckets.own.doc_count: 5 }
  - match: { aggregations.each.buckets.other.doc_count: 0 }

  # A composite source on it keys the index.
  - do:
      search:
        index: ixf_luc
        body:
          size: 0
          aggregations:
            c: { composite: { sources: [ { idx: { terms: { field: _index } } }, { s: { terms: { field: service } } } ] } }
  - length: { aggregations.c.buckets: 2 }
  - match: { aggregations.c.buckets.0.key.idx: ixf_luc }
  - match: { aggregations.c.buckets.0.key.s: payments }
  - match: { aggregations.c.buckets.0.doc_count: 3 }

  # Queries: every document of the index or none.
  - do:
      count: { index: ixf_luc, body: { query: { term: { _index: ixf_luc } } } }
  - match: { count: 5 }
  - do:
      count: { index: ixf_luc, body: { query: { term: { _index: ixf_none } } } }
  - match: { count: 0 }
  - do:
      count: { index: ixf_luc, body: { query: { term: { _index: { value: IXF_LUC, case_insensitive: true } } } } }
  - match: { count: 5 }
  - do:
      count: { index: ixf_luc, body: { query: { terms: { _index: [ ixf_none, ixf_luc ] } } } }
  - match: { count: 5 }
  - do:
      count: { index: ixf_luc, body: { query: { prefix: { _index: ixf_ } } } }
  - match: { count: 5 }
  - do:
      count: { index: ixf_luc, body: { query: { wildcard: { _index: "*_luc" } } } }
  - match: { count: 5 }
  - do:
      count: { index: ixf_luc, body: { query: { wildcard: { _index: "*_none" } } } }
  - match: { count: 0 }
  - do:
      count: { index: ixf_luc, body: { query: { bool: { filter: [ { match_phrase: { _index: ixf_luc } }, { term: { service: search } } ] } } } }
  - match: { count: 2 }
  - do:
      count: { index: ixf_luc, body: { query: { bool: { must_not: [ { term: { _index: ixf_luc } } ] } } } }
  - match: { count: 0 }
  - do:
      count: { index: ixf_luc, body: { query: { query_string: { query: "_index:ixf_luc AND service:payments" } } } }
  - match: { count: 3 }
  - do:
      count: { index: ixf_luc, body: { query: { query_string: { query: "_index:ixf_* AND msg:slow" } } } }
  - match: { count: 3 }

  # A range on it is an error, as on the twin.
  - do:
      catch: bad_request
      search: { index: ixf_luc, body: { query: { range: { _index: { gte: a } } } } }
