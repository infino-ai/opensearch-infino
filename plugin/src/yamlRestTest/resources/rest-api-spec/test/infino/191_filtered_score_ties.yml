# On a scored page with a filter or a must_not, hits with equal scores come
# in the order they were written, as a Lucene twin orders them by their place
# in the index, in proxy and in default mode. Every document holds disk in
# message once, or fan, and disk in title, so every hit of a query on disk
# scores the same. Each test is one shape of scored statement a filter or a
# must_not can produce. The ids are not in the order they were written, so
# a page in id order fails them. A Lucene twin orders its ties by segment,
# which is the order they were written only until its segments merge; no
# test here merges them.
setup:
  - do:
      indices.create:
        index: ft_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { message: { type: text }, title: { type: text }, grp: { type: keyword } } }
  - do:
      indices.create:
        index: ft_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { message: { type: text }, title: { type: text }, grp: { type: keyword } } }
  - do:
      indices.create:
        index: ft_default
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { message: { type: text }, title: { type: text }, grp: { type: keyword } } }
  - do:
      bulk:
        refresh: true
        index: ft_luc
        body:
          - index: { _id: "t07" }
          - {"message": "disk", "title": "disk", "grp": "g0"}
          - index: { _id: "t02" }
          - {"message": "disk", "title": "disk", "grp": "g1"}
          - index: { _id: "t10" }
          - {"message": "disk", "title": "disk", "grp": "g0"}
          - index: { _id: "t04" }
          - {"message": "fan", "title": "disk", "grp": "g0"}
          - index: { _id: "t01" }
          - {"message": "disk", "title": "disk", "grp": "g0"}
          - index: { _id: "t09" }
          - {"message": "disk", "title": "disk", "grp": "g1"}
          - index: { _id: "t05" }
          - {"message": "disk", "title": "disk", "grp": "g0"}
          - index: { _id: "t08" }
          - {"message": "fan", "title": "disk", "grp": "g1"}
          - index: { _id: "t03" }
          - {"message": "disk", "title": "disk", "grp": "g0"}
          - index: { _id: "t06" }
