---
"A search option the table cannot serve is refused, naming it":
  - do:
      catch: bad_request
      search: { index: lit_prx, body: { query: { match: { m: { query: dsk, fuzziness: AUTO } } } } }
  - match: { error.root_cause.0.reason: "/.*match.on..m..asks.for.fuzziness..AUTO..*/" }
  - do:
      catch: bad_request
      search: { index: lit_def, body: { query: { match: { m: { query: dsk, fuzziness: AUTO } } } } }
  - match: { error.root_cause.0.reason: "/.*match.on..m..asks.for.fuzziness..AUTO..*/" }
  - do:
      catch: bad_request
      search: { index: lit_prx, body: { query: { multi_match: { query: dsk, fields: [ m ], fuzziness: 1 } } } }
  - match: { error.root_cause.0.reason: "/.*multi_match.on..m..asks.for.fuzziness..1..*/" }
  - do:
      catch: bad_request
      search: { index: lit_def, body: { query: { multi_match: { query: dsk, fields: [ m ], fuzziness: 1 } } } }
  - match: { error.root_cause.0.reason: "/.*multi_match.on..m..asks.for.fuzziness..1..*/" }
  - do:
      catch: bad_request
      search: { index: lit_prx, body: { query: { match: { m: disk } }, min_score: 0.5 } }
  - match: { error.root_cause.0.reason: "/.*min_score.is.not.served.*/" }
  - do:
      catch: bad_request
      search: { index: lit_def, body: { query: { match: { m: disk } }, min_score: 0.5 } }
  - match: { error.root_cause.0.reason: "/.*min_score.is.not.served.*/" }
  - do:
      catch: bad_request
      search: { index: lit_prx, body: { query: { match: { m: disk } }, rescore: [ { window_size: 10, query: { rescore_query: { match: { m: fan } } } } ] } }
  - match: { error.root_cause.0.reason: "/.*rescore.is.not.served.*/" }
  - do:
      catch: bad_request
      search: { index: lit_def, body: { query: { match: { m: disk } }, rescore: [ { window_size: 10, query: { rescore_query: { match: { m: fan } } } } ] } }
  - match: { error.root_cause.0.reason: "/.*rescore.is.not.served.*/" }

---
"A fuzziness of 0, or a min_score of 0, asks for nothing and is served":
  - do:
      search: { index: lit_luc, body: { query: { match: { m: { query: disk, fuzziness: 0 } } } } }
  - match: { hits.total.value: 2 }
  - do:
      search: { index: lit_luc, body: { query: { match: { m: disk } }, min_score: 0 } }
  - match: { hits.total.value: 2 }
  - do:
      search: { index: lit_prx, body: { query: { match: { m: { query: disk, fuzziness: 0 } } } } }
  - match: { hits.total.value: 2 }
  - do:
      search: { index: lit_prx, body: { query: { match: { m: disk } }, min_score: 0 } }
  - match: { hits.total.value: 2 }
  - do:
      search: { index: lit_def, body: { query: { match: { m: { query: disk, fuzziness: 0 } } } } }
  - match: { hits.total.value: 2 }
  - do:
      search: { index: lit_def, body: { query: { match: { m: disk } }, min_score: 0 } }
  - match: { hits.total.value: 2 }

---
"terminate_after over no more documents than it names is the full answer":
  # A dashboard list control: a terms aggregation and no hits, over every document.
  - do:
      search: { index: lit_luc, body: { size: 0, terminate_after: 100000, aggs: { v: { terms: { field: d } } } } }
  - match: { terminated_early: false }
  - match: { hits.total.value: 3 }
  - length: { aggregations.v.buckets: 3 }
  - match: { aggregations.v.buckets.0.key: 0.3 }
  - match: { aggregations.v.buckets.0.doc_count: 1 }
  - match: { aggregations.v.buckets.2.key: 2.7 }
  - do:
      search: { index: lit_prx, body: { size: 0, terminate_after: 100000, aggs: { v: { terms: { field: d } } } } }
  - match: { terminated_early: false }
  - match: { hits.total.value: 3 }
  - length: { aggregations.v.buckets: 3 }
  - match: { aggregations.v.buckets.0.key: 0.3 }
  - match: { aggregations.v.buckets.0.doc_count: 1 }
  - match: { aggregations.v.buckets.2.key: 2.7 }
  - do:
      search: { index: lit_def, body: { size: 0, terminate_after: 100000, aggs: { v: { terms: { field: d } } } } }
  - match: { terminated_early: false }
  - match: { hits.total.value: 3 }
  - length: { aggregations.v.buckets: 3 }
  - match: { aggregations.v.buckets.0.key: 0.3 }
  - match: { aggregations.v.buckets.0.doc_count: 1 }
  - match: { aggregations.v.buckets.2.key: 2.7 }

  # Hits, while the query keeps no more documents than terminate_after.
  - do:
      search: { index: lit_luc, body: { query: { match: { m: disk } }, terminate_after: 2, sort: [ { d: asc } ] } }
  - match: { terminated_early: false }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "3" }
  - do:
      search: { index: lit_prx, body: { query: { match: { m: disk } }, terminate_after: 2, sort: [ { d: asc } ] } }
  - match: { terminated_early: false }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "3" }
  - do:
      search: { index: lit_def, body: { query: { match: { m: disk } }, terminate_after: 2, sort: [ { d: asc } ] } }
  - match: { terminated_early: false }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "3" }

---
"A count of every document with terminate_after is the full count":
  - do:
      count: { index: lit_luc, terminate_after: 1 }
  - match: { count: 3 }
  - match: { terminated_early: true }
  - do:
      count: { index: lit_prx, terminate_after: 1 }
  - match: { count: 3 }
  - match: { terminated_early: true }
  - do:
      count: { index: lit_def, terminate_after: 1 }
  - match: { count: 3 }
  - match: { terminated_early: true }

  - do:
      count: { index: lit_luc, terminate_after: 3 }
  - match: { count: 3 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_prx, terminate_after: 3 }
  - match: { count: 3 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_def, terminate_after: 3 }
  - match: { count: 3 }
  - match: { terminated_early: false }

  - do:
      count: { index: lit_luc, terminate_after: 100000 }
  - match: { count: 3 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_prx, terminate_after: 100000 }
  - match: { count: 3 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_def, terminate_after: 100000 }
  - match: { count: 3 }
  - match: { terminated_early: false }

  # An existence check: a query counted past the limit is its full count.
  - do:
      count: { index: lit_luc, terminate_after: 1, body: { query: { match: { m: fan } } } }
  - match: { count: 2 }
  - match: { terminated_early: true }
  - do:
      count: { index: lit_prx, terminate_after: 1, body: { query: { match: { m: fan } } } }
  - match: { count: 2 }
  - match: { terminated_early: true }
  - do:
      count: { index: lit_def, terminate_after: 1, body: { query: { match: { m: fan } } } }
  - match: { count: 2 }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_prx, body: { query: { match: { m: fan } }, size: 0, terminate_after: 1 } }
  - match: { hits.total.value: 2 }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_def, body: { query: { match: { m: fan } }, size: 0, terminate_after: 1 } }
  - match: { hits.total.value: 2 }
  - match: { terminated_early: true }

  # A search that asks for no hits and no aggregations is a count too.
  - do:
      search: { index: lit_luc, body: { size: 0, terminate_after: 1, track_total_hits: true } }
  - match: { hits.total.value: 3 }
  - match: { hits.total.relation: eq }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_prx, body: { size: 0, terminate_after: 1, track_total_hits: true } }
  - match: { hits.total.value: 3 }
  - match: { hits.total.relation: eq }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_def, body: { size: 0, terminate_after: 1, track_total_hits: true } }
  - match: { hits.total.value: 3 }
  - match: { hits.total.relation: eq }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_luc, body: { size: 0, terminate_after: 1 } }
  - match: { hits.total.value: 3 }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_prx, body: { size: 0, terminate_after: 1 } }
  - match: { hits.total.value: 3 }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_def, body: { size: 0, terminate_after: 1 } }
  - match: { hits.total.value: 3 }
  - match: { terminated_early: true }
  # The track_total_hits limit caps the count as it does any other.
  - do:
      search: { index: lit_luc, body: { size: 0, terminate_after: 1, track_total_hits: 2 } }
  - match: { hits.total.value: 2 }
  - match: { hits.total.relation: gte }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_prx, body: { size: 0, terminate_after: 1, track_total_hits: 2 } }
  - match: { hits.total.value: 2 }
  - match: { hits.total.relation: gte }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_def, body: { size: 0, terminate_after: 1, track_total_hits: 2 } }
  - match: { hits.total.value: 2 }
  - match: { hits.total.relation: gte }
  - match: { terminated_early: true }
  - do:
      search: { index: lit_luc, body: { size: 0, terminate_after: 1, track_total_hits: false } }
  - is_false: hits.total
  - match: { terminated_early: true }
  - do:
      search: { index: lit_prx, body: { size: 0, terminate_after: 1, track_total_hits: false } }
  - is_false: hits.total
  - match: { terminated_early: true }
  - do:
      search: { index: lit_def, body: { size: 0, terminate_after: 1, track_total_hits: false } }
  - is_false: hits.total
  - match: { terminated_early: true }

  # An index with no documents.
  - do:
      indices.create: { index: lit_luc0, body: { settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }, mappings: { properties: { m: { type: text } } } } }
  - do:
      indices.create: { index: lit_prx0, body: { settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }, mappings: { properties: { m: { type: text } } } } }
  - do:
      indices.create: { index: lit_def0, body: { settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }, mappings: { properties: { m: { type: text } } } } }
  - do:
      count: { index: lit_luc0, terminate_after: 1 }
  - match: { count: 0 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_prx0, terminate_after: 1 }
  - match: { count: 0 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_def0, terminate_after: 1 }
  - match: { count: 0 }
  - match: { terminated_early: false }

---
"A count of every document with terminate_after over several shards stops early when a shard holds more":
  - do:
      indices.create: { index: lit_luc2, body: { settings: { index.infino.enabled: false, number_of_shards: 2, number_of_replicas: 0 }, mappings: { properties: { m: { type: text } } } } }
  - do:
      indices.create: { index: lit_prx2, body: { settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 2, number_of_replicas: 0 }, mappings: { properties: { m: { type: text } } } } }
  - do:
      indices.create: { index: lit_def2, body: { settings: { index.infino.enabled: true, number_of_shards: 2, number_of_replicas: 0 }, mappings: { properties: { m: { type: text } } } } }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: lit_luc2, _id: "1" }
          - { "m": "disk" }
          - index: { _index: lit_luc2, _id: "2" }
          - { "m": "fan" }
          - index: { _index: lit_luc2, _id: "3" }
          - { "m": "disk fan" }
          - index: { _index: lit_luc2, _id: "4" }
          - { "m": "fan" }
          - index: { _index: lit_prx2, _id: "1" }
          - { "m": "disk" }
          - index: { _index: lit_prx2, _id: "2" }
          - { "m": "fan" }
          - index: { _index: lit_prx2, _id: "3" }
          - { "m": "disk fan" }
          - index: { _index: lit_prx2, _id: "4" }
          - { "m": "fan" }
          - index: { _index: lit_def2, _id: "1" }
          - { "m": "disk" }
          - index: { _index: lit_def2, _id: "2" }
          - { "m": "fan" }
          - index: { _index: lit_def2, _id: "3" }
          - { "m": "disk fan" }
          - index: { _index: lit_def2, _id: "4" }
          - { "m": "fan" }
  # Four documents over two shards: one shard holds two or more.
  - do:
      count: { index: lit_luc2, terminate_after: 1 }
  - match: { count: 4 }
  - match: { terminated_early: true }
  - do:
      count: { index: lit_prx2, terminate_after: 1 }
  - match: { count: 4 }
  - match: { terminated_early: true }
  - do:
      count: { index: lit_def2, terminate_after: 1 }
  - match: { count: 4 }
  - match: { terminated_early: true }
  # Whether a shard holds more than three hangs on how the documents are routed:
  # a default-mode shard holds the documents a stock shard does; a proxy-mode
  # index's table holds every shard's, so it cannot tell, and says it did not
  # stop early.
  - do:
      count: { index: lit_luc2, terminate_after: 3 }
  - match: { count: 4 }
  - set: { terminated_early: early }
  - do:
      count: { index: lit_def2, terminate_after: 3 }
  - match: { count: 4 }
  - match: { terminated_early: $early }
  - do:
      count: { index: lit_prx2, terminate_after: 3 }
  - match: { count: 4 }
  - match: { terminated_early: false }
  # Within the limit, every shard counts all it holds.
  - do:
      count: { index: lit_luc2, terminate_after: 4 }
  - match: { count: 4 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_prx2, terminate_after: 4 }
  - match: { count: 4 }
  - match: { terminated_early: false }
  - do:
      count: { index: lit_def2, terminate_after: 4 }
  - match: { count: 4 }
  - match: { terminated_early: false }

---
"terminate_after over more documents than it names refuses hits and serves the full count and aggregations":
  # Stock stops each shard at whichever documents it collected first.
  - do:
      search: { index: lit_luc, body: { query: { match_all: {} }, terminate_after: 1 } }
  - match: { terminated_early: true }
  - match: { hits.total.value: 1 }
  - length: { hits.hits: 1 }
  - do:
      catch: bad_request
      search: { index: lit_prx, body: { query: { match_all: {} }, terminate_after: 1 } }
  - match: { error.root_cause.0.reason: "/.*terminate_after.is.not.served.by.the.table.when.more.than..1..documents.match.*/" }
  - do:
      catch: bad_request
      search: { index: lit_def, body: { query: { match_all: {} }, terminate_after: 1 } }
  - match: { error.root_cause.0.reason: "/.*terminate_after.is.not.served.by.the.table.when.more.than..1..documents.match.*/" }

  # Stock's aggregations see only the documents collected before the shard
  # stopped; the table's see every match, a dashboard list control's or value
  # suggestions' full set of buckets.
  - do:
      search: { index: lit_luc, body: { size: 0, terminate_after: 1, aggs: { v: { terms: { field: d } } } } }
  - match: { terminated_early: true }
  - match: { hits.total.value: 3 }
  - do:
      search: { index: lit_prx, body: { size: 0, terminate_after: 1, aggs: { v: { terms: { field: d } } } } }
  - match: { terminated_early: true }
  - match: { hits.total.value: 3 }
  - length: { aggregations.v.buckets: 3 }
  - match: { aggregations.v.buckets.0.key: 0.3 }
  - match: { aggregations.v.buckets.2.key: 2.7 }
  - do:
      search: { index: lit_def, body: { size: 0, terminate_after: 1, aggs: { v: { terms: { field: d } } } } }
  - match: { terminated_early: true }
  - match: { hits.total.value: 3 }
  - length: { aggregations.v.buckets: 3 }
  - match: { aggregations.v.buckets.0.key: 0.3 }
  - match: { aggregations.v.buckets.2.key: 2.7 }
  - do:
      search: { index: lit_prx, body: { query: { match: { m: fan } }, size: 0, terminate_after: 1, aggs: { v: { terms: { field: d } } } } }
  - match: { hits.total.value: 2 }
  - length: { aggregations.v.buckets: 2 }
  - match: { aggregations.v.buckets.0.key: 1.5 }
  - match: { aggregations.v.buckets.1.key: 2.7 }
  - do:
      search: { index: lit_def, body: { query: { match: { m: fan } }, size: 0, terminate_after: 1, aggs: { v: { terms: { field: d } } } } }
  - match: { hits.total.value: 2 }
  - length: { aggregations.v.buckets: 2 }
  - match: { aggregations.v.buckets.0.key: 1.5 }
  - match: { aggregations.v.buckets.1.key: 2.7 }

  # A scroll's rounds are read from a cursor, not collected toward the limit.
  - do:
      catch: bad_request
      search: { index: lit_prx, scroll: 1m, body: { query: { match: { m: disk } }, terminate_after: 5 } }
  - match: { error.root_cause.0.reason: "/.*terminate_after.is.not.served.with.a.scroll.*/" }
  - do:
      catch: bad_request
      search: { index: lit_def, scroll: 1m, body: { query: { match: { m: disk } }, terminate_after: 5 } }
  - match: { error.root_cause.0.reason: "/.*terminate_after.is.not.served.with.a.scroll.*/" }
