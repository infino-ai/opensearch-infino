# A float, half_float or scaled_float field keeps each value rounded to its
# precision, and a term, terms, match or range literal on it is rounded the
# same way, as stock reads it: 0.3 on a float field is the float nearest 0.3.
# A CIDR block in a term or terms on an ip field is the addresses it covers.
# A search option the table cannot serve (fuzzy matching, min_score,
# rescore) is refused, naming it, rather than ignored. terminate_after is
# served while no more documents match than it names, as no stock shard stops
# early then; past it, a request for no hits (a count, aggregations or both) is
# served with the full answer, of which stock's is some subset, and a request
# for hits, which stock answers from whichever documents a shard collected
# first, is refused. Each literal query runs on a Lucene twin too, so the
# counts are stock's.
setup:
  - do:
      indices.create:
        index: lit_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            dynamic: strict
            properties:
              f: { type: float }
              h: { type: half_float }
              s: { type: scaled_float, scaling_factor: 100 }
              d: { type: double }
              a: { type: ip }
              m: { type: text }
  - do:
      indices.create:
        index: lit_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            dynamic: strict
            properties:
              f: { type: float }
              h: { type: half_float }
              s: { type: scaled_float, scaling_factor: 100 }
              d: { type: double }
              a: { type: ip }
              m: { type: text }
  - do:
      indices.create:
        index: lit_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            dynamic: strict
            properties:
              f: { type: float }
              h: { type: half_float }
              s: { type: scaled_float, scaling_factor: 100 }
              d: { type: double }
              a: { type: ip }
              m: { type: text }
  - do:
      bulk:
        refresh: true
        index: lit_luc
        body:
          - index: { _id: "1" }
          - { "f": 0.3, "h": 0.3, "s": 1.234, "d": 0.3, "a": "10.0.0.1", "m": "disk" }
          - index: { _id: "2" }
          - { "f": 1.5, "h": 1.5, "s": 1.5, "d": 1.5, "a": "192.168.1.9", "m": "fan" }
          - index: { _id: "3" }
          - { "f": 2.7, "h": 2.7, "s": 2.7, "d": 2.7, "a": "2001:db8::1", "m": "disk fan" }
  - do:
      bulk:
        refresh: true
        index: lit_prx
        body:
          - index: { _id: "1" }
          - { "f": 0.3, "h": 0.3, "s": 1.234, "d": 0.3, "a": "10.0.0.1", "m": "disk" }
          - index: { _id: "2" }
          - { "f": 1.5, "h": 1.5, "s": 1.5, "d": 1.5, "a": "192.168.1.9", "m": "fan" }
          - index: { _id: "3" }
          - { "f": 2.7, "h": 2.7, "s": 2.7, "d": 2.7, "a": "2001:db8::1", "m": "disk fan" }
  - do:
      bulk:
        refresh: true
        index: lit_def
        body:
          - index: { _id: "1" }
          - { "f": 0.3, "h": 0.3, "s": 1.234, "d": 0.3, "a": "10.0.0.1", "m": "disk" }
          - index: { _id: "2" }
          - { "f": 1.5, "h": 1.5, "s": 1.5, "d": 1.5, "a": "192.168.1.9", "m": "fan" }
          - index: { _id: "3" }
          - { "f": 2.7, "h": 2.7, "s": 2.7, "d": 2.7, "a": "2001:db8::1", "m": "disk fan" }

---
teardown:
  - do:
      indices.delete:
        index: lit_luc,lit_prx,lit_def,lit_luc0,lit_prx0,lit_def0,lit_luc2,lit_prx2,lit_def2
        ignore_unavailable: true

---
