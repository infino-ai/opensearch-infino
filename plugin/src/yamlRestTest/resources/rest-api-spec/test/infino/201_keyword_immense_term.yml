# A keyword value whose UTF-8 encoding is longer than the 32,766 bytes one
# Lucene term holds (issue #295), on a Lucene index, in proxy mode and in
# default mode. Stock refuses the document with Lucene's own reason, an
# illegal_argument_exception, at write time: alone, in an array, in a
# keyword with doc values only, through a keyword multi-field (a text
# field's .keyword), in a bulk item and in an update's merged document. A field whose ignore_above leaves the value out
# (as the .keyword dynamic mapping adds does) keeps it in _source only, and
# the document is stored. Nothing is acknowledged and then lost: each index
# ends with the same documents.

---
"A keyword value past one term is refused as stock refuses it, and kept in _source past ignore_above":
  - do:
      indices.create:
        index: kt_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              w: { type: keyword }
              v: { type: keyword, index: false }
              k: { type: keyword, ignore_above: 256 }
              t: { type: text, fields: { keyword: { type: keyword } } }
              d: { type: text, fields: { keyword: { type: keyword, ignore_above: 256 } } }
  - do:
      indices.create:
        index: kt_px
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              w: { type: keyword }
              v: { type: keyword, index: false }
              k: { type: keyword, ignore_above: 256 }
              t: { type: text, fields: { keyword: { type: keyword } } }
              d: { type: text, fields: { keyword: { type: keyword, ignore_above: 256 } } }
  - do:
      indices.create:
        index: kt_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              w: { type: keyword }
              v: { type: keyword, index: false }
              k: { type: keyword, ignore_above: 256 }
              t: { type: text, fields: { keyword: { type: keyword } } }
              d: { type: text, fields: { keyword: { type: keyword, ignore_above: 256 } } }
  # The value: 32,767 bytes, one past a term. A field that ignores it above 256 keeps it in _source.
  - do: { index: { index: kt_luc, id: k1, refresh: true, body: { w: a, k: "" } } }
  - match: { result: created }
  - do: { get: { index: kt_luc, id: k1 } }
  - set: { _source.k: big }
  # Stock's reasons, which the Infino indices must give word for word. (A regex here
  # ignores white space, so . stands for each space.)
  - do:
      catch: bad_request
      index: { index: kt_luc, id: w1, body: { w: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: '/^Document.contains.at.least.one.immense.term.in.field="w".*got.32767$/' }
  - set: { error.reason: reason_w }
  - do:
      catch: bad_request
      index: { index: kt_luc, id: t1, body: { t: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: '/^Document.contains.at.least.one.immense.term.in.field="t[.]keyword".*got.32767$/' }
  - set: { error.reason: reason_t }
  - do:
      catch: bad_request
      index: { index: kt_luc, id: v1, body: { v: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: 'DocValuesField "v" is too large, must be <= 32766' }
  # kt_luc
  - do:
      catch: bad_request
      index: { index: kt_luc, id: a1, body: { w: [ b, $big ] } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  - do: { index: { index: kt_luc, id: d1, body: { w: c, d: $big } } }
  - match: { result: created }
  - do: { bulk: { index: kt_luc, body: [ {"index": {"_id": "b1"}}, {"w": $big}, {"index": {"_id": "b2"}}, {"w": "e"} ] } }
  - match: { errors: true }
  - match: { items.0.index.status: 400 }
  - match: { items.0.index.error.type: illegal_argument_exception }
  - match: { items.0.index.error.reason: $reason_w }
  - match: { items.1.index.status: 201 }
  - do: { index: { index: kt_luc, id: u1, body: { w: f } } }
  - do:
      catch: bad_request
      update: { index: kt_luc, id: u1, body: { doc: { w: $big } } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  # A field dynamic mapping adds is text with a .keyword ignored above 256: stored.
  - do: { index: { index: kt_luc, id: n1, body: { w: g, fresh: $big } } }
  - match: { result: created }
  - do: { indices.refresh: { index: kt_luc } }
  # What was acknowledged is there; what was refused is not.
  - do: { count: { index: kt_luc } }
  - match: { count: 5 }
  - do: { search: { index: kt_luc, body: { size: 10, sort: [ { w: asc } ] } } }
  - match: { hits.total.value: 5 }
  - match: { hits.hits.0._id: k1 }
  - match: { hits.hits.0._source.k: $big }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.1._source.d: $big }
  - match: { hits.hits.2._id: b2 }
  - match: { hits.hits.3._id: u1 }
  - match: { hits.hits.3._source.w: f }
  - match: { hits.hits.4._id: n1 }
  - match: { hits.hits.4._source.fresh: $big }
  - do: { search: { index: kt_luc, body: { query: { exists: { field: k } } } } }
  - match: { hits.total.value: 0 }
  - do:
      catch: missing
      get: { index: kt_luc, id: w1 }
  - do:
      catch: missing
      get: { index: kt_luc, id: b1 }
  # kt_px
  - do: { index: { index: kt_px, id: k1, refresh: true, body: { w: a, k: $big } } }
  - match: { result: created }
  - do:
      catch: bad_request
      index: { index: kt_px, id: w1, body: { w: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  - do:
      catch: bad_request
      index: { index: kt_px, id: t1, body: { t: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_t }
  - do:
      catch: bad_request
      index: { index: kt_px, id: v1, body: { v: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: 'DocValuesField "v" is too large, must be <= 32766' }
  - do:
      catch: bad_request
      index: { index: kt_px, id: a1, body: { w: [ b, $big ] } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  - do: { index: { index: kt_px, id: d1, body: { w: c, d: $big } } }
  - match: { result: created }
  - do: { bulk: { index: kt_px, body: [ {"index": {"_id": "b1"}}, {"w": $big}, {"index": {"_id": "b2"}}, {"w": "e"} ] } }
  - match: { errors: true }
  - match: { items.0.index.status: 400 }
  - match: { items.0.index.error.type: illegal_argument_exception }
  - match: { items.0.index.error.reason: $reason_w }
  - match: { items.1.index.status: 201 }
  - do: { index: { index: kt_px, id: u1, body: { w: f } } }
  - do:
      catch: bad_request
      update: { index: kt_px, id: u1, body: { doc: { w: $big } } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  # A field dynamic mapping adds is text with a .keyword ignored above 256: stored.
  - do: { index: { index: kt_px, id: n1, body: { w: g, fresh: $big } } }
  - match: { result: created }
  - do: { indices.refresh: { index: kt_px } }
  # What was acknowledged is there; what was refused is not.
  - do: { count: { index: kt_px } }
  - match: { count: 5 }
  - do: { search: { index: kt_px, body: { size: 10, sort: [ { w: asc } ] } } }
  - match: { hits.total.value: 5 }
  - match: { hits.hits.0._id: k1 }
  - match: { hits.hits.0._source.k: $big }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.1._source.d: $big }
  - match: { hits.hits.2._id: b2 }
  - match: { hits.hits.3._id: u1 }
  - match: { hits.hits.3._source.w: f }
  - match: { hits.hits.4._id: n1 }
  - match: { hits.hits.4._source.fresh: $big }
  - do: { search: { index: kt_px, body: { query: { exists: { field: k } } } } }
  - match: { hits.total.value: 0 }
  - do:
      catch: missing
      get: { index: kt_px, id: w1 }
  - do:
      catch: missing
      get: { index: kt_px, id: b1 }
  # kt_def
  - do: { index: { index: kt_def, id: k1, refresh: true, body: { w: a, k: $big } } }
  - match: { result: created }
  - do:
      catch: bad_request
      index: { index: kt_def, id: w1, body: { w: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  - do:
      catch: bad_request
      index: { index: kt_def, id: t1, body: { t: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_t }
  - do:
      catch: bad_request
      index: { index: kt_def, id: v1, body: { v: $big } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: 'DocValuesField "v" is too large, must be <= 32766' }
  - do:
      catch: bad_request
      index: { index: kt_def, id: a1, body: { w: [ b, $big ] } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  - do: { index: { index: kt_def, id: d1, body: { w: c, d: $big } } }
  - match: { result: created }
  - do: { bulk: { index: kt_def, body: [ {"index": {"_id": "b1"}}, {"w": $big}, {"index": {"_id": "b2"}}, {"w": "e"} ] } }
  - match: { errors: true }
  - match: { items.0.index.status: 400 }
  - match: { items.0.index.error.type: illegal_argument_exception }
  - match: { items.0.index.error.reason: $reason_w }
  - match: { items.1.index.status: 201 }
  - do: { index: { index: kt_def, id: u1, body: { w: f } } }
  - do:
      catch: bad_request
      update: { index: kt_def, id: u1, body: { doc: { w: $big } } }
  - match: { error.type: illegal_argument_exception }
  - match: { error.reason: $reason_w }
  # A field dynamic mapping adds is text with a .keyword ignored above 256: stored.
  - do: { index: { index: kt_def, id: n1, body: { w: g, fresh: $big } } }
  - match: { result: created }
  - do: { indices.refresh: { index: kt_def } }
  # What was acknowledged is there; what was refused is not.
  - do: { count: { index: kt_def } }
  - match: { count: 5 }
  - do: { search: { index: kt_def, body: { size: 10, sort: [ { w: asc } ] } } }
  - match: { hits.total.value: 5 }
  - match: { hits.hits.0._id: k1 }
