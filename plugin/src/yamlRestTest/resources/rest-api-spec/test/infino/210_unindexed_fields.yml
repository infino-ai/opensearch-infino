# A field the mapping does not index is kept in _source only: an object
# with enabled: false, a field left unmapped under dynamic: false, and every
# field of a mapping that sets enabled: false at its root. Its value may take
# a different shape in each document (an object, a string, an array), and
# every document is stored and returned whole, as stock stores it. A
# geo_point, which takes several shapes too, is kept whole in one column so
# every shape lands. Each case
# runs the same documents, one bulk each so each lands in its own commit,
# into a Lucene twin, a proxy-mode index and a default-mode index.
