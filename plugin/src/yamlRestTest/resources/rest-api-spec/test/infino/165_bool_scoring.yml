"A term on a field scored by another similarity keeps its boost, as a Lucene twin under that similarity scores it":
  # A boolean field, or a keyword field with use_similarity, scores a term by
  # BM25 under the default similarity. Under another (the index's default, or
  # the field's own), the table keeps the term's boost as its score: what
  # Lucene's boolean similarity gives a matching term.
  - do:
      indices.create:
        index: sim_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0, index.similarity.default.type: boolean }
          mappings: { dynamic: strict, properties: { f: { type: boolean }, tag: { type: keyword, use_similarity: true } } }
  - do:
      bulk:
        refresh: true
        index: sim_inf
        body:
          - index: { _id: "d1" }
          - {"f": true, "tag": "x"}
          - index: { _id: "d2" }
          - {"f": false, "tag": "y"}
  - match: { errors: false }
  - do:
      indices.create:
        index: sim_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0, index.similarity.default.type: boolean }
          mappings: { dynamic: strict, properties: { f: { type: boolean }, tag: { type: keyword, use_similarity: true } } }
