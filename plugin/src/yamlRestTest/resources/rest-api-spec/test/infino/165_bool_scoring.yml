"A keyword multi-field of a use_similarity keyword scores by its own mapping, as a Lucene twin scores it":
  # k scores a term by BM25 (idf of 1 of 2 documents / 2.2); k.plain, a
  # plain keyword, scores its boost. Before, k.plain took k's BM25.
  - skip:
      version: " - 2.99.99"
      reason: use_similarity on a keyword field comes with OpenSearch 3.0
  - do:
      indices.create:
        index: sf_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { k: { type: keyword, use_similarity: true, fields: { plain: { type: keyword } } } } }
  - do:
      indices.create:
        index: sf_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { k: { type: keyword, use_similarity: true, fields: { plain: { type: keyword } } } } }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: sf_inf
        body:
          - index: { _id: "d1" }
          - {"k": "a"}
          - index: { _id: "d2" }
          - {"k": "b"}
  - match: { errors: false }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: sf_luc
        body:
          - index: { _id: "d1" }
          - {"k": "a"}
          - index: { _id: "d2" }
          - {"k": "b"}
  - match: { errors: false }

  - do:
      search:
        index: sf_luc
        body: { query: {"term": {"k.plain": "a"}} }
  - match: { hits.total.value: 1 }
