"A request sorted by _score ascending takes the least score across indices, in default and proxy mode, as Lucene twins order it":
  # Two indices per mode, the least sum in one and the greatest in the other:
  # the shards' (default mode) and the indices' (proxy mode) hits merge by the
  # score ascending, as stock's coordinator merges them.
  - do:
      indices.create:
        index: asc_def_a
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { level: { type: keyword }, status: { type: long } } }
  - do:
      bulk:
        refresh: true
        index: asc_def_a
        body:
          - index: { _id: "asc_def_a" }
          - {"level": "a", "status": 1}
  - match: { errors: false }
  - do:
      indices.create:
        index: asc_def_b
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { level: { type: keyword }, status: { type: long } } }
  - do:
      bulk:
        refresh: true
        index: asc_def_b
        body:
          - index: { _id: "asc_def_b" }
          - {"level": "a", "status": 2}
  - match: { errors: false }
  - do:
      indices.create:
        index: asc_prx_a
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
