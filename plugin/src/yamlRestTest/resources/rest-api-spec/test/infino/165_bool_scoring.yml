        body: { query: {"term": {"k": "a"}} }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d1 }
  - gt: { hits.hits.0._score: 0.314067 }
  - lt: { hits.hits.0._score: 0.316067 }
  - do:
