  - gt: { hits.hits.1._score: 0.284643 }
  - lt: { hits.hits.1._score: 0.286643 }
  - match: { hits.hits.2._id: d4 }
  - gt: { hits.hits.2._score: 0.243998 }
  - lt: { hits.hits.2._score: 0.245998 }
  - match: { hits.hits.3._id: d5 }
  - gt: { hits.hits.3._score: 0.243998 }
  - lt: { hits.hits.3._score: 0.245998 }
  - match: { hits.hits.4._id: d2 }
