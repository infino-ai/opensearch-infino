          - index: { _id: "d1" }
          - {"t": "a warm coat", "k": ["x", "a"]}
          - index: { _id: "d2" }
          - {"t": "the coat on the long rack beside the other coat and a hat", "k": "b"}
          - index: { _id: "d3" }
          - {"t": "coat", "k": ["b", "a"]}
          - index: { _id: "d4" }
          - {"t": "a red shoe", "k": "a"}
          - index: { _id: "d5" }
          - {"t": "a blue hat", "k": ["b", "c"]}
  - match: { errors: false }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
