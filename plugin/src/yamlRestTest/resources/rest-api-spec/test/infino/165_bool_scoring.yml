"A request sorted by _doc keeps the index order, and one sorted by _score the score order, as a Lucene twin orders them":
  # The should clauses score d5 2.0 and d2 1.0. Sorted by _doc, stock
  # does not score and returns the hits in index order: d2, then d5.
  # Sorted by _score ascending, the least score comes first: d2, then d5.
  - do:
      indices.create:
        index: sd_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { k: { type: keyword }, n: { type: long } } }
  - do:
      indices.create:
        index: sd_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { k: { type: keyword }, n: { type: long } } }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: sd_inf
        body:
          - index: { _id: "d1" }
          - {"k": "a", "n": 1}
          - index: { _id: "d2" }
          - {"k": "b", "n": 2}
          - index: { _id: "d3" }
          - {"k": "a", "n": 3}
          - index: { _id: "d4" }
          - {"k": "a", "n": 4}
          - index: { _id: "d5" }
          - {"k": "b", "n": 5}
  - match: { errors: false }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: sd_luc
        body:
          - index: { _id: "d1" }
          - {"k": "a", "n": 1}
          - index: { _id: "d2" }
          - {"k": "b", "n": 2}
          - index: { _id: "d3" }
          - {"k": "a", "n": 3}
          - index: { _id: "d4" }
          - {"k": "a", "n": 4}
          - index: { _id: "d5" }
          - {"k": "b", "n": 5}
  - match: { errors: false }

  # Sorted by _doc: index order.
  - do:
      search:
        index: sd_luc
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": ["_doc"] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d2 }
  - match: { hits.hits.1._id: d5 }
  - do:
      search:
        index: sd_inf
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": ["_doc"] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d2 }
  - match: { hits.hits.1._id: d5 }

  # Sorted by _score: score order, as with no sort.
  - do:
      search:
        index: sd_luc
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": ["_score"] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d5 }
  - gt: { hits.hits.0._score: 1.999000 }
  - lt: { hits.hits.0._score: 2.001000 }
  - match: { hits.hits.1._id: d2 }
  - gt: { hits.hits.1._score: 0.999000 }
  - lt: { hits.hits.1._score: 1.001000 }
  - do:
      search:
        index: sd_inf
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": ["_score"] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d5 }
  - gt: { hits.hits.0._score: 1.999000 }
  - lt: { hits.hits.0._score: 2.001000 }
  - match: { hits.hits.1._id: d2 }
  - gt: { hits.hits.1._score: 0.999000 }
  - lt: { hits.hits.1._score: 1.001000 }

  # Sorted by _score ascending: the least score first, the whole page and its first hit alike.
  - do:
      search:
        index: sd_luc
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": [{"_score": "asc"}] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d2 }
  - gt: { hits.hits.0._score: 0.999000 }
  - lt: { hits.hits.0._score: 1.001000 }
  - match: { hits.hits.1._id: d5 }
  - gt: { hits.hits.1._score: 1.999000 }
  - lt: { hits.hits.1._score: 2.001000 }
  - do:
      search:
        index: sd_inf
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": [{"_score": "asc"}] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d2 }
  - gt: { hits.hits.0._score: 0.999000 }
  - lt: { hits.hits.0._score: 1.001000 }
  - match: { hits.hits.1._id: d5 }
  - gt: { hits.hits.1._score: 1.999000 }
  - lt: { hits.hits.1._score: 2.001000 }
  - do:
      search:
        index: sd_luc
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": [{"_score": "asc"}], "size": 1 }
  - match: { hits.total.value: 2 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: d2 }
  - gt: { hits.hits.0._score: 0.999000 }
  - lt: { hits.hits.0._score: 1.001000 }
  - do:
      search:
        index: sd_inf
        body: { "query": {"bool": {"should": [{"term": {"k": "b"}}, {"range": {"n": {"gte": 5}}}]}}, "sort": [{"_score": "asc"}], "size": 1 }
  - match: { hits.total.value: 2 }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: d2 }
  - gt: { hits.hits.0._score: 0.999000 }
  - lt: { hits.hits.0._score: 1.001000 }

