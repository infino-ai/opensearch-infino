"A term on a keyword field with use_similarity scores its BM25, as a Lucene twin scores it":
  # OpenSearch 2 has no use_similarity on a keyword field. The term matches
  # 3 of the 5 documents holding ks, so it scores idf(3, 5) / 2.2, 0.245, on
  # each, as the boolean term above does.
  - skip:
      version: " - 2.99.99"
      reason: use_similarity on a keyword field comes with OpenSearch 3.0
  - do:
      indices.create:
        index: sk_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { t: { type: text }, ks: { type: keyword, use_similarity: true } } }
  - do:
      indices.create:
        index: sk_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { t: { type: text }, ks: { type: keyword, use_similarity: true } } }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: sk_inf
        body:
          - index: { _id: "d1" }
          - {"t": "a warm coat", "ks": "y"}
          - index: { _id: "d2" }
          - {"t": "the coat on the long rack beside the other coat and a hat", "ks": "y"}
          - index: { _id: "d3" }
          - {"t": "coat", "ks": "x"}
          - index: { _id: "d4" }
          - {"t": "a red shoe", "ks": "x"}
          - index: { _id: "d5" }
          - {"t": "a blue hat", "ks": "x"}
  - match: { errors: false }
  # One bulk per index: a bulk mixing an Infino-backed index with others is refused.
  - do:
      bulk:
        refresh: true
        index: sk_luc
        body:
          - index: { _id: "d1" }
          - {"t": "a warm coat", "ks": "y"}
          - index: { _id: "d2" }
          - {"t": "the coat on the long rack beside the other coat and a hat", "ks": "y"}
          - index: { _id: "d3" }
