"A term on a field some documents give several values scores beside a match, as a Lucene twin scores it":
  # The term's membership in a list is a subquery by id, which the engine
  # plans in a filter only: in the score it is read through a join. Before,
  # the scored statement failed to plan.
  - do:
      indices.create:
        index: sm_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { t: { type: text }, k: { type: keyword } } }
  - do:
      indices.create:
