---
"Writes: an index named before it exists is created Infino-backed, and a bulk over several indices is served per index":
  # A bulk, an index request and an update with an upsert to indices that do not exist yet create them,
  # and the documents land in their tables, not in a shard.
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: new1, _id: "n1" }
          - { tag: x, n: 1 }
          - index: { _index: new2, _id: "m1" }
          - { tag: y, n: 2 }
          - index: { _index: new1, _id: "n2" }
          - { tag: x, n: 3 }
  - match: { errors: false }
  - match: { items.0.index._index: new1 }
  - match: { items.1.index._index: new2 }
  - match: { items.2.index._index: new1 }
  - match: { items.2.index._id: "n2" }
  - do:
      indices.get_settings:
        index: new1
  - match: { new1.settings.index.infino.enabled: "true" }
  - do:
      count:
        index: new1
  - match: { count: 2 }
  - do:
      count:
        index: new2
  - match: { count: 1 }
  - do:
      get:
        index: new2
        id: m1
  - match: { _source.n: 2 }
  - do:
      index:
        index: new3
        id: p1
        refresh: true
        body: { tag: z }
  - do:
      indices.get_settings:
        index: new3
  - match: { new3.settings.index.infino.enabled: "true" }
  - do:
      get:
        index: new3
        id: p1
  - match: { _source.tag: z }
  - do:
      update:
        index: new4
        id: q1
        refresh: true
        body: { doc: { n: 7 }, doc_as_upsert: true }
  - do:
      get:
        index: new4
        id: q1
  - match: { _source.n: 7 }
  - do:
      search:
        index: new*
        body: { size: 0 }
  - match: { hits.total.value: 5 }

  # A bulk over two existing indices answers each item in the bulk's order, failures included.
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: new2, _id: "m2" }
          - { tag: y, n: 4 }
          - create: { _index: new1, _id: "n1" }
          - { tag: x, n: 9 }
          - delete: { _index: new1, _id: "n2" }
          - index: { _index: new2, _id: "m3" }
          - { tag: y, n: 5 }
  - match: { errors: true }
  - match: { items.0.index._id: "m2" }
  - match: { items.0.index.status: 201 }
  - match: { items.1.create.status: 409 }
  - match: { items.2.delete._id: "n2" }
  - match: { items.2.delete.status: 200 }
  - match: { items.3.index._id: "m3" }
  - match: { items.3.index.status: 201 }
  - do:
      count:
        index: new1
  - match: { count: 1 }
  - do:
      count:
        index: new2
  - match: { count: 3 }

  # A write through an alias lands in the alias's index's table, as Dashboards writes its saved objects.
  - do:
      indices.put_alias:
        index: new2
        name: new-alias
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: new-alias, _id: "m4" }
          - { tag: y, n: 6 }
  - match: { errors: false }
  - match: { items.0.index._index: new2 }
  - do:
      index:
        index: new-alias
        id: m5
        refresh: true
        body: { tag: y, n: 7 }
  - match: { _index: new2 }
  - do:
      count:
        index: new2
  - match: { count: 5 }
  - do:
      get:
        index: new-alias
        id: m5
  - match: { _source.n: 7 }
  # The index's stats count the table's documents, and its shard holds no segment: nothing reached Lucene.
  - do:
      indices.stats:
        index: new2
        metric: docs
  # Created in default mode, the index's shard keeps each document's id, so its stats count them as a stock index's do.
  - match: { indices.new2.primaries.docs.count: 5 }

  # An array of objects under a nested mapping (what Dashboards' saved objects carry as references) is written whole and read back whole.
  - do:
      indices.create:
        index: new5
        body:
          settings: { number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              title: { type: keyword }
              references:
                type: nested
                properties:
                  name: { type: keyword }
                  type: { type: keyword }
                  id: { type: keyword }
  - do:
      index:
        index: new5
        id: v1
        refresh: true
        body: { title: "levels", references: [ { name: "panel_0", type: "visualization", id: "viz-1" }, { name: "panel_1", type: "visualization", id: "viz-2" } ] }
  - do:
      get:
        index: new5
        id: v1
  - match: { _source.title: levels }
  - match: { _source.references.1.id: viz-2 }
  - length: { _source.references: 2 }
  - do:
      search:
        index: new5
        body: { query: { term: { title: levels } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._source.references.0.name: panel_0 }

---
"A bulk over an index with no active primary answers its items, and the other index's items are written":
  - do:
      indices.create:
        index: up1
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
  # Its primary needs a node the cluster does not have, so it never becomes active.
  - do:
      indices.create:
        index: down1
        wait_for_active_shards: "0"
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0, index.routing.allocation.require._name: no-such-node }
  - do:
      bulk:
        refresh: true
        timeout: 1s
        body:
          - index: { _index: up1, _id: "u1" }
          - { n: 1 }
          - index: { _index: down1, _id: "d1" }
          - { n: 2 }
          - create: { _index: up1, _id: "u2" }
          - { n: 3 }
  # As stock answers it: the bulk succeeds, the items of the index with no primary fail
  # with the primary unavailable, and the others are written.
  - match: { errors: true }
  - match: { items.0.index._index: up1 }
  - match: { items.0.index.result: created }
  - match: { items.1.index._index: down1 }
  - match: { items.1.index.status: 503 }
  - match: { items.1.index.error.type: unavailable_shards_exception }
  - match: { items.2.create._index: up1 }
  - match: { items.2.create.result: created }
  - do:
      count:
        index: up1
  - match: { count: 2 }
