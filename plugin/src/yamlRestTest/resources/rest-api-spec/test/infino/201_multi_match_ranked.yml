---
"A multi_match over several text fields ranks as a Lucene twin ranks it":
  # Stock scores a multi_match as a dis_max over its fields: best_fields and
  # phrase by the best field, most_fields (or a tie_breaker of 1) by their
  # sum, each field weighted by its boost and the query's. Proxy and default
  # mode rank the same way. Every document is under 16 tokens, so the engine
  # keeps the same lengths as Lucene and the scores agree.
  - do:
      indices.create:
        index: mm_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { title: { type: text }, body: { type: text }, n: { type: integer } } }
  - do:
      indices.create:
        index: mm_proxy
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { title: { type: text }, body: { type: text }, n: { type: integer } } }
  - do:
      indices.create:
        index: mm_default
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { dynamic: strict, properties: { title: { type: text }, body: { type: text }, n: { type: integer } } }
  - do:
      bulk:
        refresh: true
        index: mm_luc
        body:
          - index: { _id: "d1" }
          - {"title": "disk", "body": "error on the old disk", "n": 1}
          - index: { _id: "d2" }
          - {"title": "disk error", "body": "fan noise", "n": 2}
          - index: { _id: "d3" }
          - {"title": "cpu", "body": "disk error disk", "n": 3}
          - index: { _id: "d4" }
          - {"title": "error report", "body": "error log", "n": 4}
          - index: { _id: "d5" }
          - {"title": "fan", "body": "noise", "n": 5}
          - index: { _id: "d6" }
          - {"title": "disk full", "body": "disk error now gone", "n": 6}
  - match: { errors: false }
