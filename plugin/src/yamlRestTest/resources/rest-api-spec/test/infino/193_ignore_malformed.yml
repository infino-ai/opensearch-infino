"A terms aggregation on a keyword whose normalizer changes its values is refused, not answered with the written values":
  - do:
      indices.create:
        index: ink_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
