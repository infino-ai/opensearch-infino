      indices.create:
        index: ink_px
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { nk: { type: keyword, normalizer: lowercase } } }
  - do:
      indices.create:
        index: ink_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { nk: { type: keyword, normalizer: lowercase } } }
  - do: { bulk: { refresh: true, index: ink_luc, body: [ {"index": {"_id": "1"}}, {"nk": "Foo"}, {"index": {"_id": "2"}}, {"nk": "FOO"} ] } }
  - match: { errors: false }
  - do: { bulk: { refresh: true, index: ink_px, body: [ {"index": {"_id": "1"}}, {"nk": "Foo"}, {"index": {"_id": "2"}}, {"nk": "FOO"} ] } }
