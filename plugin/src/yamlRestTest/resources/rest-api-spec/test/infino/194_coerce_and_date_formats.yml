"Default mode: a slash date dynamic mapping detects is stored as its instant":
  - do:
      indices.create:
        index: dyn_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
  - do:
      bulk:
        refresh: true
        body:
          - { index: { _index: dyn_def, _id: "1" } }
          - { ts: "2026/11/24 10:00:00" }
  - is_false: errors
  - do: { indices.get_mapping: { index: dyn_def } }
  - match: { dyn_def.mappings.properties.ts.type: date }
  - match: { dyn_def.mappings.properties.ts.format: "yyyy/MM/dd HH:mm:ss||yyyy/MM/dd||epoch_millis" }
  # Once the field is mapped, later documents carry no new field.
  - do:
      bulk:
        refresh: true
        body:
          - { index: { _index: dyn_def, _id: "2" } }
          - { ts: "2026/11/25 08:30:00" }
          - { index: { _index: dyn_def, _id: "3" } }
          - { ts: "2026/11/26" }
  - is_false: errors
