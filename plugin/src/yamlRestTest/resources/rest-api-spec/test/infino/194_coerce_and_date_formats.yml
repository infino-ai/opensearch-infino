# A fractional number in an integer field, and dates in the formats a
# field's mapping names, as stock answers them (issues #132 and #218), in
# default mode, proxy mode and on a Lucene index. With coerce on, the value
# is truncated in the column and _source keeps what the client sent; with
# coerce: false the write is refused. A date in any format its mapping
# accepts, including the slash dates dynamic mapping detects, is stored as
# its instant and found by get, search, sort, range and date_histogram.

---
"Default mode: a fractional number in an integer field is truncated, and refused with coerce false":
  - do:
      indices.create:
        index: co_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              status: { type: long }
              small: { type: short }
              strict: { type: integer, coerce: false }
  - do: { index: { index: co_def, id: "1", refresh: true, body: { status: 200.7, small: 3.9 } } }
  - match: { result: created }
  - do: { get: { index: co_def, id: "1" } }
  - match: { _source.status: 200.7 }
  - match: { _source.small: 3.9 }
  - do: { search: { index: co_def, rest_total_hits_as_int: true, body: { query: { term: { status: 200 } } } } }
  - match: { hits.total: 1 }
  - do: { search: { index: co_def, rest_total_hits_as_int: true, body: { query: { term: { small: 3 } } } } }
  - match: { hits.total: 1 }
  - do:
      search:
        index: co_def
        body: { size: 1, sort: [ { status: asc } ], aggs: { total: { sum: { field: status } }, codes: { terms: { field: status } } } }
  - match: { hits.hits.0.sort.0: 200 }
  - match: { aggregations.total.value: 200.0 }
  - match: { aggregations.codes.buckets.0.key: 200 }
  - do:
      catch: bad_request
      index: { index: co_def, id: "2", body: { strict: 3.5 } }
  - match: { error.type: mapper_parsing_exception }
  - do:
      bulk:
        refresh: true
        body:
          - { index: { _index: co_def, _id: "3" } }
          - { strict: 3.5 }
          - { index: { _index: co_def, _id: "4" } }
          - { strict: 4, status: 9.99 }
  - is_true: errors
  - match: { items.0.index.status: 400 }
  - match: { items.0.index.error.type: mapper_parsing_exception }
  - match: { items.1.index.status: 201 }
  - do: { count: { index: co_def } }
  - match: { count: 2 }
  - do: { search: { index: co_def, rest_total_hits_as_int: true, body: { query: { term: { status: 9 } } } } }
  - match: { hits.total: 1 }
  - match: { hits.hits.0._id: "4" }
  - do:
      catch: missing
      get: { index: co_def, id: "3" }
  # A partial update merges a fraction into the document the same way.
  - do: { update: { index: co_def, id: "4", refresh: true, body: { doc: { small: 7.2 } } } }
  - match: { result: updated }
  - do: { get: { index: co_def, id: "4" } }
  - match: { _source.small: 7.2 }
  - match: { _source.status: 9.99 }
  - do: { search: { index: co_def, rest_total_hits_as_int: true, body: { query: { term: { small: 7 } } } } }
  - match: { hits.total: 1 }
  - match: { hits.hits.0._id: "4" }
  - do:
      catch: bad_request
      update: { index: co_def, id: "4", body: { doc: { strict: 1.5 } } }
  - match: { error.type: mapper_parsing_exception }
  - do: { get: { index: co_def, id: "4" } }
  - match: { _source.strict: 4 }

