---
"Security: the security plugin's document, field and masking rules are enforced from the table":
  - skip:
      features: headers
  - do:
      indices.create:
        index: sec1
        body:
          settings: { number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              secret: { type: keyword }
              ip: { type: keyword }
              n: { type: long }
              title: { type: text }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: sec1, _id: "s1" }
          - { tag: x, secret: alpha, ip: "10.0.0.1", n: 1, title: "wool coat" }
          - index: { _index: sec1, _id: "s2" }
          - { tag: y, secret: beta, ip: "10.0.0.2", n: 2, title: "silk scarf" }
          - index: { _index: sec1, _id: "s3" }
          - { tag: x, secret: gamma, ip: "10.0.0.1", n: 3, title: "wool hat" }
  - match: { errors: false }

  # A user with plain read access sees the index whole.
  - do:
      headers: { Authorization: "Basic cGxhaW5fdXNlcjphZG1pbg==" }
      search:
        index: sec1
        body: { size: 0 }
  - match: { hits.total.value: 3 }

  # The document rule (tag is x) narrows hits, totals, aggregations, count, get and mget alike.
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec1
        body:
          sort: [ { n: asc } ]
          aggs:
            tags: { terms: { field: tag } }
            total_n: { sum: { field: n } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "s1" }
  - match: { hits.hits.1._id: "s3" }
  - length: { aggregations.tags.buckets: 1 }
  - match: { aggregations.tags.buckets.0.key: x }
  - match: { aggregations.total_n.value: 4 }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec1
        body: { size: 0, query: { match: { title: silk } } }
  - match: { hits.total.value: 0 }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      count:
        index: sec1
  - match: { count: 2 }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      get:
        index: sec1
        id: s1
  - match: { found: true }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      catch: missing
      get:
        index: sec1
        id: s2
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      mget:
        body: { docs: [ { _index: sec1, _id: "s2" }, { _index: sec1, _id: "s3" } ] }
  - match: { docs.0.found: false }
  - match: { docs.1.found: true }

  # The field rule (no secret): the field leaves no source, no fields entry, matches nothing and cannot be aggregated.
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec1
        body:
          sort: [ { n: asc } ]
          fields: [ "*" ]
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._source.tag: x }
  - is_false: hits.hits.0._source.secret
  - is_false: hits.hits.0.fields.secret
  - match: { hits.hits.0.fields.tag: [ x ] }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec1
        body: { size: 0, query: { term: { secret: alpha } } }
  - match: { hits.total.value: 0 }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      catch: bad_request
      search:
        index: sec1
        body: { size: 0, aggs: { secrets: { terms: { field: secret } } } }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      get:
        index: sec1
        id: s1
  - match: { _source.tag: x }
  - is_false: _source.secret
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      mget:
        body: { docs: [ { _index: sec1, _id: "s2" } ] }
  - match: { docs.0._source.tag: y }
  - is_false: docs.0._source.secret

  # The masked field (ip) leaves as its hash, the same hash in hits, gets and bucket keys; a sort on it is refused.
  - do:
      headers: { Authorization: "Basic bWFza191c2VyOmFkbWlu" }
      search:
        index: sec1
        body:
          sort: [ { n: asc } ]
          aggs:
            ips: { terms: { field: ip, order: { _count: desc } } }
  - match:
      hits.hits.0._source.ip: /^[0-9a-f]{64}$/
  - set: { hits.hits.0._source.ip: masked }
  - match: { hits.hits.2._source.ip: $masked }
  - match: { hits.hits.0._source.tag: x }
  - match: { aggregations.ips.buckets.0.key: $masked }
  - match: { aggregations.ips.buckets.0.doc_count: 2 }
  - do:
      headers: { Authorization: "Basic bWFza191c2VyOmFkbWlu" }
      get:
        index: sec1
        id: s1
  - match: { _source.ip: $masked }
  - do:
      headers: { Authorization: "Basic bWFza191c2VyOmFkbWlu" }
      catch: forbidden
      search:
        index: sec1
        body: { size: 0, sort: [ { ip: asc } ] }
  - do:
      headers: { Authorization: "Basic bWFza191c2VyOmFkbWlu" }
      catch: forbidden
      search:
        index: sec1
        body: { size: 0, aggs: { ips: { cardinality: { field: ip } } } }

  # The admin is unrestricted.
  - do:
      get:
        index: sec1
        id: s2
  - match: { _source.secret: beta }
  - match: { _source.ip: "10.0.0.2" }

  # A write under a rule is refused whole: it would read the document it
  # replaces or merges into, and put fields the rule hides.
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      catch: forbidden
      index:
        index: sec1
        id: s4
        body: { tag: x, secret: delta, ip: "10.0.0.4", n: 4, title: "wool socks" }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      catch: forbidden
      update:
        index: sec1
        id: s1
        body: { doc: { n: 10 } }
  - do:
      headers: { Authorization: "Basic bWFza191c2VyOmFkbWlu" }
      catch: forbidden
      bulk:
        body:
          - index: { _index: sec1, _id: "s5" }
          - { tag: y, secret: eps, ip: "10.0.0.5", n: 5, title: "felt hat" }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      catch: forbidden
      delete:
        index: sec1
        id: s1
  # Nothing of that landed: the admin still counts three.
  - do:
      count:
        index: sec1
  - match: { count: 3 }
  - do:
      get:
        index: sec1
        id: s1
  - match: { _source.n: 1 }

---
"Security parity: the table answers a restricted user as the security plugin answers over Lucene":
  - skip:
      features: headers
  # The same documents in an Infino-backed index and in a Lucene one the
  # security plugin's own shard-level enforcement serves.
  - do:
      indices.create:
        index: sec3
        body:
          settings: { number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              secret: { type: keyword }
              ip: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: sec3l
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              secret: { type: keyword }
              ip: { type: keyword }
              n: { type: long }
  # One bulk per index: a bulk mixing Infino-backed indices with others is refused.
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: sec3, _id: "p1" }
          - { tag: x, secret: alpha, ip: "10.0.0.1", n: 1 }
          - index: { _index: sec3, _id: "p2" }
          - { tag: y, secret: beta, ip: "10.0.0.2", n: 2 }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: sec3l, _id: "p1" }
          - { tag: x, secret: alpha, ip: "10.0.0.1", n: 1 }
          - index: { _index: sec3l, _id: "p2" }
          - { tag: y, secret: beta, ip: "10.0.0.2", n: 2 }
  - match: { errors: false }
  # The document rule: the same total on both.
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec3l
        body: { size: 0 }
  - set: { hits.total.value: lucene_total }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec3
        body: { size: 0 }
  - match: { hits.total.value: $lucene_total }
  - match: { hits.total.value: 1 }
  # The field rule: a query on the hidden field matches nothing on either, one on a visible field matches alike.
  # (Sources are compared through queries and aggregations: the runner sends documents in a random
  # content type, and the security plugin's own source filter reads a Lucene source as JSON only.)
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec3l
        body: { size: 0, query: { term: { secret: beta } } }
  - set: { hits.total.value: lucene_hidden }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec3
        body: { size: 0, query: { term: { secret: beta } } }
  - match: { hits.total.value: $lucene_hidden }
  - match: { hits.total.value: 0 }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec3l
        body: { size: 0, query: { term: { tag: y } } }
  - set: { hits.total.value: lucene_visible }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec3
        body: { size: 0, query: { term: { tag: y } } }
  - match: { hits.total.value: $lucene_visible }
  - match: { hits.total.value: 1 }
  # The masked field: the same hash in the fields of a hit on both, since both use the security plugin's own hash and salt.
  - do:
      headers: { Authorization: "Basic bWFza191c2VyOmFkbWlu" }
      search:
        index: sec3l
        body: { size: 1, _source: false, docvalue_fields: [ "ip" ], sort: [ { n: asc } ] }
  - set: { hits.hits.0.fields.ip.0: lucene_masked }
  - do:
      headers: { Authorization: "Basic bWFza191c2VyOmFkbWlu" }
      search:
        index: sec3
        body: { size: 1, _source: false, docvalue_fields: [ "ip" ], sort: [ { n: asc } ] }
  - match: { hits.hits.0.fields.ip.0: $lucene_masked }
  - match:
      hits.hits.0.fields.ip.0: /^[0-9a-f]{64}$/

---
"Security parity: a filtered alias under a document or field rule reads as over Lucene":
  - skip:
      features: headers
  - do:
      indices.create:
        index: sec5
        body:
          settings: { number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { tag: { type: keyword }, secret: { type: keyword }, n: { type: long } } }
  - do:
      indices.create:
        index: sec5l
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { tag: { type: keyword }, secret: { type: keyword }, n: { type: long } } }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: sec5, _id: "f1" }
          - { tag: x, secret: alpha, n: 1 }
          - index: { _index: sec5, _id: "f2" }
          - { tag: y, secret: beta, n: 2 }
          - index: { _index: sec5, _id: "f3" }
          - { tag: x, secret: gamma, n: 3 }
          - index: { _index: sec5, _id: "f4" }
          - { tag: x, secret: beta, n: 4 }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: sec5l, _id: "f1" }
          - { tag: x, secret: alpha, n: 1 }
          - index: { _index: sec5l, _id: "f2" }
          - { tag: y, secret: beta, n: 2 }
          - index: { _index: sec5l, _id: "f3" }
          - { tag: x, secret: gamma, n: 3 }
          - index: { _index: sec5l, _id: "f4" }
          - { tag: x, secret: beta, n: 4 }
  - match: { errors: false }
  - do:
      indices.update_aliases:
        body:
          actions:
            - add: { index: sec5, alias: sec5_big, filter: { range: { n: { gte: 2 } } } }
            - add: { index: sec5l, alias: sec5l_big, filter: { range: { n: { gte: 2 } } } }
            - add: { index: sec5, alias: sec5_beta, filter: { term: { secret: beta } } }
            - add: { index: sec5l, alias: sec5l_beta, filter: { term: { secret: beta } } }

  # The document rule (tag is x) and the alias's filter (n of 2 or more) both hold, in
  # the hits, the total and an aggregation alike.
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec5l_big
        body: { aggs: { total_n: { sum: { field: n } } } }
  - set: { hits.total.value: lucene_total }
  - set: { aggregations.total_n.value: lucene_sum }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec5_big
        body: { sort: [ { n: asc } ], aggs: { total_n: { sum: { field: n } } } }
  - match: { hits.total.value: $lucene_total }
  - match: { aggregations.total_n.value: $lucene_sum }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: f3 }
  - match: { hits.hits.1._id: f4 }
  - match: { aggregations.total_n.value: 7 }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      count:
        index: sec5_big
  - match: { count: 2 }

  # Every page of a scroll reads through both: no page widens to the index whole.
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec5_big
        scroll: 1m
        body: { size: 1, sort: [ { n: asc } ] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: f3 }
  - set: { _scroll_id: scroll_id }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      scroll:
        body: { scroll_id: $scroll_id, scroll: 1m }
  - length: { hits.hits: 1 }
  - match: { hits.hits.0._id: f4 }
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      scroll:
        body: { scroll_id: $scroll_id, scroll: 1m }
  - length: { hits.hits: 0 }

  # An alias whose filter names a field the field rule hides: the filter reads the field
  # as the user's own query would, as unmapped, on both.
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec5l_beta
        body: { size: 0 }
  - set: { hits.total.value: lucene_hidden }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      search:
        index: sec5_beta
        body: { size: 0 }
  - match: { hits.total.value: $lucene_hidden }
  # A user who may see the field reads what the filter keeps.
  - do:
      headers: { Authorization: "Basic cGxhaW5fdXNlcjphZG1pbg==" }
      search:
        index: sec5_beta
        body: { size: 0 }
  - match: { hits.total.value: 2 }

  # SQL through the aliases reads as a search through them does.
  - do:
      headers: { Authorization: "Basic ZGxzX3VzZXI6YWRtaW4=" }
      infino.sql:
        body: { query: "SELECT count(*) AS c FROM sec5_big" }
  - match: { rows.0.c: 2 }
  - do:
      headers: { Authorization: "Basic ZmxzX3VzZXI6YWRtaW4=" }
      infino.sql:
        body: { query: "SELECT count(*) AS c FROM sec5_beta" }
  - match: { rows.0.c: $lucene_hidden }
  - do:
      headers: { Authorization: "Basic cGxhaW5fdXNlcjphZG1pbg==" }
      infino.sql:
        body: { query: "SELECT count(*) AS c FROM sec5_beta" }
  - match: { rows.0.c: 2 }

---
"Security: a user authenticated by an API token is answered as the security plugin answers over Lucene":
  - skip:
      version: " - 3.8.99"
      reason: the security plugin issues API tokens from 3.9
      features: headers
  - do:
      indices.create:
        index: sec4
        body:
          settings: { number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: sec4l
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              tag: { type: keyword }
              n: { type: long }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: sec4, _id: "k1" }
          - { tag: x, n: 1 }
          - index: { _index: sec4, _id: "k2" }
          - { tag: y, n: 2 }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        body:
          - index: { _index: sec4l, _id: "k1" }
          - { tag: x, n: 1 }
          - index: { _index: sec4l, _id: "k2" }
          - { tag: y, n: 2 }
  - match: { errors: false }
  # A token with plain read access to both indices, created by the admin.
  - do:
      security.apitokens_create:
        body:
          name: "sec4reader"
          cluster_permissions: [ "cluster_composite_ops_ro" ]
          index_permissions:
            - index_pattern: [ "sec4*" ]
              allowed_actions: [ "read", "indices:admin/mappings/get" ]
          duration_seconds: 3600
  - set: { token: token }
  - do:
      headers: { Authorization: "apikey ${token}" }
      search:
        index: sec4l
        body: { size: 0 }
  - set: { hits.total.value: lucene_total }
  - do:
      headers: { Authorization: "apikey ${token}" }
      search:
        index: sec4
        body: { size: 0 }
  - match: { hits.total.value: $lucene_total }
  - do:
      headers: { Authorization: "apikey ${token}" }
      get:
        index: sec4l
        id: k1
  - set: { _source.tag: lucene_tag }
  - do:
      headers: { Authorization: "apikey ${token}" }
      get:
        index: sec4
        id: k1
  - match: { _source.tag: $lucene_tag }
