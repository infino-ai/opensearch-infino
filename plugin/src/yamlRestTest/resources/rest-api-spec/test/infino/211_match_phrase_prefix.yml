  - match: { hits.hits.2._id: "8" }
  - do:
      count:
        index: mpp_prx
        body: { query: { bool: { filter: [ { match_phrase_prefix: { title: "das" } } ], must_not: [ { match_phrase_prefix: { title: "my das" } } ] } } }
