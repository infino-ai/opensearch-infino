        body: { query: { match_phrase_prefix: { nope: "logs" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 0 }
  - do:
      count:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { nope: "logs" } } }
  - match: { count: 0 }
  # match_phrase_prefix inside a bool should beside a simple_query_string, as Dashboards' saved-object search sends it
  - do:
      search:
        index: mpp_luc
        body: { query: { bool: { should: [ { simple_query_string: { query: "logs*", fields: [ title ], default_operator: OR } }, { match_phrase_prefix: { title: "logs" } } ], minimum_should_match: 1 } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
