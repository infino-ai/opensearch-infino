---
"match_phrase_prefix matches as on a Lucene twin, in default and proxy mode":
  # The same documents in a Lucene twin, a default-mode and a proxy-mode index.
  - do:
      indices.create:
        index: mpp_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: integer }
              title: { type: text, fields: { keyword: { type: keyword } } }
              kw: { type: keyword }
  - do:
      indices.create:
        index: mpp_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: integer }
              title: { type: text, fields: { keyword: { type: keyword } } }
              kw: { type: keyword }
  - do:
      indices.create:
        index: mpp_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: integer }
              title: { type: text, fields: { keyword: { type: keyword } } }
              kw: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: mpp_luc
        body:
          - index: { _id: "1" }
          - { n: 1, title: "logs-web dashboard", kw: "logs-web" }
          - index: { _id: "2" }
          - { n: 2, title: "Logstash pipeline", kw: "Logstash" }
          - index: { _id: "3" }
          - { n: 3, title: "my dashboard of logs", kw: "my" }
          - index: { _id: "4" }
          - { n: 4, title: "my dash 🦊 board", kw: "fox" }
          - index: { _id: "5" }
          - { n: 5, title: [ "my dash", "board games" ], kw: "games" }
          - index: { _id: "6" }
          - { n: 6, title: "Dashboard for my logs", kw: "for" }
          - index: { _id: "7" }
          - { n: 7, title: "my_dashboard", kw: "my_dashboard" }
          - index: { _id: "8" }
          - { n: 8, title: "a dash board here", kw: "here" }
  - do:
      bulk:
        refresh: true
        index: mpp_def
        body:
          - index: { _id: "1" }
          - { n: 1, title: "logs-web dashboard", kw: "logs-web" }
          - index: { _id: "2" }
          - { n: 2, title: "Logstash pipeline", kw: "Logstash" }
          - index: { _id: "3" }
          - { n: 3, title: "my dashboard of logs", kw: "my" }
          - index: { _id: "4" }
          - { n: 4, title: "my dash 🦊 board", kw: "fox" }
          - index: { _id: "5" }
          - { n: 5, title: [ "my dash", "board games" ], kw: "games" }
          - index: { _id: "6" }
          - { n: 6, title: "Dashboard for my logs", kw: "for" }
          - index: { _id: "7" }
          - { n: 7, title: "my_dashboard", kw: "my_dashboard" }
          - index: { _id: "8" }
          - { n: 8, title: "a dash board here", kw: "here" }
  - do:
      bulk:
        refresh: true
        index: mpp_prx
        body:
          - index: { _id: "1" }
          - { n: 1, title: "logs-web dashboard", kw: "logs-web" }
          - index: { _id: "2" }
          - { n: 2, title: "Logstash pipeline", kw: "Logstash" }
          - index: { _id: "3" }
          - { n: 3, title: "my dashboard of logs", kw: "my" }
          - index: { _id: "4" }
          - { n: 4, title: "my dash 🦊 board", kw: "fox" }
          - index: { _id: "5" }
          - { n: 5, title: [ "my dash", "board games" ], kw: "games" }
          - index: { _id: "6" }
          - { n: 6, title: "Dashboard for my logs", kw: "for" }
          - index: { _id: "7" }
          - { n: 7, title: "my_dashboard", kw: "my_dashboard" }
          - index: { _id: "8" }
          - { n: 8, title: "a dash board here", kw: "here" }
  # match_phrase_prefix of one word matches a word starting with it, as on a Lucene twin
  # Stock analyzes the query: a trailing dash, as Dashboards leaves of logs-*, makes no word.
  - do:
      search:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: "logs" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
      count:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: "logs" } } }
  - match: { count: 4 }
  - do:
      search:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: "logs" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
      count:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: "logs" } } }
  - match: { count: 4 }
  - do:
      search:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: "logs" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
      count:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: "logs" } } }
  - match: { count: 4 }
  # match_phrase_prefix of one word with punctuation, as Dashboards sends for an index pattern
  - do:
      search:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: { query: "logs-" } } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
      count:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: { query: "logs-" } } } }
  - match: { count: 4 }
  - do:
      search:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: { query: "logs-" } } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
      count:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: { query: "logs-" } } } }
  - match: { count: 4 }
  - do:
      search:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: { query: "logs-" } } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
      count:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: { query: "logs-" } } } }
  - match: { count: 4 }
  # match_phrase_prefix of several words: the words adjacent and in order, the last a prefix
  # Not my_dashboard (one word to the analyzer), not my logs, and in either value of an array.
  - do:
      search:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: "my dash" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "3" }
  - match: { hits.hits.1._id: "4" }
  - match: { hits.hits.2._id: "5" }
  - do:
      count:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: "my dash" } } }
  - match: { count: 3 }
  - do:
      search:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: "my dash" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "3" }
  - match: { hits.hits.1._id: "4" }
  - match: { hits.hits.2._id: "5" }
  - do:
      count:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: "my dash" } } }
  - match: { count: 3 }
  - do:
      search:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: "my dash" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "3" }
  - match: { hits.hits.1._id: "4" }
  - match: { hits.hits.2._id: "5" }
  - do:
      count:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: "my dash" } } }
  - match: { count: 3 }
  # match_phrase_prefix never spans an emoji or two values of an array
  # An emoji is a word to the standard tokenizer; the values of an array lie apart.
  - do:
      search:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: "dash bo" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "8" }
  - do:
      count:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { title: "dash bo" } } }
  - match: { count: 1 }
  - do:
      search:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: "dash bo" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "8" }
  - do:
      count:
        index: mpp_def
        body: { query: { match_phrase_prefix: { title: "dash bo" } } }
  - match: { count: 1 }
  - do:
