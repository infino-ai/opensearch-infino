        body: { query: { bool: { should: [ { simple_query_string: { query: "logs*", fields: [ title ], default_operator: OR } }, { match_phrase_prefix: { title: "logs" } } ], minimum_should_match: 1 } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
      count:
        index: mpp_def
        body: { query: { bool: { should: [ { simple_query_string: { query: "logs*", fields: [ title ], default_operator: OR } }, { match_phrase_prefix: { title: "logs" } } ], minimum_should_match: 1 } } }
  - match: { count: 4 }
  - do:
      search:
        index: mpp_prx
        body: { query: { bool: { should: [ { simple_query_string: { query: "logs*", fields: [ title ], default_operator: OR } }, { match_phrase_prefix: { title: "logs" } } ], minimum_should_match: 1 } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "6" }
  - do:
