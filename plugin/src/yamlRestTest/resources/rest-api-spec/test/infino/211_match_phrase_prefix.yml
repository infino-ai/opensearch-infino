        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: { query: "--", zero_terms_query: all } } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 8 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "4" }
  - match: { hits.hits.4._id: "5" }
  - match: { hits.hits.5._id: "6" }
  - match: { hits.hits.6._id: "7" }
  - match: { hits.hits.7._id: "8" }
  - do:
      count:
        index: mpp_prx
        body: { query: { match_phrase_prefix: { title: { query: "--", zero_terms_query: all } } } }
  - match: { count: 8 }
  # match_phrase_prefix on an unmapped field matches nothing
  - do:
      search:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { nope: "logs" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 0 }
  - do:
      count:
        index: mpp_luc
        body: { query: { match_phrase_prefix: { nope: "logs" } } }
  - match: { count: 0 }
  - do:
      search:
        index: mpp_def
        body: { query: { match_phrase_prefix: { nope: "logs" } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 0 }
