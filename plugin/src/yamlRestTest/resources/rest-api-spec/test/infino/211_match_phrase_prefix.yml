        index: mpp_def
        body: { query: { bool: { should: [ { simple_query_string: { query: "my dash*", fields: [ title ], default_operator: AND } }, { match_phrase_prefix: { title: "my dash" } } ], minimum_should_match: 1 } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "3" }
  - match: { hits.hits.1._id: "4" }
  - match: { hits.hits.2._id: "5" }
  - match: { hits.hits.3._id: "6" }
  - do:
