---
"match_phrase_prefix is refused where stock refuses it or the table would read it otherwise":
  # The same documents in a Lucene twin, a default-mode and a proxy-mode index.
  - do:
      indices.create:
        index: mppr_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: integer }
              title: { type: text, fields: { keyword: { type: keyword } } }
              kw: { type: keyword }
  - do:
      indices.create:
        index: mppr_def
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: integer }
              title: { type: text, fields: { keyword: { type: keyword } } }
              kw: { type: keyword }
  - do:
      indices.create:
        index: mppr_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              n: { type: integer }
              title: { type: text, fields: { keyword: { type: keyword } } }
              kw: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: mppr_luc
