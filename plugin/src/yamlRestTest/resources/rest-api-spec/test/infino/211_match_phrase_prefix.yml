        body: { query: { bool: { should: [ { simple_query_string: { query: "my dash*", fields: [ title ], default_operator: AND } }, { match_phrase_prefix: { title: "my dash" } } ], minimum_should_match: 1 } } }
  - match: { count: 4 }
  # match_phrase_prefix in a filter and under must_not
  - do:
      search:
        index: mpp_luc
        body: { query: { bool: { filter: [ { match_phrase_prefix: { title: "das" } } ], must_not: [ { match_phrase_prefix: { title: "my das" } } ] } }, sort: [ { n: asc } ] }
  - match: { hits.total.value: 3 }
