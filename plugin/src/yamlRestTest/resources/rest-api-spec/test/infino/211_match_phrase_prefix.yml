        body: { query: { bool: { should: [ { simple_query_string: { query: "my dash*", fields: [ title ], default_operator: AND } }, { match_phrase_prefix: { title: "my dash" } } ], minimum_should_match: 1 } } }
  - match: { count: 4 }
  - do:
