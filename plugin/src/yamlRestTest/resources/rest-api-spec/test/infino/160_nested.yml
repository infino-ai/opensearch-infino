  - lt: { hits.hits.0._score: 1.361375 }
  - match: { hits.hits.1._id: d1 }
  - gt: { hits.hits.1._score: 1.284643 }
  - lt: { hits.hits.1._score: 1.286643 }
  - match: { hits.hits.2._id: d5 }
