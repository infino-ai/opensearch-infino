"minimum_should_match on a keyword default field":
  # A keyword field keeps a term whole, so stock matches foo-bar there as one
  # exact value and counts it as one clause. A run of words is one value
  # there too, which the plugin does not tell apart from a clause per word,
  # so it refuses that.
  - do:
      indices.create:
        index: qm5_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              tag: { type: keyword }
              k: { type: keyword }
  - do:
      indices.create:
        index: qm5_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              tag: { type: keyword }
              k: { type: keyword }
  - do:
      indices.create:
        index: qm5_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              tag: { type: keyword }
              k: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: qm5_luc
        body:
          - index: { _id: "d1" }
          - { k: "d1", tag: "foo-bar", body: "alpha beta" }
          - index: { _id: "d2" }
          - { k: "d2", tag: "foo", body: "alpha" }
          - index: { _id: "d3" }
          - { k: "d3", tag: "foo bar", body: "alpha" }
          - index: { _id: "d4" }
          - { k: "d4", tag: "foo-bar", body: "delta" }
          - index: { _id: "d5" }
          - { k: "d5", tag: "bar", body: "alpha" }
  - match: { errors: false }
