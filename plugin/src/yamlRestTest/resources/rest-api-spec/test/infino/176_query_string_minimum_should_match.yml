          - index: { _id: "d4" }
          - { k: "d4", tag: "foo-bar", body: "delta" }
          - index: { _id: "d5" }
          - { k: "d5", tag: "bar", body: "alpha" }
  - match: { errors: false }
  # foo-bar is one exact value of tag, and a lone term is no list.
  - do:
      search:
        index: qm5_luc
