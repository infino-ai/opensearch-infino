---
"query_string and simple_query_string read minimum_should_match, as a Lucene twin does":
  # Stock applies minimum_should_match to the optional clauses of the clause
  # list the string parses to. Before, the plugin never read it, so any one
  # optional word matched.
  - do:
      indices.create:
        index: qm_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              k: { type: keyword }
  - do:
      indices.create:
        index: qm_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              k: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: qm_inf
        body:
          - index: { _id: "d1" }
          - { k: "d1", body: "alpha beta gamma" }
          - index: { _id: "d2" }
          - { k: "d2", body: "alpha beta" }
          - index: { _id: "d3" }
          - { k: "d3", body: "alpha" }
          - index: { _id: "d4" }
          - { k: "d4", body: "delta" }
          - index: { _id: "d5" }
          - { k: "d5", body: "beta gamma" }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        index: qm_luc
        body:
          - index: { _id: "d1" }
          - { k: "d1", body: "alpha beta gamma" }
          - index: { _id: "d2" }
          - { k: "d2", body: "alpha beta" }
          - index: { _id: "d3" }
          - { k: "d3", body: "alpha" }
          - index: { _id: "d4" }
          - { k: "d4", body: "delta" }
          - index: { _id: "d5" }
          - { k: "d5", body: "beta gamma" }
  - match: { errors: false }

  # Two of three words: one engine query, narrowed by the count.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }

  # Every word.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: "100%" } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "d1" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: "100%" } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "d1" }

  # All but one.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: -1 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: -1 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }

  # A required word, and one of the optional ones.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+alpha beta gamma", default_field: body, minimum_should_match: 1 } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+alpha beta gamma", default_field: body, minimum_should_match: 1 } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }

  # The same with field clauses, which are not one engine query: the required clause is its own predicate.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+body:alpha body:beta body:gamma", minimum_should_match: 1 } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+body:alpha body:beta body:gamma", minimum_should_match: 1 } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }

  # Without it, the optional words beside a required one narrow nothing.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+alpha beta gamma", default_field: body } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d3" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+alpha beta gamma", default_field: body } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d3" }

  # Field clauses, which are not one engine query.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "body:alpha body:beta body:gamma", minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "body:alpha body:beta body:gamma", minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }

  # simple_query_string reads it the same way.
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { simple_query_string: { query: "alpha beta gamma", fields: [ body ], minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { simple_query_string: { query: "alpha beta gamma", fields: [ body ], minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d5" }

  # Unsorted, the page is ranked: every word first, then the pair with the
  # rarer word (gamma is in two documents, alpha in three).
  - do:
      search:
        index: qm_luc
        body:
          size: 10
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d5" }
  - match: { hits.hits.2._id: "d2" }
  - do:
      search:
        index: qm_inf
        body:
          size: 10
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d5" }
  - match: { hits.hits.2._id: "d2" }
  - set: { hits.hits.1._score: second }
  - set: { hits.hits.2._score: third }
  - gt: { hits.hits.0._score: $second }
  - gt: { hits.hits.1._score: $third }

  # More optional words than there are: stock matches nothing.
  - do:
      search:
        index: qm_luc
        body:
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: 4 } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm_inf
        body:
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: 4 } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm_luc
        body:
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: "200%" } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm_inf
        body:
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: "200%" } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm_luc
        body:
          query: { query_string: { query: "+alpha beta gamma", default_field: body, minimum_should_match: 3 } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm_inf
        body:
          query: { query_string: { query: "+alpha beta gamma", default_field: body, minimum_should_match: 3 } }
  - match: { hits.total.value: 0 }

  # A malformed form is the request's error, in either mode, of the type stock gives it.
  - do:
      indices.create:
        index: qm_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
  - do:
      index:
        index: qm_prx
        id: d1
        refresh: true
        body: { body: "alpha beta gamma" }
  - do:
      catch: bad_request
      search:
        index: qm_luc
        body:
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: "2<" } }
  - match: { error.root_cause.0.type: query_shard_exception }
  - do:
      catch: bad_request
      search:
        index: qm_inf
        body:
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: "2<" } }
  - match: { error.root_cause.0.type: query_shard_exception }
  - do:
      catch: bad_request
      search:
        index: qm_prx
        body:
          query: { query_string: { query: "alpha beta gamma", default_field: body, minimum_should_match: "2<" } }
  - match: { error.root_cause.0.type: query_shard_exception }

---
"minimum_should_match where stock's clause list is not the words as written":
  # Stock counts the optional clauses of the query Lucene's parser builds:
  # none under default_operator AND, a lone +clause as a list of one
  # required clause, and the clauses still built (and refused) first. Where
  # the plugin cannot count as stock does (a run of words over several
  # fields, a word the analyzer splits, simple_query_string's own operators)
  # it refuses the request rather than answer otherwise.
  - do:
      indices.create:
        index: qm2_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              title: { type: text }
              k: { type: keyword }
              n: { type: long }
  - do:
      indices.create:
        index: qm2_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              title: { type: text }
              k: { type: keyword }
              n: { type: long }
  - do:
      bulk:
        refresh: true
        index: qm2_inf
        body:
          - index: { _id: "d1" }
          - { k: "d1", n: 1, body: "alpha beta gamma" }
          - index: { _id: "d2" }
          - { k: "d2", n: 2, body: "alpha beta" }
          - index: { _id: "d3" }
          - { k: "d3", n: 3, body: "alpha", title: "beta" }
          - index: { _id: "d4" }
          - { k: "d4", n: 4, body: "delta" }
          - index: { _id: "d5" }
          - { k: "d5", n: 5, body: "beta gamma" }
          - index: { _id: "d6" }
          - { k: "d6", n: 6, body: "foo bar" }
          - index: { _id: "d7" }
          - { k: "d7", n: 7, body: "foo" }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        index: qm2_luc
        body:
          - index: { _id: "d1" }
          - { k: "d1", n: 1, body: "alpha beta gamma" }
          - index: { _id: "d2" }
          - { k: "d2", n: 2, body: "alpha beta" }
          - index: { _id: "d3" }
          - { k: "d3", n: 3, body: "alpha", title: "beta" }
          - index: { _id: "d4" }
          - { k: "d4", n: 4, body: "delta" }
          - index: { _id: "d5" }
          - { k: "d5", n: 5, body: "beta gamma" }
          - index: { _id: "d6" }
          - { k: "d6", n: 6, body: "foo bar" }
          - index: { _id: "d7" }
          - { k: "d7", n: 7, body: "foo" }
  - match: { errors: false }

  # A prohibited field clause beside the counted ones: two of alpha and beta, and never gamma.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "body:alpha body:beta -body:gamma", minimum_should_match: 2 } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "d2" }
  - do:
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "body:alpha body:beta -body:gamma", minimum_should_match: 2 } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "d2" }

  # No optional clause under default_operator AND: stock matches nothing.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, default_operator: AND, minimum_should_match: 2 } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta gamma", default_field: body, default_operator: AND, minimum_should_match: 2 } }
  - match: { hits.total.value: 0 }

  # Only a prohibited clause: none optional either.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "-delta", default_field: body, minimum_should_match: 1 } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "-delta", default_field: body, minimum_should_match: 1 } }
  - match: { hits.total.value: 0 }

  # A lone required clause is a list of one required clause, none optional.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+alpha", default_field: body, minimum_should_match: 1 } }
  - match: { hits.total.value: 0 }
  - do:
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "+alpha", default_field: body, minimum_should_match: 1 } }
  - match: { hits.total.value: 0 }

  # Without +, a lone term is no list, and the value changes nothing.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha", default_field: body, minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d3" }
  - do:
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha", default_field: body, minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d3" }

  # A numeric clause the field cannot read fails before anything is counted.
  - do:
      catch: bad_request
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "n:abc body:alpha body:beta", default_field: body, minimum_should_match: 4 } }
  - do:
      catch: bad_request
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "n:abc body:alpha body:beta", default_field: body, minimum_should_match: 4 } }

  # Over two fields, stock reads alpha beta as one dis_max clause and the count does not reach it; the plugin refuses.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta", fields: [ body, title ], minimum_should_match: 2 } }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d3" }
  - match: { hits.hits.3._id: "d5" }
  - do:
      catch: bad_request
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "alpha beta", fields: [ body, title ], minimum_should_match: 2 } }

  # foo-bar is one term that the analyzer makes two words of, and stock counts those; the plugin refuses.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "foo-bar", default_field: body, minimum_should_match: 2 } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "d6" }
  - do:
      catch: bad_request
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { query_string: { query: "foo-bar", default_field: body, minimum_should_match: 2 } }

  # In simple_query_string -gamma is an optional clause (the documents without gamma); the plugin refuses.
  - do:
      search:
        index: qm2_luc
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { simple_query_string: { query: "alpha beta -gamma", fields: [ body ], minimum_should_match: 2 } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "d1" }
  - match: { hits.hits.1._id: "d2" }
  - match: { hits.hits.2._id: "d3" }
  - do:
      catch: bad_request
      search:
        index: qm2_inf
        body:
          size: 10
          sort: [ { k: asc } ]
          query: { simple_query_string: { query: "alpha beta -gamma", fields: [ body ], minimum_should_match: 2 } }

---
"minimum_should_match beside a word the tokenizer splits by length, and a phrase holding an operator's word":
  # The standard tokenizer splits a word longer than 255 characters there, so
  # stock counts its pieces; the plugin serves 255 and refuses 256. In
  # simple_query_string a word inside a phrase is no operator.
  - do:
      indices.create:
        index: qm3_inf
        body:
          settings: { index.infino.enabled: true, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              k: { type: keyword }
  - do:
      indices.create:
        index: qm3_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              body: { type: text }
              k: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: qm3_inf
        body:
          - index: { _id: "d1" }
          - { k: "d1", body: "alpha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
          - index: { _id: "d2" }
          - { k: "d2", body: "alpha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
          - index: { _id: "d3" }
          - { k: "d3", body: "alpha or beta" }
          - index: { _id: "d4" }
          - { k: "d4", body: "beta" }
  - match: { errors: false }
  - do:
      bulk:
        refresh: true
        index: qm3_luc
        body:
          - index: { _id: "d1" }
          - { k: "d1", body: "alpha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
          - index: { _id: "d2" }
