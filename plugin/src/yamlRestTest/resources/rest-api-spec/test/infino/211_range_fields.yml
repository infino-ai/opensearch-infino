  - match: { aggregations.h.buckets.0.key: 0 }
  - match: { aggregations.h.buckets.0.doc_count: 1 }
  - match: { aggregations.h.buckets.1.key: 1000000 }
  - match: { aggregations.h.buckets.1.doc_count: 1 }
  - match: { aggregations.h.buckets.2.key: 1200000 }
