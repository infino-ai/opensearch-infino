---
"A histogram on a long_range field counts a document in every bucket its range reaches":
  - do:
      search: { index: rgf_luc, body: { size: 0, query: { range: { r: { lte: 1650000, relation: within } } }, aggs: { h: { histogram: { field: r, interval: 200000, min_doc_count: 1 } } } } }
