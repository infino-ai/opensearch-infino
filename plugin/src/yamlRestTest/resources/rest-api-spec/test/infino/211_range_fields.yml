  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d2 }

---
"A histogram on a long_range field counts a document in every bucket its range reaches":
  - do:
      search: { index: rf_luc, body: { size: 0, query: { range: { r: { lte: 1650000, relation: within } } }, aggs: { h: { histogram: { field: r, interval: 200000, min_doc_count: 1 } } } } }
  - length: { aggregations.h.buckets: 5 }
  - match: { aggregations.h.buckets.0.key: 0 }
  - match: { aggregations.h.buckets.0.doc_count: 1 }
  - match: { aggregations.h.buckets.1.key: 1000000 }
  - match: { aggregations.h.buckets.1.doc_count: 1 }
  - match: { aggregations.h.buckets.2.key: 1200000 }
  - match: { aggregations.h.buckets.2.doc_count: 3 }
  - match: { aggregations.h.buckets.3.key: 1400000 }
  - match: { aggregations.h.buckets.3.doc_count: 1 }
  - match: { aggregations.h.buckets.4.key: 1600000 }
  - match: { aggregations.h.buckets.4.doc_count: 1 }
  - do:
      search: { index: rf_prx, body: { size: 0, query: { range: { r: { lte: 1650000, relation: within } } }, aggs: { h: { histogram: { field: r, interval: 200000, min_doc_count: 1 } } } } }
