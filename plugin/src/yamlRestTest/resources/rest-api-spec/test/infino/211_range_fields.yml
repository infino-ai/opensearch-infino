  - do:
      bulk:
        refresh: true
        index: rgs_def
        body:
          - index: { _id: s0, routing: x0 }
          - { "r": { "gte": 1, "lte": 3 }, "k": "a", "n": 1 }
          - index: { _id: s1, routing: x0 }
