"What the columns cannot answer on a range field is refused, never answered with no hits":
  - do:
      catch: bad_request
      search: { index: rf_luc, body: { query: { prefix: { r: "1" } } } }
  - do:
      catch: bad_request
      search: { index: rf_prx, body: { query: { prefix: { r: "1" } } } }
  - do:
      catch: bad_request
      search: { index: rf_def, body: { query: { prefix: { r: "1" } } } }
  - do:
      search: { index: rf_luc, body: { query: { term: { ip: 10.1.2.3 } } } }
  - match: { hits.total.value: 1 }
  - do:
      catch: /a query on \[ip\], a field of type \[ip_range\], is not served/
      search: { index: rf_prx, body: { query: { term: { ip: 10.1.2.3 } } } }
  - do:
      catch: /over the range field \[r\] would create too many buckets/
      search: { index: rf_prx, body: { size: 0, aggs: { h: { histogram: { field: r, interval: 200000 } } } } }
  - do:
      catch: bad_request
      search: { index: rf_prx, body: { size: 0, aggs: { t: { terms: { field: r } } } } }
  - do:
      catch: /a query on \[ip\], a field of type \[ip_range\], is not served/
      search: { index: rf_def, body: { query: { term: { ip: 10.1.2.3 } } } }
  - do:
      catch: /over the range field \[r\] would create too many buckets/
      search: { index: rf_def, body: { size: 0, aggs: { h: { histogram: { field: r, interval: 200000 } } } } }
  - do:
      catch: bad_request
      search: { index: rf_def, body: { size: 0, aggs: { t: { terms: { field: r } } } } }
