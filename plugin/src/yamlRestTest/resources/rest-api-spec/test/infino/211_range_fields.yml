      search: { index: rgf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-01-01", lte: "2016-01-31", relation: within } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - do:
      search: { index: rgf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-05-01", lte: "2016-05-01", relation: contains } } } } }
