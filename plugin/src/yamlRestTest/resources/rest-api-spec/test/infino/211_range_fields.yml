# Range fields (long_range, date_range and the other numeric range types)
# are kept as two hidden columns, each range's lowest and highest value,
# both inclusive, so a range query with each relation, a term, terms and
# exists, and a histogram or date_histogram that counts a document in every
# bucket its range reaches, answer as stock does. Before, the field had no
# column: a range query matched nothing and a histogram was refused. What
# the columns cannot answer (a prefix query, any query on an ip_range, a
# histogram over a range that reaches more buckets than one request may
# build) is refused with 400, never answered with no hits. Each request runs
# on a Lucene twin, a proxy-mode index and a default-mode index.
setup:
  - do:
      indices.create:
        index: rf_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              r: { type: long_range }
              span: { type: date_range }
              ip: { type: ip_range }
              tag: { type: keyword }
              k: { type: keyword }
  - do:
      indices.create:
        index: rf_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              r: { type: long_range }
              span: { type: date_range }
              ip: { type: ip_range }
              tag: { type: keyword }
              k: { type: keyword }
  - do:
      indices.create:
        index: rf_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings:
            properties:
              r: { type: long_range }
              span: { type: date_range }
              ip: { type: ip_range }
              tag: { type: keyword }
              k: { type: keyword }
  - do:
      bulk:
        refresh: true
        index: rf_luc
        body:
          - index: { _id: d0 }
          - { "k": "d0", "r": { "gte": 1000000, "lte": 1600000 }, "span": { "gte": "2016-01-01", "lt": "2016-01-02" }, "ip": "10.0.0.0/8", "tag": "a" }
          - index: { _id: d1 }
          - { "k": "d1", "r": { "gt": 1300000, "lt": 1400000 }, "span": { "gte": "2016-01-02", "lt": "2016-01-03" }, "tag": "b" }
          - index: { _id: d2 }
          - { "k": "d2", "r": { "gte": 1700000 }, "span": { "gte": "2016-04-01" }, "tag": "a" }
          - index: { _id: d3 }
          - { "k": "d3", "r": [ { "gte": 0, "lte": 10 }, { "gte": 1250000, "lte": 1250000 } ], "span": { "lt": "2016-02-01" }, "tag": "b" }
          - index: { _id: d4 }
          - { "k": "d4", "tag": "c" }
  - do:
      bulk:
        refresh: true
        index: rf_prx
        body:
          - index: { _id: d0 }
          - { "k": "d0", "r": { "gte": 1000000, "lte": 1600000 }, "span": { "gte": "2016-01-01", "lt": "2016-01-02" }, "ip": "10.0.0.0/8", "tag": "a" }
          - index: { _id: d1 }
          - { "k": "d1", "r": { "gt": 1300000, "lt": 1400000 }, "span": { "gte": "2016-01-02", "lt": "2016-01-03" }, "tag": "b" }
          - index: { _id: d2 }
          - { "k": "d2", "r": { "gte": 1700000 }, "span": { "gte": "2016-04-01" }, "tag": "a" }
          - index: { _id: d3 }
          - { "k": "d3", "r": [ { "gte": 0, "lte": 10 }, { "gte": 1250000, "lte": 1250000 } ], "span": { "lt": "2016-02-01" }, "tag": "b" }
          - index: { _id: d4 }
          - { "k": "d4", "tag": "c" }
  - do:
      bulk:
        refresh: true
        index: rf_def
        body:
          - index: { _id: d0 }
          - { "k": "d0", "r": { "gte": 1000000, "lte": 1600000 }, "span": { "gte": "2016-01-01", "lt": "2016-01-02" }, "ip": "10.0.0.0/8", "tag": "a" }
          - index: { _id: d1 }
          - { "k": "d1", "r": { "gt": 1300000, "lt": 1400000 }, "span": { "gte": "2016-01-02", "lt": "2016-01-03" }, "tag": "b" }
          - index: { _id: d2 }
          - { "k": "d2", "r": { "gte": 1700000 }, "span": { "gte": "2016-04-01" }, "tag": "a" }
          - index: { _id: d3 }
          - { "k": "d3", "r": [ { "gte": 0, "lte": 10 }, { "gte": 1250000, "lte": 1250000 } ], "span": { "lt": "2016-02-01" }, "tag": "b" }
          - index: { _id: d4 }
          - { "k": "d4", "tag": "c" }

---
teardown:
  - do:
      indices.delete:
        index: rf_luc,rf_prx,rf_def
        ignore_unavailable: true

---
"A range query on a long_range field reads each relation as stock does":
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1200000, lte: 1300000 } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1200000, lte: 1300000 } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1200000, lte: 1300000 } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1000000, lte: 1600000, relation: within } } } } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d3 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1000000, lte: 1600000, relation: within } } } } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d3 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1000000, lte: 1600000, relation: within } } } } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d3 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1300000, lte: 1300000, relation: contains } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d0 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1300000, lte: 1300000, relation: contains } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d0 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gte: 1300000, lte: 1300000, relation: contains } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d0 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gt: 1600000 } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d2 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gt: 1600000 } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d2 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { gt: 1600000 } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d2 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { lt: 1000000 } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d3 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { lt: 1000000 } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d3 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { r: { lt: 1000000 } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d3 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { bool: { filter: [ { term: { tag: a } }, { range: { r: { gte: 1200000 } } } ] } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d2 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { bool: { filter: [ { term: { tag: a } }, { range: { r: { gte: 1200000 } } } ] } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d2 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { bool: { filter: [ { term: { tag: a } }, { range: { r: { gte: 1200000 } } } ] } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d2 }

---
"A term, terms or exists on a long_range field reads the ranges holding the value":
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { term: { r: 1350000 } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { term: { r: 1350000 } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { term: { r: 1350000 } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { terms: { r: [ 5, 1700000 ] } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d2 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { terms: { r: [ 5, 1700000 ] } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d2 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { terms: { r: [ 5, 1700000 ] } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d2 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { exists: { field: r } } } }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d2 }
  - match: { hits.hits.3._id: d3 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { exists: { field: r } } } }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d2 }
  - match: { hits.hits.3._id: d3 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { exists: { field: r } } } }
  - match: { hits.total.value: 4 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d2 }
  - match: { hits.hits.3._id: d3 }

---
"A date_range field reads its dates as stock does":
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { term: { span: "2016-01-02" } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d1 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { term: { span: "2016-01-02" } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d1 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { term: { span: "2016-01-02" } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d1 }
  - match: { hits.hits.1._id: d3 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-01-01||/M", lt: "2016-02-01" } } } } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d3 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-01-01||/M", lt: "2016-02-01" } } } } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d3 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-01-01||/M", lt: "2016-02-01" } } } } }
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - match: { hits.hits.2._id: d3 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-01-01", lte: "2016-01-31", relation: within } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - do:
      search: { index: rf_prx, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-01-01", lte: "2016-01-31", relation: within } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - do:
      search: { index: rf_def, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-01-01", lte: "2016-01-31", relation: within } } } } }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: d0 }
  - match: { hits.hits.1._id: d1 }
  - do:
      search: { index: rf_luc, body: { size: 10, sort: [ { k: asc } ], query: { range: { span: { gte: "2016-05-01", lte: "2016-05-01", relation: contains } } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: d2 }
