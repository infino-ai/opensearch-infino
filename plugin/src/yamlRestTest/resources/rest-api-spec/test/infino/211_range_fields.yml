"A histogram over several shards reads every shard's ranges, a cardinality or percentiles under it too":
  # The documents with several ranges are all in the second shard. A cardinality
  # or percentiles under the histogram is answered once over every shard's rows.
  - do:
      indices.create:
        index: rgs_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 2, number_of_replicas: 0 }
          mappings: { properties: { r: { type: long_range }, k: { type: keyword }, n: { type: long } } }
