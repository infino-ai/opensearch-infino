---
"A float_range keeps floats, and a range query's bounds in the wrong order are refused, as on stock":
  - do:
      indices.create:
        index: rfl_luc
        body:
          settings: { index.infino.enabled: false, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { f: { type: float_range }, r: { type: long_range } } }
  - do:
      bulk:
        refresh: true
        index: rfl_luc
        body:
          - index: { _id: a }
          - { "f": { "gt": 1 }, "r": { "gte": 1, "lte": 5 } }
          - index: { _id: b }
          - { "f": { "gte": 0.1, "lte": 0.1 } }
  - do:
      indices.create:
        index: rfl_prx
        body:
          settings: { index.infino.enabled: true, index.infino.mode: proxy, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { f: { type: float_range }, r: { type: long_range } } }
  - do:
      bulk:
        refresh: true
        index: rfl_prx
        body:
          - index: { _id: a }
          - { "f": { "gt": 1 }, "r": { "gte": 1, "lte": 5 } }
          - index: { _id: b }
          - { "f": { "gte": 0.1, "lte": 0.1 } }
  - do:
      indices.create:
        index: rfl_def
        body:
          settings: { index.infino.enabled: true, index.infino.mode: default, number_of_shards: 1, number_of_replicas: 0 }
          mappings: { properties: { f: { type: float_range }, r: { type: long_range } } }
  - do:
      bulk:
        refresh: true
        index: rfl_def
        body:
          - index: { _id: a }
          - { "f": { "gt": 1 }, "r": { "gte": 1, "lte": 5 } }
          - index: { _id: b }
          - { "f": { "gte": 0.1, "lte": 0.1 } }
  # 1.00000005 is the float 1, below the next float up from 1.
  - do:
      search: { index: rfl_luc, body: { query: { term: { f: 1.00000005 } } } }
  - match: { hits.total.value: 0 }
  - do:
      search: { index: rfl_luc, body: { query: { term: { f: 1.0000001 } } } }
  - match: { hits.total.value: 1 }
  # 0.10000000149 is the float 0.1, which the document holds.
  - do:
      search: { index: rfl_luc, body: { query: { term: { f: 0.10000000149 } } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: b }
  - do:
      catch: /Range query `from` value \(1.0\) is greater than `to` value \(0.5\)/
      search: { index: rfl_luc, body: { query: { range: { f: { gt: 0.99999999, lt: 0.5 } } } } }
  - do:
      catch: /Range query `from` value \(5\) is greater than `to` value \(3\)/
      search: { index: rfl_luc, body: { query: { range: { r: { gte: 5, lte: 3 } } } } }
  - do:
      search: { index: rfl_luc, body: { query: { range: { r: { gt: 5, lt: 6 } } } } }
  - match: { hits.total.value: 0 }
  # 1.00000005 is the float 1, below the next float up from 1.
  - do:
      search: { index: rfl_prx, body: { query: { term: { f: 1.00000005 } } } }
  - match: { hits.total.value: 0 }
  - do:
      search: { index: rfl_prx, body: { query: { term: { f: 1.0000001 } } } }
  - match: { hits.total.value: 1 }
